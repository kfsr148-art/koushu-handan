# 雲で回す（重い仕事を VAIO から逃がす道・2026-09-21・雲へ回す-1）
#
#   ＊VAIO は 4GB・回転盤の HDD で、重い台本を回すと空きを食って知らせごと詰まる。
#     そこで**重い仕事は雲で回し、結果だけを reports/ に書き戻す**道を一本引く。
#
#   ＊使い方
#       ① 回したい台本を `scratchpad/jobs/` へ置く（`*.js` は node、`*.ps1` は pwsh で回る）
#       ② 押す。その押しがこの走りの引き金になる（`scratchpad/jobs/*.js` と `*.ps1` の変化だけ）
#       ③ 走りが `reports/cloud-<台本の名>-<刻>.md` を書いて押し戻す
#       ④ こちらはその綴りを読んで札にする
#
#   ＊**枠の頭に「雲で：」と付いた物は、VAIO では回さない。**この道へ渡し、
#     戻ってきた `reports/cloud-*.md` を読んで札で返す。
#
#   ＊輪にならない造り … 引き金は `scratchpad/jobs/` の台本が変わった押しだけ。
#     書き戻す先は `reports/` なので、**書き戻しがもう一度この走りを起こすことはない**。
#     同じ台本を置いたままにしても、中身が変わらなければ二度は走らない。
#
#   ＊台本はそのまま残す（消さない）。何を回したかが綴りに残るようにするため。
#
#   ＊返事パネルの検査（panel-check）も、この道で回す（2026-09-23・panel-check は雲で-1）。
#     Edge を立てる検査を VAIO で回すと空きが 405MB まで落ち、常駐の見張りが止まった（09-23 22:45〜23:06）。
#     panel.html か panel-check.js が変わった押しで `scratchpad/jobs/panel-check.js` を回し、
#     結果を `reports/cloud-panel-check-<刻>.md` へ返す。**VAIO では panel-check を回さない。**
#   ＊本体の速い版の検査（node check-all --fast）も、この道で回す（2026-09-24・手元の検査を雲へ-1）。
#     koushu-handan.html・check.js・adv-check.js・check-all.js が変わった押しで `scratchpad/jobs/check-fast.js` を回し、
#     `reports/cloud-check-fast-<刻>.md` へ返す。**VAIO では check-all を回さない。**
#     配信の関門は今までどおり check.yml（速い版→フル版・落ちれば配信が止まる）。こちらは結果を返す側。
#   ＊押しで回るのは、**その押しで変わった台本だけ**（＋パネルが変わっていれば panel-check.js・本体が変わっていれば check-fast.js）。
#     変わった物が読めない回（浅い写しに前の刻が無い）は、今までどおり全部を回す。

name: 雲で回す

on:
  push:
    branches: [main]
    paths:
      - 'scratchpad/jobs/*.js'
      - 'scratchpad/jobs/*.ps1'
      - 'panel.html'
      - 'panel-check.js'
      - 'koushu-handan.html'
      - 'check.js'
      - 'adv-check.js'
      - 'check-all.js'
  workflow_dispatch:
    inputs:
      only:
        description: '回す台本の名（例 hello.js）。空なら scratchpad/jobs/ の全部'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: koushu-cloud-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # check-all は check.yml と同じ 24 で回す（2026-09-24）

      # panel-check は Edge／Chrome を立てる。check.yml と同じ用意（2026-09-23・panel-check は雲で-1）
      - name: ブラウザ（Chromium）を用意する
        run: |
          if [ -x /usr/bin/google-chrome ] || [ -x /usr/bin/chromium ] || [ -x /usr/bin/chromium-browser ]; then
            echo "ブラウザあり: $(command -v google-chrome chromium chromium-browser 2>/dev/null | head -1)"
          else
            npx --yes playwright@1.47.0 install --with-deps chromium
            BIN=$(find "$HOME/.cache/ms-playwright" -name 'chrome' -type f | head -1)
            sudo ln -sf "$BIN" /usr/bin/chromium
            echo "playwright の chromium を /usr/bin/chromium へ"
          fi

      # 押しで回す台本を選ぶ。変わった台本だけ＋パネルが変わっていれば panel-check.js。
      # 変わった物が読めなければ ALL（今までどおり全部）。
      - name: 回す台本を選ぶ
        id: pick
        shell: bash
        run: |
          set -u
          if [ "${{ github.event_name }}" != "push" ]; then echo "pick=ALL" >> "$GITHUB_OUTPUT"; exit 0; fi
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then git fetch --deepen=200 origin 2>/dev/null || true; fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then echo "pick=ALL" >> "$GITHUB_OUTPUT"; echo "前の刻が読めない → 全部"; exit 0; fi
          FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          P=""
          for f in $(echo "$FILES" | grep -E '^scratchpad/jobs/[^/]+\.(js|ps1)$' || true); do [ -f "$f" ] && P="$P $(basename "$f")"; done
          if echo "$FILES" | grep -qE '^(panel\.html|panel-check\.js)$'; then
            case " $P " in *" panel-check.js "*) ;; *) P="$P panel-check.js" ;; esac
          fi
          if echo "$FILES" | grep -qE '^(koushu-handan\.html|check\.js|adv-check\.js|check-all\.js)$'; then
            case " $P " in *" check-fast.js "*) ;; *) P="$P check-fast.js" ;; esac
          fi
          echo "変わったもの: $(echo $FILES)"
          echo "回す台本: ${P:-（無し）}"
          echo "pick=${P# }" >> "$GITHUB_OUTPUT"

      - name: 台本を回して reports/ へ書く
        id: run
        shell: bash
        run: |
          set -u
          mkdir -p reports scratchpad/jobs
          shopt -s nullglob
          only="${{ github.event.inputs.only }}"
          pick="${{ steps.pick.outputs.pick }}"
          any=0
          for f in scratchpad/jobs/*.js scratchpad/jobs/*.ps1; do
            b="$(basename "$f")"
            if [ -n "$only" ] && [ "$b" != "$only" ]; then continue; fi
            if [ -z "$only" ] && [ "$pick" != "ALL" ]; then
              case " $pick " in *" $b "*) ;; *) continue ;; esac
            fi
            any=1
            stamp="$(date -u '+%Y%m%d-%H%M%S')"
            name="${b%.*}"
            out="reports/cloud-${name}-${stamp}.md"
            {
              echo "# 雲で回した：\`${b}\`"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| 走り | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) （${{ github.run_number }} 回目） |"
              echo "| 刻 | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |"
              echo "| 台本 | \`${f}\` |"
              echo "| 機械 | ubuntu-latest（雲）。**VAIO では回していない** |"
              echo
              echo '## 出たもの'
              echo
              echo '```'
            } > "$out"
            start=$(date +%s)
            set +e
            case "$b" in
              *.js)  timeout 1500 node "$f"  >> "$out" 2>&1 ;;
              *.ps1) timeout 1500 pwsh -NoProfile -File "$f" >> "$out" 2>&1 ;;
            esac
            rc=$?
            set -e
            sec=$(( $(date +%s) - start ))
            {
              echo '```'
              echo
              echo "**終了コード ${rc}／${sec}秒**"
              if [ "$rc" = "124" ]; then echo; echo "＊1500秒の上限で切られた。"; fi
            } >> "$out"
            echo "書いた: $out（終了コード $rc・${sec}秒）"
          done
          if [ "$any" = "0" ]; then
            echo "回す台本が無かった（scratchpad/jobs/ に *.js も *.ps1 も無い）"
          fi
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: 結果を押し戻す
        if: steps.run.outputs.any == '1'
        shell: bash
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if git diff --cached --quiet; then
            echo '書き戻す物が無い'
            exit 0
          fi
          git commit -m '雲で回した結果を reports/ へ'
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && { echo '押した'; exit 0; }
            echo "押し直す（$i 回目）"
            sleep 5
          done
          echo '押せなかった'
          exit 1
