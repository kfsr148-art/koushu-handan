# 自動検査（2026-08-31・自動検査-1）
#
#   push のたびに check.js（本体の納品前チェック）と adv-check.js（探偵編の回帰）を回す。
#   入口は完全版 `node check-all`（2026-08-31・自動検査-3）。
#   ＊完全版へ上げる最初の試み（自動検査-2）は環境差で⑦が落ちて一度戻した——check.js が視野の寸を
#     「窓の寸＋幅24／高さ92」の決め打ちで作っており、これは Windows の Edge の額縁の値。
#     Linux の google-chrome では額縁が違い、測る視野そのものがずれた（667x375 のつもりが 691x380）。
#     check.js の⑦へ額縁の自動較正（起動して一度内寸を実測し、差を全視野に足す）を入れたので、
#     どの環境でも視野が指定どおりになり、完全版が回せる。
#
#   ＊paths で絞る——本体と検査の道具、検査が読む ver.txt、それとこの workflow 自身が
#     変わったときだけ走る。notices.json / state.json / shots / reports などの
#     知らせの押しでは走らない。
#   ＊落ちたときだけ ntfy へ「🚨 自動検査が落ちました（commit短縮）」を押し送る。
#     話題名は公開リポジトリに書かない決まりどおり secret（NTFY_TOPIC）から取る。
#     通ったときは鳴らさない。
name: 自動検査

on:
  push:
    paths:
      - 'koushu-handan.html'
      - 'check.js'
      - 'adv-check.js'
      - 'check-all.js'
      - 'ver.txt'
      - 'usage-widget.js'
      - 'usage-widget-loader.js'
      - 'widget-check.js'
      - 'panel.html'
      - 'panel-check.js'
      - '.github/workflows/check.yml'

# 同じ枝で新しい push が来たら、古い走りは打ち切る。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 手元は node v24。同じ大版で揃える。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # headless ブラウザ（check.js ⑦ と adv-check.js の駆動）。
      # ubuntu-latest には Chrome が入っており、check.js は /usr/bin/google-chrome を
      # 既定の探し先に持っている。無い回だけ入れる。
      - name: ブラウザを確かめる
        run: |
          if [ -x /usr/bin/google-chrome ] || [ -x /usr/bin/chromium ] || [ -x /usr/bin/chromium-browser ]; then
            echo "ブラウザあり: $(command -v google-chrome chromium chromium-browser 2>/dev/null | head -1)"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser
          fi

      - name: 検査（check.js ＋ adv-check.js・完全版)
        run: node check-all

      # ウィジェット側（Scriptable の台本）を、node の上で真似た台を使って確かめる。
      #   ＊見るもの … 構文／module.exports と build／殻の控えの名（台本名との取り違え）／
      #     四通りの状態で build が返ること／ボーダーの式の境目三点／猫の絵が公開側に在るか（404 は落ち）。
      #   ＊真似た台では拾えないもの（importModule と置き場・絵の見え方・見た目・遷移・iOS の控え）は、
      #     検査そのものが末尾に書き出す。
      - name: ウィジェットの検査（widget-check.js）
        run: node widget-check.js

      # 返事パネル（panel.html）。写しに probe を差して headless で駆動する。
      #   ＊見るもの … 構文／四通りの状態／まとめて写すの「残N」と実際に写る数／
      #     iPhone の横縦の視野の溢れ／状態の札の高さが題の長短で変わらないこと／
      #     終了予定がウィジェットと同じ計算になっていること。
      #   ＊真似た台では拾えないもの（公開の遅れ・iOS Safari の描き方・触り心地・押し通知）は、
      #     検査そのものが末尾に書き出す。
      - name: 返事パネルの検査（panel-check.js）
        run: node panel-check.js

      # 落ちたときだけ。題は「🚨 自動検査が落ちました（commit短縮）」。
      #   ＊題は UTF-8 なので RFC2047（=?UTF-8?B?…?=）で包む（手元の押し送りと同じ流儀）。
      #   ＊本文は幅ゼロ空白（ntfy は空の本文に "triggered" を勝手に入れるため）。
      #   ＊Cache: no … ntfy の側に溜めない（手元の決めと同じ）。
      - name: 落ちたときだけ知らせる
        if: failure()
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          TITLE_B64=$(printf '🚨 自動検査が落ちました（%s）' "$SHORT" | base64 -w0)
          printf '\xe2\x80\x8b' | curl -s --max-time 20 \
            -H "Title: =?UTF-8?B?${TITLE_B64}?=" \
            -H "Priority: 5" \
            -H "Cache: no" \
            --data-binary @- \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" > /dev/null || true
