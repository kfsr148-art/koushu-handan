# 自動検査と配信（2026-09-12・検査を雲へ-1／2026-09-13・配信の切り分け-1）
#
#   ＊検査は**雲側だけ**で回す。VAIO の pre-push は構文検査（node --check）だけに減らし、
#     headless の Edge は VAIO で二度と立てない（機械が4GBで、検査そのものが重さでこけるため）。
#   ＊ブラウザは Edge ではなく Chromium。runner に在る google-chrome／chromium を使い、
#     無い回だけ playwright の chromium を入れる。
#
#   ＊**2026-09-13・配信の切り分け-1**で、段を三つに分けた。
#       一段 scope  … 何が変わった push かを見るだけ（数秒）
#       二段 check  … **本体の回だけ**回す（koushu-handan.html・ver.txt など）
#       三段 deploy … 配信
#     配信の掛かり方が、回の種類で変わる——
#       ・控えの回（state.json・notices.json・board.json・usage.json・status.md・pipe-warn.json など）
#         … **検査に掛けない。**そのまま配信する。毎分の押しが検査の成否に縛られない。
#       ・本体の回（koushu-handan.html・ver.txt・検査の台本そのもの）
#         … 今までどおり **check が通った回だけ**配信する。落ちた版は公開されない。
#
#   ＊**枝を main に絞った**（2026-09-13）。絞る前は `stable` の付け替えでも走りが立ち、
#     その走りの deploy が必ず落ちていた（github-pages の環境は main の枝からしか配信できない）。
#     2026-09-12 21:49 の failure がこれ。落ちた走りは「直前の走り」の関門も濁す。
name: 自動検査と配信

on:
  push:
    branches: [main]
    # 札・状態だけの押しは検査も配信もここでは走らせない（2026-11-18 23:30 本人の決め「丙」）。配信は state-deploy.yml が一本で行う。
    #   ＊ここに挙げた物だけの押しで走らないだけで、本体などが一緒に入った押しは今までどおり走る。
    paths-ignore:
      - 'state.json'
      - 'notices.json'
      - 'notices-*.json'
      - 'status.md'
      - 'board.json'
      - 'usage.json'
      - 'pipe-warn.json'
      - 'ntfy-latest.txt'
      - 'ntfy-sent.json'
  workflow_dispatch:
  # 2026-11-19 13:50 本人の枠：workflow_run（声の走りが済むたびに起きる）は外した。声が0本の走りでも毎回起きたため（13:05）。
  #   声を直下へ移して押した時だけ、voice-m4a.yml の最後がここを workflow_dispatch で起こす。

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ---- 一段：何が変わった push かを見るだけ ----
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.pick.outputs.heavy }}
      kind: ${{ steps.pick.outputs.kind }}   # 回の種類（honta／panel／report）。見張りが仕事の名「種類:…」から読んで、見込みと止まっとるかもの敷居を決める（2026-11-20）
      body: ${{ steps.pick.outputs.body }}   # 本体の検査（速い版・フル版）を回すか。差がパネルとウィジェットの物だけなら 0（2026-11-20）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: 検査が要る回かを見る
        id: pick
        run: |
          # ---- 押しに二件以上入っていると、浅い写しに before が無い（2026-09-17・訴えの棚卸し-1）----
          #   ＊深さ2のころは、二件入った押しで git diff が落ち、FILES=ALL ＝「本体の回」と判じて
          #     フル版（12分）が回った。配信はその間止まり、公開が20分遅れて pub-late が鳴った
          #     （09-17 20:14 の走り。押しは「報告 + usage: 更新」の二件だった）。
          #   ＊深さを 20 にし、それでも足りない回だけ深掘りする。
          #     取れなければ今までどおり ALL＝検査に掛ける（安全側。本体の直しを素通りさせない）。
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --deepen=200 origin 2>/dev/null || true
          fi
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          else
            FILES=ALL
          fi
          # 2026-11-19 本人の枠：直前の押しからの差に加え、検査を通った印（check-pass）からの差も見る。
          #   前の回で検査が落ちて印が進まなかった本体・パネルの変更が、次の押し（控えだけの押し）で「控えの回」と判じられ、
          #   配信の段で検査済みの版へ戻されていた（4a213bfe の回：変わったもの voice-used.txt だけ→check を飛ばし、panel.html を v169 へ戻した）。
          if [ "$FILES" != "ALL" ] && git fetch --quiet --no-tags origin "refs/tags/check-pass:refs/tags/check-pass" 2>/dev/null; then
            PASSFILES=$(git diff --name-only check-pass "${{ github.sha }}" 2>/dev/null || echo ALL)
            FILES=$( (echo "$FILES"; echo "$PASSFILES") | sort -u)
          fi
          echo "変わったもの: $FILES"
          # 2026-11-20 本人の枠「雲の検査を速くする」：どの検査を回すかは scope-pick.js 一つで決める（作り値は scope-pick-test.js）。
          #   差に本体（koushu-handan.html・ver.txt）・本体の検査台本（check.js・adv-check.js・check-all.js）・この仕組み（check.yml）が一つでも入れば body=1＝今までどおり全部（約10分の本体の検査＋パネル・ウィジェットの検査）。
          #   差がパネルとウィジェットの物だけなら body=0＝本体の検査を飛ばし、パネルとウィジェットの検査だけで印を進めて配信する。控えだけなら heavy=0（検査に掛けずそのまま配信）。
          echo "$FILES" | node scope-pick.js >> "$GITHUB_OUTPUT"
          grep -E '^(heavy|body)=' "$GITHUB_OUTPUT" | tr '\n' ' '; echo

  # ---- 二段：検査（本体の回だけ）----
  check:
    name: check（種類:${{ needs.scope.outputs.kind }}）
    needs: scope
    if: needs.scope.outputs.heavy == '1'
    runs-on: ubuntu-latest
    # ＊検査の段には打ち切りを掛けない。掛けると毎分の押しが走っているフル版を毎回打ち切る。
    timeout-minutes: 25   # 2026-11-18：30→25分（実測 10〜15分。固まった走りを早く落とす）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ブラウザ（Chromium）を用意する
        run: |
          if [ -x /usr/bin/google-chrome ] || [ -x /usr/bin/chromium ] || [ -x /usr/bin/chromium-browser ]; then
            echo "ブラウザあり: $(command -v google-chrome chromium chromium-browser 2>/dev/null | head -1)"
          else
            npx --yes playwright@1.47.0 install --with-deps chromium
            BIN=$(find "$HOME/.cache/ms-playwright" -name 'chrome' -type f | head -1)
            sudo ln -sf "$BIN" /usr/bin/chromium
            echo "playwright の chromium を /usr/bin/chromium へ"
          fi

      # 本体の検査は、差に本体か本体の検査台本が入る回だけ（scope の body）。パネルとウィジェットだけの回は飛ばす（2026-11-20）。
      - name: 速い版（node check-all --fast）
        if: needs.scope.outputs.body == '1'
        run: node check-all --fast

      - name: フル版（node check-all）
        if: needs.scope.outputs.body == '1'
        run: node check-all

      - name: ウィジェットの検査（widget-check.js）
        run: node widget-check.js

      - name: 返事パネルの検査（panel-check.js）
        run: node panel-check.js

      # 落ちたときだけ知らせる。題は「🚨 自動検査が落ちました（commit短縮）」。
      - name: 落ちたときだけ知らせる
        if: failure()
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          TITLE_B64=$(printf '🚨 自動検査が落ちました（%s）' "$SHORT" | base64 -w0)
          printf '\xe2\x80\x8b' | curl -s --max-time 20 \
            -H "Title: =?UTF-8?B?${TITLE_B64}?=" \
            -H "Priority: 5" \
            -H "Cache: no" \
            --data-binary @- \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" > /dev/null || true

  # ---- 三段：配信 ----
  #   ＊控えの回（heavy=0）… check は走らないので skipped。その回はそのまま配信する。
  #   ＊本体の回（heavy=1）… check が success の回だけ配信する。
  deploy:
    name: deploy（種類:${{ needs.scope.outputs.kind }}）
    needs: [scope, check]
    if: always() && needs.scope.result == 'success' && (needs.scope.outputs.heavy == '0' || needs.check.result == 'success')
    # ---- 打ち切らず、順に通し切る（2026-09-18・配信の譲り-1 乙）----
    #   ＊前は cancel-in-progress: true で「最後の一本が配信する」形だった。ところが
    #     **押しが続くかぎり「最後」が来ない**ので、山の間は一本も通らず飢える。
    #     09-18 18:37〜18:43 は七本続けて打ち切られ、約6分どの配信も通らず、
    #     公開の遅れが 37分 まで開いた（pub-late）。
    #   ＊今日の押し179回のうち、間隔が配信の秒（中央31秒）より短い回は **24%** ある。
    #   ＊順に通し切る形を同じ列へ当てると、遅れは中央31秒・いちばん長い **1.8分**。
    #     走りの本数も時間も増えない（100本71分 → 98本51分）——打ち切りで捨てていた
    #     時間（317秒・141秒・134秒の三本を含む）が無くなるため。
    #   ＊群れの名（group: pages）はそのまま。**同時に配信するのは一本だけ**で、
    #     後から来た回は打ち切らずに順番を待つ。
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 検査を通った印（タグ check-pass）を進める（2026-11-18）
      actions: write    # 先端が進んで配りを飛ばした回に、配りの走り（state-deploy.yml）を呼ぶ（2026-11-19）
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 控えの回でも、**検査を通っていない本体の変更が先端に残っている間**は配信しない（2026-11-18）。
      #   ＊前は「直前の完了した走りが failure か」で見ていたので、①本体の検査が走っている最中（未完了）と、
      #     ②failure のあとに控えの回が一度 success（配信を飛ばした回）になった後は、素通りして
      #     検査前の本体を配信していた（昼の v1506・18:07 の v1507 が検査の前に公開へ出た）。
      #   ＊今は「検査を通った印」（タグ check-pass＝配信の段が、検査が success の回に進める）から先端までの差を見て、
      #     本体の検査対象のファイルが一つでも変わっていれば飛ばす。検査が通れば印が進み、次の控えの回から配信が戻る。
      #   ＊ここは**落とさずに飛ばす**（exit 1 にすると走りが failure になり、次の回の関門を濁す）。
      - name: 検査を通っていない本体の変更が残っていないかを見る
        id: guard
        if: needs.scope.outputs.heavy == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          FILES='koushu-handan.html check.js adv-check.js check-all.js ver.txt panel.html panel-ver.txt panel-check.js widget-check.js usage-widget.js usage-widget-loader.js state-decide.js state-decide-test.js orders-count.js orders-count-test.js help-count.js cdp-run.js scope-pick.js scope-pick-test.js .github/workflows/check.yml'
          TAGSHA=$(gh api "repos/$R/git/refs/tags/check-pass" --jq '.object.sha' 2>/dev/null || echo NONE)
          TAGDATE=""
          [ "$TAGSHA" != "NONE" ] && TAGDATE=$(gh api "repos/$R/git/commits/$TAGSHA" --jq '.committer.date' 2>/dev/null || echo "")
          if [ -z "$TAGDATE" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "検査を通った印（check-pass）が読めない。安全側で、この回は配信を飛ばす"
          else
            NEWER=""
            for F in $FILES; do
              D=$(gh api "repos/$R/commits?sha=$GITHUB_SHA&path=$F&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || echo "")
              if [ -n "$D" ] && [ "$D" \> "$TAGDATE" ]; then NEWER="$NEWER $F"; fi
            done
            if [ -n "$NEWER" ]; then
              echo "skip=0" >> "$GITHUB_OUTPUT"
              echo "revert=1" >> "$GITHUB_OUTPUT"
              echo "newer=$NEWER" >> "$GITHUB_OUTPUT"
              echo "検査を通った印（$TAGDATE）より後に、本体のファイルが変わっている：$NEWER。札・状態は今すぐ配り、これらのファイルは検査を通った版へ戻して配る"
            else
              echo "skip=0" >> "$GITHUB_OUTPUT"
              echo "検査を通った印より後の本体の変更は無い。配信してよい"
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'
      # ---- 古い版の後出し上書きを止める（2026-09-20・pub-late の元-1／乙）----
      #   ＊配信の段は**その走りの commit** を配る（checkout は github.sha を取る）。
      #     検査に時間のかかった回の配信が、あとから押した新しい回の配信を**上書きして戻す**。
      #     2026-09-20 20:26:51 がこれ——panel v141 の回（20:09:46 の commit・検査17分）の
      #     配信が、20:20 と 20:22 の配信のあとに着き、公開の notices.json を
      #     20:19 の中身から **19:23 の中身へ戻した**。20:30 の巡回が pub-late（56分）を立てた。
      #   ＊直し … **この回の commit が main の先端でなければ配信しない。** 先端の回が自分で配る。
      #     押しは必ず走りを起こすので、配る者が居なくなることはない。
      #   ＊採らなかった案 … 甲＝配信の段で main を checkout する（先端の中身を配る形。ただし
      #     **検査を通していない先端**を別の回が配ってしまうので、作法18 の関門が抜ける）。
      #     丙＝そのままにして次の押しを待つ（遅れが最長で検査の尺だけ開く）。
      - name: この回の commit がまだ先端かを見る
        id: tip
        if: steps.guard.outputs.skip != '1'
        run: |
          # 控えの回（heavy=0＝札・状態・使用量・報告だけ）は、先端でなくても配る（2026-11-18）。
          #   ＊押しが数分おきに続くと、配信の順番待ちの間に先端が進み、どの回も「先端でない」で飛ばされて、札と状態が一つも配られなかった（19:33〜）。
          #   ＊同じ群れ（group: pages）は新しい一本だけを待たせて古い待ちを取り下げるので、順序は崩れない。検査に時間のかかる本体の回（heavy=1）だけが、後出しで新しい配信を上書きし得るので、そちらは従来どおり先端だけ配る。
          if [ "${{ needs.scope.outputs.heavy }}" = "0" ]; then
            echo "stale=0" >> "$GITHUB_OUTPUT"
            echo "控えの回：先端でなくてもこの回の commit を配る"
            exit 0
          fi
          git fetch --quiet --depth=1 origin main
          TIP=$(git rev-parse FETCH_HEAD)
          echo "先端 $TIP ／ この回 $GITHUB_SHA"
          if [ "$TIP" = "$GITHUB_SHA" ]; then
            echo "stale=0" >> "$GITHUB_OUTPUT"
          else
            echo "stale=1" >> "$GITHUB_OUTPUT"
            echo "先端が進んでいるので、この回は配信を飛ばす（先端の回が配る）"
          fi
      # 札（notices.json）・状態（state.json）・使用量・報告は、検査を待たずにすぐ配る（本人の決め 2026-11-18）。検査を待つのは本体とパネルの作りだけ。
      #   ＊検査を通っていない本体・パネルの変更が先端に残っている回は、その物だけ「検査を通った印（タグ check-pass）の版」へ戻して配る。
      #   ＊パネルの版の字（panel-ver.txt）はパネル本体と対なので、パネルを戻す時は一緒に戻す。
      - name: 検査を通っていない本体・パネルの変更を、検査を通った版へ戻して配る
        if: steps.guard.outputs.skip != '1' && steps.guard.outputs.revert == '1' && steps.tip.outputs.stale != '1'
        run: |
          git fetch --quiet --no-tags --depth=1 origin "refs/tags/check-pass:refs/tags/check-pass"
          NEWER="${{ steps.guard.outputs.newer }}"
          case " $NEWER " in *" panel.html "*) NEWER="$NEWER panel-ver.txt" ;; esac
          for F in $NEWER; do
            if git cat-file -e "check-pass:$F" 2>/dev/null; then
              git checkout check-pass -- "$F" && echo "戻した: $F"
            else
              rm -f "$F" && echo "検査を通った版に無い→外した: $F"
            fi
          done
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.skip != '1' && steps.tip.outputs.stale != '1'
      # ---- 公開に載せる物を絞る（2026-11-17・y1117-1900 のヨシ）----
      #   ＊今までは「.」（リポジトリ全部）を配っていたので、作りかけの声（reports/voice-*-out）や古い声ごと 930MB に膨らみ、
      #     Pages の上限（1GB）に迫った。pack-site.js が、本体と台帳（voice-used.txt）が今使う声と、本体・パネル等の要る物だけを _site/ に組む。
      #   ＊台帳の声が直下に無ければ pack-site.js が落ち、配信は止まる（欠けたまま公開しない）。
      - name: 公開の荷を組む（pack-site.js）
        if: steps.guard.outputs.skip != '1' && steps.tip.outputs.stale != '1'
        run: node pack-site.js
      - name: 公開の大きさを数える（1GBに近づいたら訴える）
        if: steps.guard.outputs.skip != '1' && steps.tip.outputs.stale != '1'
        run: |
          MB=$(cat site-size.txt)
          echo "公開の大きさ: ${MB}MB（上限の目安 1024MB）"
          echo "### 公開の大きさ: ${MB}MB（上限の目安 1024MB）" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -ge 800 ]; then
            TITLE_B64=$(printf '⚠ 公開の大きさが %sMB（上限 1024MB に近い）' "$MB" | base64 -w0)
            printf '\xe2\x80\x8b' | curl -s --max-time 20 \
              -H "Title: =?UTF-8?B?${TITLE_B64}?=" \
              -H "Priority: 5" \
              -H "Cache: no" \
              --data-binary @- \
              "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" > /dev/null || true
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.skip != '1' && steps.tip.outputs.stale != '1'
        with:
          path: '_site'
      - id: deployment
        if: steps.guard.outputs.skip != '1' && steps.tip.outputs.stale != '1'
        uses: actions/deploy-pages@v4
      # 検査が success の本体の回は、配信したか（先端が進んで飛ばしたか）にかかわらず、その commit まで検査を通ったと印を付ける（前へだけ進める）。
      - name: 検査を通った印（check-pass）を進める
        if: always() && needs.scope.outputs.heavy == '1' && needs.check.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/check-pass" --jq '.object.sha' 2>/dev/null || echo NONE)
          if [ "$CUR" = "NONE" ]; then
            if gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/check-pass -f sha="$GITHUB_SHA" >/dev/null 2>&1; then echo "check-pass を新しく作った: $GITHUB_SHA"; else echo "印を作れなかった。印は先端の回が作る"; fi
          else
            CD=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$CUR" --jq '.committer.date' 2>/dev/null || echo "")
            ND=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.committer.date' 2>/dev/null || echo "")
            echo "check-pass $CUR（$CD）→ $GITHUB_SHA（$ND）"
            if [ -n "$ND" ] && { [ -z "$CD" ] || [ "$ND" \> "$CD" ]; }; then
              # 2026-11-19 本人の枠：先端で workflows が変わった後に古い回が印を動かすと GITHUB_TOKEN が 403 で断られる。落ちにせず抜ける（印は先端の回が進める）
              if gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/check-pass" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>"$RUNNER_TEMP/cp-err.txt"; then echo "check-pass を進めた"; else echo "印を進められなかった（$(head -c 160 "$RUNNER_TEMP/cp-err.txt" | tr '\n' ' ')）。印は先端の回が進める"; fi
            else
              echo "印より前か同じ・並びが取れない：進めない"
            fi
          fi
      # 検査が通ったのに先端が進んでいて配りを飛ばした回は、印を進めた後に配りの走り（state-deploy.yml）を呼ぶ（2026-11-19）。
      #   ＊先端は雲の走りの reports/ の押し戻しなど。その押しの配りは印が進む前に走るので、検査の済んだ本体・パネルを古い印の版へ戻して配っていた（v168 が出なかった 02:51）。
      - name: 先端が進んで飛ばした回は、配りの走りを呼ぶ
        if: always() && needs.scope.outputs.heavy == '1' && needs.check.result == 'success' && steps.tip.outputs.stale == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run state-deploy.yml --ref main -R "$GITHUB_REPOSITORY" && echo '配りの走りを呼んだ' || echo '配りの走りを呼べなかった'
