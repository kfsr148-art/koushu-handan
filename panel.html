<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 取り置きを断る。端末が古いパネルを掴んだまま新しい版を見ない事故を防ぐ。
     ＊これだけでは足りない（iOS はしばしば無視する）ので、下の checkPanelVer で版を見て跳ぶ。 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>返事パネル</title>
<!-- 宣言しておかないと /favicon.ico を勝手に取りに行って起動のたび404になる -->
<link rel="icon" href="data:,">
<!-- ホーム画面に置かれたときの絵。現場猫（本体の CAT_TILE_GENBA から焼いた 180x180）。
     透過のままだと iOS が黒地に置くので、パネルと同じ地の色で焼いてある。 -->
<link rel="apple-touch-icon" href="panel-icon.png">
<meta name="apple-mobile-web-app-title" content="返事パネル">
<meta name="theme-color" content="#14241c">
<style>
  /* 外部の読み込みは一切しない。字体も端末のものだけを使う。 */
  :root{
    --bg:#14241c; --card:#1d3328; --line:#2f4b3c; --fg:#f3ece0;
    --dim:rgba(243,236,224,0.65);
    --ask:#e8c14a; --done:#4caf7d; --wait:#4a9fe8; --act:#e05a4a;
    /* 終了予定の刻だけに使う明るい水色（v108・パネルの色-1）。
       ＊黄色（--ask）の補色にあたるので、同じ行に並べたときの見分けがいちばん付く。
       ＊白（#fff）にしなかったのは、本文の色（--fg:#f3ece0）と近く、
         ふつうの字に見えてしまうため。
       ＊実測のコントラスト比 … 札の地（--card:#1d3328）に 8.93 ／ 頁の地（--bg:#14241c）に 10.70。
         どちらも 4.5 を超える（いまの黄色は 7.81 ／ 9.36）。 */
    --pred:#7fdfff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:18px; line-height:1.6;}
  body{padding:0 0 40px; max-width:520px; margin:0 auto;}

  header{position:sticky; top:0; z-index:10; background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 14px;}
  h1{font-size:19px; margin:0 0 10px; letter-spacing:.05em;
    display:flex; align-items:center; gap:10px;}
  /* RunCat の猫（v103）。題字の右隣に常駐する。
     Cat sprites: RunCat Neo (runcat-dev, Apache-2.0)
     ＊等倍（高さ36px）・背景透過のまま。h1 は 19px の一行なので、猫の 36px が
       そのまま行の高さになるが、h1 を flex にして縦の中央で並べているため
       題字の位置は動かない。ヘッダーの高さは 36px 側で決まる（実測は報告に）。
     ＊絵の切り替えは script 側（runCatTick）。作業中＝cat0〜4 のコマ送り、
       それ以外＝cat-sleep の静止絵。 */
  #runcat{width:56px; height:36px; flex:0 0 auto;
    background:transparent; image-rendering:auto;
    /* 猫の36pxは h1 の行（約30px）より高い。そのまま置くとヘッダーが 65.4→71px に
       5.6px 伸びる（実測）。縦の余白を負に取り、**箱の上では30pxぶん**として数えさせる。
       絵は等倍のまま、上下へ3pxずつはみ出して描かれる（header の余白の中なので切れない）。 */
    margin:-3px 0;}

  /* いまの状態の一行。ヨシの釦より上に置く。
     リモートデスクトップを開かずに、動いているか止まっているかを見るため。 */
  /* 高さを固定する（v93）。**題の長さで下の釦の位置が動かない**ようにするため。
     ＊値は実測から採った。iPhone 縦持ち（本体の幅 390px）で、今日の控えと報告から
       いちばん長い題（61字）を入れて三通りを組んだときの高さ——
       作業中 132px ／ 手待ち 110px ／ ヨシ待ち **134px**。その最大値。
     ＊**v101 で 101px へ縮めた。** 上の 134px は、札に**時間の二段**（開始・終了予定・経過／
       指示を受けた）が入っていたころの値。**v98 でその二段を黄色の行へ移した**ので、
       札の中身は印と説明だけになり、134px は余白だらけになっていた。
       測り直した値（同じ 390px・最長の題 61字）——**三通りとも 100.39px**。
       端数を切り上げて **101px**。最短の題（4字）では 42.8px しか要らないので、
       固定しなければ 57px 以上動く。
     ＊`min-height` なので、**これより長い題が来たら折り返して伸びる**（切り捨てない）。
       伸びるのは例外で、ふだんの長さ（今日の最長 61字）はこの高さに収まる。
     ＊v92 までは 44px だった。短い題では 44px、長い題では 134px と 90px も動いていた。 */
  .state{display:flex; align-items:center; gap:8px; min-height:101px;
    border:1px solid var(--line); border-left-width:6px; border-radius:10px;
    padding:6px 10px; margin:0 0 10px; background:var(--card);}
  /* ＊v99：左の字が「作業中」の三文字ではなく**枠の印**（例：パネルの整理-10）になったので、
       縮まない指定（flex:0 0 auto）だと長い印が右の欄を押し出す。縮みと折り返しを許す。
       ＊上限を半分に切るのは、印が長い回でも右の説明が読める幅を残すため。 */
  .state .w{font-size:18px; font-weight:700; flex:0 1 auto;
    max-width:50%; min-width:0; overflow-wrap:anywhere;}
  .state .c{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px;}
  /* 件名も見込みも切らない。入りきらなければ「…」で削らず、枠のほうを縦に伸ばす。
     一行箱（nowrap＋ellipsis）だと iPhone の幅では末尾から呑まれ、
     消えるのが見込みの側になる（実測：390px で 317px 要るのに、箱は 232px しかない）。 */
  .state .s{font-size:15px; color:var(--fg); min-width:0;
    white-space:normal; overflow-wrap:anywhere;}
  .state .k{font-size:13px; color:var(--dim); min-width:0;
    white-space:normal; overflow-wrap:anywhere;}
  /* 郵便受けの読み残し（v74）。0件のときは行ごと畳むので、常には出ない。
     ＊出るときは必ず異常なので、見込みの段（灰）と同じ大きさのまま色だけ変える。 */
  .state .mail{font-size:13px; color:var(--act); font-weight:700; min-width:0;
    white-space:normal; overflow-wrap:anywhere;}
  /* ＊右端の「N分前」の飾り（.state .a）は、字ごと **v73 で外した**。 */
  .state button{flex:0 0 auto; min-height:36px; padding:0 10px; font-size:13px;
    color:var(--dim); background:none; border:1px solid var(--line); border-radius:8px;}
  .state.run  {border-left-color:var(--wait);} .state.run  .w{color:var(--wait);}
  .state.ask  {border-left-color:var(--ask);}  .state.ask  .w{color:var(--ask);}
  .state.idle {border-left-color:var(--line);} .state.idle .w{color:var(--dim);}
  .state.lost {border-left-color:var(--act);}  .state.lost .w{color:var(--act);}

  /* 指で押す的は44px以上。ヨシは親指で外さない大きさにする。 */
  .yoshi{display:block; width:100%; min-height:76px; font-size:30px; font-weight:700;
    letter-spacing:.35em; text-indent:.35em; color:#14241c; background:var(--done);
    border:0; border-radius:12px; margin:0 0 10px;}
  .yoshi:active{filter:brightness(.85);}
  .row{display:flex; gap:8px;}
  .row input{flex:1 1 auto; min-width:0; min-height:52px; font-size:18px; padding:8px 12px;
    color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:10px;}
  .row button{flex:0 0 auto; min-width:92px; min-height:52px; font-size:18px; font-weight:700;
    color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:10px;}
  .row button:active{filter:brightness(1.4);}
  #say{margin-top:8px; font-size:15px; min-height:1.6em; color:var(--dim); word-break:break-all;}
  #say.ok{color:var(--done);}
  #say.ng{color:var(--act);}

  /* ＊帯（`.bar`）の飾りは、帯そのものと一緒に **v48 で外した**。
       中身は「HH:MM 更新」の一つだけで、それを版の行の右端へ移したため。 */
  /* 「未処理◯件」の飾りは v16 で撤去。数える先（受信箱）に書く者がもう居ない。 */

  /* 機械が測った様子の一行（v32）。状態の帯のすぐ下。
     控え（work-note.txt）由来の状態とは色を分ける。食い違うときは枠を橙にして、両方並べる。 */
  /* ＊「機械が見た様子：…」の一行の飾り（v32）は、行ごと **v70 で外した**。 */

  /* 写した札の控え（v32）。既定は畳んである。ここでだけ「届いた」の印を出す。 */
  .done-box{margin:0 0 8px;}
  .done-box.hide{display:none;}
  #copiedList{display:none;}
  #copiedList.open{display:block;}
  #copiedList li{opacity:.62;}
  /* 「終わりました」の箱（v47）。畳んである見え方は控えと同じ。
     ＊ただし**薄くしない**。片付けた札ではなく、読み返す先だから。 */
  #doneList{display:none;}
  #doneList.open{display:block;}
  .got{margin-left:6px; font-size:13px; font-weight:700; color:var(--done);}
  /* 「ここまで読んだ」で片付いた札の印（v34）。押して写した札（緑）とは色を分ける。 */
  .read{margin-left:6px; font-size:13px; font-weight:700; color:var(--wait);}

  /* 常時出す事実の行。版の並びと生存の時刻。 */
  /* ＊v71 で頭の帯の中から、画面のいちばん下（版の字のすぐ上）へ移した。
       帯の中に居たときは header の左右の余白（14px）に乗っていたので、
       出たぶんの余白をこちらで持つ。上の空きは 18px で版の字と同じ間合いにする。 */
  .facts{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:var(--dim);
    margin:18px 14px 0;}
  .facts .warn{color:var(--ask); font-weight:700;}   /* 版がずれている／生存が古い */
  /* 「HH:MM 更新」（v48 でここへ移した）。同じ行の**右端**へ寄せる。
     ＊`margin-left:auto` で寄せるので、版の字が伸びても重ならず、折り返せば下へ落ちる。 */
  .facts .upd{margin-left:auto;}
  /* ＊「公開v」の遅れの断り（v35）の飾りは、断り書きごと **v48 で外した**。 */

  /* 全部写す。一覧のいちばん上。的は44px以上。 */
  .cpall{display:block; width:calc(100% - 28px); margin:4px 14px 12px; min-height:48px;
    font-size:16px; font-weight:700; color:var(--fg); background:var(--card);
    border:1px solid var(--line); border-radius:10px;}
  .cpall:active{filter:brightness(1.4);}
  .cpall.ok{color:var(--done); border-color:var(--done);}
  /* 写す物が無いとき（v38）。押せなくしたことが見て分かるように色を落とす。
     ＊箱の寸法は変えない。押せない状態でも 48px のまま置いておく（作法10）。
     ＊:active の明るさ変化も止める。押せないのに反応すると押せたように見える。 */
  .cpall:disabled{color:var(--dim); border-color:var(--line); opacity:.55;}
  .cpall:disabled:active{filter:none;}
  /* 写す物が0件のときは、灰色の帯を残さず**行ごと消す**（v51）。
     ＊`.cpall` が display:block を持つので、hidden の既定（display:none）では消えない。
       同じ札の中で打ち消しておく。 */
  .cpall[hidden]{display:none;}
  /* 写し取り一覧と「URLを写す」を横並びにする（v64）。
     ＊.cpall は幅いっぱいの作りなので、この行の中でだけ幅と余白を外す。
       ほかの .cpall（まとめて写す・お知らせ・箱の表紙）には触れない。 */
  .shotsrow{display:flex; gap:8px; margin:4px 14px 12px;}
  .shotsrow > .cpall{margin:0; width:auto;}
  .shotsrow > #btnShots{flex:1 1 auto;}
  .shotsrow > .url{flex:0 0 auto; padding:0 12px; font-size:14px;}
  /* あなた待ちの各件に添える一行（v58）。印・立てた時刻・待ちの種類・動く条件。
     ＊件名より一段小さく、色も落とす。読む順が件名 → 添えの一行になるように。 */
  .wmeta{font-size:12px; line-height:1.6; color:var(--dim);}
  /* ＊「未達 N件：」の行の飾り（v59）は、行ごと **v68 で外した**。 */
  /* ＊「受け取った指示 …」の一行の飾り（v61）も、行ごと **v70 で外した**。 */
  /* まとめて写すだけ青くする（v52）。いちばん多く押す釦なので、他と見分けられるようにする。
     ＊掛けるのは id なので、他の釦の札（.cpall とその仲間）には一切触れない。
     ＊丸みも大きさも .cpall のまま。色だけを乗せる。
     ＊id は .cpall.ok より強いので、写した直後の緑の字に負けない（青地に緑は読めない）。 */
  #btnCopyBoard{background:#1e6fd9; color:#fff; border-color:#1e6fd9;}
  #btnCopyBoard:active{background:#1857aa; border-color:#1857aa; filter:none;}
  /* 作業中の札があるあいだは押せなくする（v78）。青を落として、押せないと目で分かる形に。
     ＊上の #btnCopyBoard より弱いと青のままなので、同じ id に :disabled を足して勝たせる。
     ＊個別の「写す」釦（.cp）には掛けない。あちらは作業中でも押せる。 */
  #btnCopyBoard:disabled{background:var(--card); color:var(--dim);
    border-color:var(--line); opacity:.55; cursor:default;}
  #btnCopyBoard:disabled:active{background:var(--card); border-color:var(--line); filter:none;}
  /* 個別の「写す」も、作業中のあいだは押せなくする（v81）。見た目はまとめて写すと同じ薄さ。
     ＊掛けるのは .cp だけ。.cpall（まとめて写す・お知らせ・箱の表紙・URLを写す・写し取り一覧）
       には掛からない。 */
  .cp:disabled{color:var(--dim); border-color:var(--line); opacity:.55; cursor:default;}
  .cp:disabled:active{filter:none;}
  /* 作業中のあいだは、知らせの帯を一切出さない（v81）。
     ＊消すのは「お知らせ」の釦と一覧、「終わりました N件」の箱、「ヨシした数」の箱の四つ。
     ＊残すのは いちばん上の作業中の札（#state）／まとめて写す（#btnCopyBoard）／
       いちばん下の写し取り一覧・URLを写す（.shotsrow）／版と最終確認の行（.facts・#verTag）。
     ＊display:none で器ごと畳む。中の札も一緒に消えるので、押せる物が残らない。
     ＊作業中が0件になれば class が外れ、そのまま元どおり出る。 */
  /* ＊v84 で、**畳むのをやめた**。写しは作業の状態から切り離す。
       ＊v81〜v83 は作業中のあいだ「お知らせ」の釦と一覧を畳んでいた。畳むと
         **済んだ札まで写せなくなる**——写せない理由が「まだ終わっていないから」ではなく
         「作業中だから」になっていた。済んだ札は、いつでも読み返して写せるべきもの。
       ＊釦の押せる押せないは、作業の状態ではなく**写せる札が在るかどうか**で決める
         （setCopyBoardLabel）。作業中の分は写しの頭の一行が受け持つ。
       ＊body.busy の class は付けない。掛ける先が無くなったので、この決まりも外した。 */
  /* 写し取り一覧への口。釦と同じ見た目にするため、a にも同じ寸法を掛ける。 */
  a.cpall{box-sizing:border-box; text-decoration:none; text-align:center;
    line-height:48px; padding:0 10px;}

  /* 版の印。画面のいちばん下に小さく。 */
  /* ＊上の空きは v71 で 18px → 2px にした。すぐ上へ来た版と最終確認の行が
       18px を持っているので、二重に空くのを避ける。 */
  .ver{margin:2px 14px 4px;
    font-size:13px; color:var(--dim); text-align:center;}
  /* 使用量。版の印の隣（すぐ下）に置く。数字は読めるように、断り書きは小さく。 */
  /* 使用量：三つ横並びの塊。上に小さな名前、下に大きな数字。
     ＊数字は 30px を起点に、幅に収まらないときだけ縮める（下の fitUsage）。 */
  .usage{display:flex; gap:8px; justify-content:center; align-items:flex-end;
    margin:0 14px 4px;}
  .usage .u{flex:1 1 0; min-width:0; text-align:center;}
  .usage .u-name{display:block; font-size:11px; color:var(--dim); line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .usage .u-num{display:block; font-weight:700; line-height:1.1; white-space:nowrap;}
  /* ％は数字より一回り小さく。太さも一段落とす。 */
  .usage .u-pct{font-size:.62em; font-weight:600; margin-left:1px;}
  /* 80%以上は赤、50〜79%は橙、それ未満は緑。名前は灰のまま。 */
  .usage .hot{color:#ff5a4d;}
  .usage .warm{color:#ffa63d;}
  .usage .cool{color:#5ad07a;}
  /* 取得時刻の一行。塊の下に小さく。 */
  .usage-when{margin:0 14px calc(8px + env(safe-area-inset-bottom));
    font-size:11px; color:var(--dim); text-align:center;}
  .usage-when .u-old{color:var(--ask);}
  .usage-msg{margin:0 14px 4px; font-size:12px; color:var(--dim); text-align:center;}
  /* ＊使用量の下の断り書きの飾り（.usage-note）は、行ごと **v71 で外した**。
       ＊下端の余白はこの札が持っていたので、取得時刻の行（.usage-when）へ移した。 */
  /* 一覧が0件のときの理由。白紙にしない。 */
  li.why{border-left-color:var(--ask);}
  li.why .m{color:var(--fg);}
  /* お知らせの釦と一覧は画面から消す（v97）。**中身と記録はそのまま**で、見せ方だけ止める。
     ＊まとめて写す（#btnCopyBoard）と、終わりました／ヨシした数の箱は今までどおり出る。 */
  #btnCopyAll, #list{display:none !important;}
  /* 一番上の状態の札は画面から消す（v102）。**器と塗る処理はそのまま**で、見せ方だけ止める。
     ＊中身は下で全部賄えている——状態と時間は黄色の行、終わった題は
       「直近に終わった仕事」の箱。**いま動いている枠の印**は黄色の行の頭へ移した。
     ＊消したので、画面の頭は黄色の行から始まる。 */
  #state{display:none !important;}
  /* 板の跡地の状態の一行（v92）。黄色（ヨシ待ちと同じ --ask）で出す。
     ＊`li.why.stline .m` と重ねて書くのは、上の `li.why .m` に負けないため。
       同じ強さだと並び順で決まるので、class を一つ足して先に立たせる。 */
  li.why.stline .m{color:var(--ask);}
  /* 終了予定の**刻だけ**を水色にする（v108）。
     ＊「作業中（…）」と括弧の中の 開始・経過・指示 は今までどおり黄色のまま。
     ＊太さは変えない。字幅が変わると、固定した高さ（79px）の見積もりが崩れるため。 */
  li.why.stline .m .pred{color:var(--pred);}
  /* 写せる札の一覧（v115・パネルの見え方-1）。釦のすぐ下に、題と刻を一行ずつ。
     ＊札の箱ではなく**目次**なので、飾りは薄く小さく。押せる物ではない。
     ＊長い題は「…」で切る（横に溢れさせない）。刻は右端へ寄せる。 */
  .todoList{list-style:none; margin:2px 14px 6px; padding:0;}
  .todoList li{display:flex; gap:6px; align-items:baseline; background:none; border:0;
               border-radius:0; padding:1px 0; margin:0; font-size:12px; line-height:1.5;}
  .todoList .tt{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; color:var(--fg);}
  .todoList .tm{flex:0 0 auto; color:var(--dim); font-size:11px;}
  /* 板の畳んだ表紙の下に出す小さな行（v115）。開かなくても題と刻が読める。 */
  li.board .sub{margin:2px 0 0; font-size:11px; line-height:1.6; color:var(--dim);}
  li.board .sub span{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* 黄色の行に添える「何が終わったか」（v115）。 */
  li.why.stline .m .fin{color:var(--done);}
  li.why.stline .m .finT{color:var(--dim); font-size:.86em;}
  /* 高さを固定する（v100）。**字の長さで下の釦の位置が動かない**ようにするため。
     ＊値は実測から採った。iPhone 縦持ち（本体の幅 390px）で組んだときの高さ——
       「作業中、HH時MM分終了予定（開始…・経過…・指示…）」**78.38px**（経過が3桁でも、
       終了予定が不明でも同じ78px）／「次の指示待ち」51px／「ヨシを返してください」51px。
       その最大値を、端数を切り上げて 79px。**78px では 0.38px 足りず、釦の上端が
       299.39px と 299.77px でずれた**（実測）。
     ＊`min-height` なので、これより長い字が来たら折り返して伸びる（切り捨てない）。
       伸びるのは例外で、ふだんの三通りはこの高さに収まる。
     ＊中の一行を上へ寄せるのではなく、箱の中で**縦の中ほど**に置く。
       字が一行の回（次の指示待ち）でも、二行の回（作業中）と同じ位置に見える。 */
  li.why.stline{min-height:79px; display:flex; align-items:center;}

  /* 受け取り確認と、写し終えた件は畳んでおく。題の行だけ出し、押すと本文が開く。 */
  li.ack .m{display:none;}
  li.ack.open .m{display:block;}
  li.ack{cursor:pointer;}
  /* 畳んだ札の件名（v75）。畳むと題と時刻しか出ず、**どの件の札かが分からなかった**。
     ＊「✅ 終わりました（返事不要）」は v48 から畳んである。題は種別しか語らないので、
       畳んだ札が何本並んでも見分けが付かない。答えを本文に書いても、開くまで届かない。
       2026-08-29、同じ数字を四度求められた。四度とも本文には入って公開もされていたが、
       畳んだ表紙に何も出ないので、読む側からは「返っていない」ことと区別が付かなかった。
     ＊出すのは本文の一行目（＝控えの「件名:」がそのまま来る）。
     ＊開いたら本文の側に同じ字が出るので、こちらは畳んでいる間だけ出す。 */
  li .sj{font-size:12px; line-height:1.5; color:var(--dim); margin:2px 0 0; padding:0 2px;
         overflow-wrap:anywhere;}
  li.ack.open .sj{display:none;}
  /* 板の二段（あなた待ち・直近に終わった仕事）は、下の二つの箱と同じ背丈にする（v63）。
     ＊下の箱の表紙は .cpall の釦で、min-height 48px・字 16px・左右の余白 14px。
       こちらは li の上下の余白（12px）と .t の字（17px）と下の空き（4px）で
       72px まで育っていた。表紙の行そのものを48pxの箱にして揃える。
     ＊中身（.m）と開閉の受けは触らない。畳んでいるあいだ .m は出ないので、
       余白はここで持たせて、開いたときだけ効かせる。 */
  li.board{padding:0; margin:0 0 8px;}
  li.board > .t{min-height:48px; margin:0; padding:0 14px; font-size:16px; align-items:center;}
  li.board > .m{padding:0 14px 12px; font-size:16px;}
  /* 写し終えた件は薄くする。消しはしない——もう一度押せば、また写せる。 */

  ul{list-style:none; margin:0; padding:0 14px;}
  li{background:var(--card); border-left:6px solid var(--line); border-radius:10px;
    margin:0 0 12px; padding:12px 14px;}
  li.ask{border-left-color:var(--ask);}
  li.done{border-left-color:var(--done);}
  li.wait{border-left-color:var(--wait);}
  li.act{border-left-color:var(--act);}
  /* 題の行は左に題と時刻、右に写す釦。釦は44px以上にする。 */
  .t{font-size:17px; font-weight:700; margin:0 0 4px;
    display:flex; align-items:flex-start; gap:8px;}
  .t .tx{flex:1 1 auto; min-width:0;}
  .cp{flex:0 0 auto; min-width:64px; min-height:44px; font-size:14px; font-weight:400;
    color:var(--dim); background:none; border:1px solid var(--line); border-radius:8px;}
  .cp:active{filter:brightness(1.5);}
  .cp.ok{color:var(--done); border-color:var(--done);}
  /* 写せなかったとき。成功の緑と紛れないよう赤にする。 */
  .cp.ng{color:var(--act); border-color:var(--act);}
  .copybox{position:fixed; left:14px; right:14px; bottom:14px; height:40vh; z-index:20;
    font-size:15px; color:var(--fg); background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:10px;}
  li.ask .t{color:var(--ask);}
  li.done .t{color:var(--done);}
  li.wait .t{color:var(--wait);}
  li.act .t{color:var(--act);}
  .when{font-size:13px; color:var(--dim); font-weight:400; margin-left:.6em;}
  .m{white-space:pre-wrap; word-break:break-word; font-size:17px; margin:0;}

  .hide{display:none;}
</style>
</head>
<body>

<!-- 話題名の設定画面は v17 で撤去した。一覧も状態も版も、話題名を使わずに読む。
     残しておくと罠になる——起動の判定が話題名の保存を必須にしていたので、
     新しい端末では設定画面から先へ進めなくなっていた。 -->

<div id="main" class="hide">
  <header>
    <h1>返事パネル<img id="runcat" src="cat-sleep.png" alt="" width="56" height="36"></h1>
    <div class="state idle" id="state">
      <span class="w" id="stWord">…</span>
      <span class="c">
        <span class="s" id="stSubj">読み込み中</span>
        <span class="k hide" id="stMik"></span>

             読む元は state.json の orderAt（inbox-feed.ps1 → last-order.txt が書く）。 -->
        <span class="k hide" id="stOrder"></span>
        <!-- 郵便受けの読み残し（v74）。0件のときは行ごと畳む。 -->
        <span class="mail hide" id="stMail"></span>
      </span>
      <!-- ＊右端の「N分前」（.a / #stAgo）は **v73 で消した**。器ごと外している。
           経過は二段目の「開始HH:MM・終了予定…・経過N分」が持っている。 -->
    </div>
    <!-- ＊「受け取った指示 HH:MM「…」」の一行（v61）は **v70 で画面から消した**。
         器ごと外している。値を書く側（inbox-feed.ps1 → last-order.txt → state.json）は
         そのまま動いており、まとめて写しの中には今までどおり入る。
         ＊「機械が見た様子：…」の一行（v32）も **v70 で消した**。こちらは器も飾りも処理も外した。 -->
    <!-- ＊版と最終確認の一行（.facts）は **v71 で画面のいちばん下へ移した**（版の字のすぐ上）。
         中身も並びも変えていない。跡に空きは残していない。 -->
    <!-- ＊「公開v」の遅れの断り（v35）は **v48 で消した**。行ごと外し、代わりの文言は置かない。
         事情は変わっていない——読み元は stable の枝で、raw の取り置きが長く、
         2026-08-26 の実測では押し出しから追いつくまで最大3時間かかる。
         数字が古く見えても壊れてはいない。断り書きだけを畳んだ。 -->
    <!-- 送る側の道具（ヨシの釦・入力欄・送る釦・言づて欄）は v11 で撤去した。
         Claude アプリの Code タブから直に指せるようになったので、パネルから送る必要がない。
         このパネルは「見る」ためだけの道具になった。 -->
  </header>
  <!-- ＊区切り線の下の帯（`.bar`）は **v48 で外した**。中身は「HH:MM 更新」の一つだけで、
       それを版の行の右端へ移したので、空の帯だけが残る形になっていた。
       ＊「話題名を入れ直す」は v17 で撤去済み。話題名を使う先はもう無い。 -->
  <!-- まとめて写す（v46・並びは v48 でいちばん上へ）。
       お知らせ・あなた待ち・直近に終わった仕事・今日の報告を一つの控えへ。
       ＊「お知らせ」の釦とは別物。あちらは**未処理の札を渡す**もので、写した札は一覧から消える。
