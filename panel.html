       ＊いちばん上に置くのは、いちばん多く押す釦だから。 -->
  <!-- 状態の一行（v97 でここへ出した）。**固定の置き場**。
       ＊v90〜v96 は板（#board）の中に混ぜていたので、板が出ない回には消えていた。
         お知らせの一覧を畳んだ v97 では、この行が**常に見えている**ことが要る。
       ＊中身は stateLineText()。作業中／次の指示待ち／ヨシを返してください の三通り。 -->
  <ul id="stLine"></ul>
  <button class="cpall" id="btnCopyBoard" type="button">まとめて写す（0件）</button>
  <!-- 写せる札の題を一行ずつ（v115・パネルの見え方-1）。
       ＊数字（残N／M件）だけでは**何が写せるのか**が分からない。開いた瞬間に読めるようにする。
       ＊器だけ置いて、中身は setCopyBoardLabel が塗る（数と同じ一回の走査から作る）。 -->
  <ul id="todoList" class="todoList"></ul>
  <!-- ＊「通知の本文を写す」の釦は **v114 で畳んだ**（写しの一本化-1）。
       まとめて写すが札と通知の両方を数え、刻の順で一枚に並べて写すようになったので、
       押す所を二つ持つ要が無くなった。**器は残さない**——押せない釦は用が無い。
       ＊通知を一行にする形（ntfyCardOf）と印の持ち方（ntfyCopied）はそのまま使っている。 -->
  <!-- 未処理の札を渡す釦。字は v48 で「全部写す」から「お知らせ」へ変えた。
       件数の出し方も押したときの動きも、v38 のまま変えていない。 -->
  <button class="cpall" id="btnCopyAll" type="button">お知らせ</button>
  <!-- ＊写し取り一覧への口は、**v49 でいちばん下へ移した**（写した札の箱の下・版の字の上）。
       釦の中身も押したときの動きも変えていない。置き場所だけを変えた。 -->
  <!-- お知らせの一覧（v97 で**画面から消した**。器と中身は残してある）。
       ＊消したのは見せ方だけ。数える中身（shown / allRows）も、まとめて写すの組み立ても、
         控えの記録も、今までどおり動く。CSS の display:none で隠しているだけ。 -->
  <ul id="list"></ul>
  <!-- 板の二段（あなた待ち・直近に終わった仕事）。v97 で **#list から切り離した**。
       ＊v96 まではお知らせの札と同じ器を使い、札が0件の回だけ跡地へ出していた。
         お知らせを畳んだので、板は**いつでも出る**自分の器を持つ。 -->
  <ul id="board"></ul>
  <!-- 写した札の控え（v32）。既定は畳んである。押すと開く。
       v24 で一覧から落とした札の行き先で、**ここでだけ**「届いた」の印を出す。
       一覧そのものの見え方は v24 のまま——写した札は上の一覧には戻さない。 -->
  <!-- 「終わりました（返事不要）」の箱（v47）。**画面から消さない**。
       ＊表紙は件数の一行。押すと中身が出て、中の札も押せば**本文が全文**開く。
         **どこでも中身を切らない。**
       ＊写した札の控え（下）とは別物。あちらは「片付けた札の行き先」で、
         こちらは「終わりましたの報告を、写した写さないに関わらず全部残す場所」。 -->
  <div class="done-box hide" id="doneBox">
    <button type="button" class="cpall" id="doneHead"></button>
    <ul id="doneList"></ul>
  </div>
  <div class="done-box hide" id="copiedBox">
    <button type="button" class="cpall" id="copiedHead"></button>
    <!-- ＊「未達 N件：」の一行（v59）は **v68 で消した**。器ごと外している。 -->
    <ul id="copiedList"></ul>
  </div>
  <!-- 写し取り一覧への口（v30 で足した・並びは v49 でいちばん下へ）。
       本体の全画面を撮った PNG を並べたシート。組み直すのは node shot-all.js。
       ここは開くだけで、パネル側は何も持たない。 -->
  <!-- 知らせの一覧のURLを写す小さな釦（v64）。写し取り一覧の隣に横並びで置く。
       ＊写るのは一行だけ。改行も空白も入れず、一続きの字でそのまま渡す。 -->
  <div class="shotsrow">
    <a class="cpall" id="btnShots"
       href="https://kfsr148-art.github.io/koushu-handan/shots/index.html"
       target="_blank" rel="noopener">🖼 画面の写し取り一覧</a>
    <button type="button" class="cpall url" id="btnCopyUrl">URLを写す</button>
  </div>
  <!-- 常時出す三つ。どれも既にリポジトリへ書いてある値の見せ方だけで、経路は増やしていない。
       版の並び＝ver.txt（本体）と stable の枝の ver.txt（公開）。
       最終確認＝state.json の at。生存の時刻そのもの。
       ＊置き場所は **v71 で画面のいちばん下（版の字のすぐ上）へ移した**。中身と並びはそのまま。 -->
  <div class="facts">
    <span id="fVer">版 —</span>
    <span id="fSeen">最終確認 —</span>
    <!-- 「HH:MM 更新」は v48 でこの行へ移した（もとは区切り線の下の帯）。
         版・最終確認と同じ一行の**右端**に並べる。字も、更新のたびに書き換わる
         動きも、移す前と同じ（paintBar が書く）。 -->
    <span id="stat" class="upd">読み込み中…</span>
  </div>
  <!-- 版の印。直すたびに数字を上げる。古い写しを見ていないかの目印。 -->
  <p class="ver" id="verTag">panel v117（9月4日）</p>
  <!-- 使用量。stop のたびに取る（30分の間合い・一日40回まで）。取れていなければ何も出さない。 -->
  <div class="usage" id="usageTag" hidden></div>
  <p class="usage-msg" id="usageMsg" hidden></p>
  <p class="usage-when" id="usageWhen" hidden></p>
  <!-- ＊使用量の下の断り書き（この機械のローカルの…）は **v71 で消した**。器ごと外している。
       数字の三つと「N分前取得」の行はそのまま。 -->
</div>

<script>
(function () {
  'use strict';
  var send = '', reply = '', timer = null;
  var shown = [];        // いま一覧に出している知らせ。写す釦から引く。
  var allRows = [];      // 写した札も含む全件。写した札の控え（畳んだ箱）が読む。
  /* 本体の版。写しの「版:」の行に入れる。公開ページの ver.txt から取る。
     stable の版はどのファイルにも出ていないので、写しでは「未確認」と書く。 */
  var honVer = '', stbVer = '';
  var VER_URL = 'https://kfsr148-art.github.io/koushu-handan/ver.txt';
  /* このパネルの版。**三箇所を必ず同時に直す**——ここ／下の verTag の字／panel-ver.txt。
     ＊panel-ver.txt は端末が「新しい版が出たか」を見に行く先。ここが古いと、
       新しいパネルを置いても端末は古いものを掴んだままになる（2026-08-24 の事故）。 */
  /* 終了予定が、いまからこの秒数より先なら数字を出さない（v107・走り出しの時刻ずれ-1）。
     押し送りの側（watch-notify.ps1 の $START_FAR_H）と同じ12時間。二箇所で違う物差しを使わない。 */
  var FAR_SEC = 12 * 3600;
  var PANEL_VER = '117';
  var PANEL_VER_URL = 'https://kfsr148-art.github.io/koushu-handan/panel-ver.txt';

  /* 版が変わっていたら、問い合わせの字を付けて読み直す。
     ＊本体（koushu-handan.html）と同じ二段の作り。取り置きを挟まない。
     ＊一度跳んだ版へは二度跳ばない（堂々巡りを避ける）。 */
  function checkPanelVer() {
    fetch(PANEL_VER_URL + '?_chk=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (x) {
        var n = String(x || '').trim().replace(/[^0-9]/g, '');
        if (!n || n === PANEL_VER) { return; }
        var mark = 'kh-panel-jumped';
        try {
          if (sessionStorage.getItem(mark) === n) { return; }
          sessionStorage.setItem(mark, n);
        } catch (e) {}
        location.replace(location.pathname + '?_v=' + n);
      })
      .catch(function () {});
  }
  /* ＊読み先は公開ページ（github.io）にする。raw.githubusercontent は
       Cache-Control: max-age=300 で、しかも ?_t= では破れない（2026-08-23 実測。
       押し出し済みの中身が5分間そのまま古く返った）。公開ページ側は ?_t= ごとに
       新しい鍵になり、実測で Age: 0 の最新が返る。
     ＊stable の版だけは raw のまま。公開ページは main しか出さないので、
       stable の枝のファイルは公開ページからは取れない。版はめったに動かないので5分の遅れで足りる。 */
  var STB_URL = 'https://raw.githubusercontent.com/kfsr148-art/koushu-handan/stable/ver.txt';
  /* 一覧に出す件数の上限は設けない（v24 で撤去）。
     ＊写していない札は、何件あっても全部残す。写す前に消えるのがいちばん困る。
       絞るのは「写したかどうか」だけ。 */
  /* 写した件の印。端末の中だけに残る。開き直しても消えない。
     ＊印の付いた札は一覧から落とす（v24）。薄く残さない。
       もう一度写したくなったら、公開ページの status.md に同じ本文が残っている。 */
  var COPIED_KEY = 'kh-panel-copied';
  var copied = {};
  /* 上部の常時表示と「全部写す」の末尾で使う、いまの様子。state.json から拾ったものを控える。
     ＊新しい経路は増やさない。すでに読んでいる state.json / ver.txt の値の見せ方だけ。 */
  var lastState = { word: '', since: '', at: 0 };
  /* 作業中の終了予定の刻（秒・v80）。まとめて写すの釦の字に出す。
     ＊いまの持ち主は state.json の startedAt ＋ 見込み。**候補が増えたら、いちばん遅いものを採る**
       ように書いてある（下の noteEnd）。0 は「取れていない」の意で、釦は「終了予定不明」を出す。
     ＊作業中でない回は 0 に戻す。前の仕事の刻が居残らないようにするため。 */
  var lastEndAt = 0;
  /* 終了予定の候補を一つ受け取り、いちばん遅いものだけを残す（v80）。 */
  function noteEnd(sec) {
    if (typeof sec === 'number' && sec > 0 && sec > lastEndAt) { lastEndAt = sec; }
  }
  /* いまの状態の一語と、着手の刻（v82）。釦の字はこの二つで決める。
     ＊状態は state.json の stat（作業中／ヨシ待ち／終わり／手待ち／異常）。
       v81 まで札の題から数え直していたので、ヨシ待ちの札が立っていても
       題から読めない札が一枚あれば「作業中」と出ていた。**状態は状態から読む**。 */
  var lastStat = '', lastStartedAt = 0, lastSubj = '';
  /* 過去の実測（estimates.json）。見込みが無いときの終了予定を、ここから当てる。 */
  var EST_URL = 'https://kfsr148-art.github.io/koushu-handan/estimates.json';
  var est = null;
  function pullEst() {
    fetch(EST_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && typeof j.all === 'number') { est = j; setCopyBoardLabel(); } })
      .catch(function () { });
  }
  /* 件名から印の系統を取る（v82）。「パネルと受け口-7（四件）」→「パネルと受け口」。 */
  function seriesOfSubj(subj) {
    var m = String(subj || '').match(/^([^\s（(：:]+?)-\d+/);
    return m ? m[1] : '';
  }
  /* 件名から種類を当てる（v82）。控えの分け方に合わせた粗い当て方。 */
  function kindOfSubj(subj) {
    var s = String(subj || '');
    if (s.indexOf('パネル') >= 0) { return 'パネル'; }
    if (s.indexOf('本体') >= 0) { return '本体'; }
    return '調べ';
  }
  /* 見込みが無いときの所要（分）を、実測から当てる（v82）。
     順は 同じ系統 → 同じ種類 → 全体。どれも無ければ 0（＝出せない）。 */
  function guessMin(subj) {
    if (!est) { return 0; }
    var sr = seriesOfSubj(subj);
    if (sr && est.series && est.series[sr] && est.series[sr].min) { return est.series[sr].min; }
    var kd = kindOfSubj(subj);
    if (est.kind && est.kind[kd] && est.kind[kd].min) { return est.kind[kd].min; }
    return est.all || 0;
  }
  /* ＊受け取った指示の一行の控え（v62）は **v72 で外した**。画面にも写しにも出さないため。 */
  function loadCopied() {
    try { copied = JSON.parse(localStorage.getItem(COPIED_KEY) || '{}') || {}; } catch (e) { copied = {}; }
  }
  function saveCopied() {
    try { localStorage.setItem(COPIED_KEY, JSON.stringify(copied)); } catch (e) {}
  }
  /* 一件の見分け。題と時刻で決める。控えが入れ替わっても同じ件は同じ鍵になる。 */
  function keyOf(d) { return String(d.time || 0) + '|' + String(d.title || ''); }

  /* 開いてある折り畳みの控え（v47）。
     ＊一覧は15秒ごとに丸ごと組み直される。開閉は組み直しのたびに消えるので、
       読んでいる途中の件が**勝手に閉じていた**。開いた札の鍵をここに残し、
       組み直すときに付け直す。**開閉が変わるのは人が押したときだけ**にする。
     ＊端末には残さない。開いた畳んだは、その場の読み方の話なので、
       頁を開き直したら畳んだ既定へ戻ってよい。
     ＊鍵は札と同じ keyOf。札でない枠（あなた待ち・直近に終わった仕事）には
       決め打ちの名を与える。属性へ入れるので、必ず encodeURIComponent を通す
       ——題に引用符が入っていても壊れないように。 */
  var openKeys = {};
  function okey(v) { return encodeURIComponent(String(v == null ? '' : v)); }
  function isOpen(v) { return !!openKeys[okey(v)]; }
  /* 押されたら覚え直す。開閉の受けは**すべてここを通す**。 */
  function toggleOpen(li) {
    if (!li || li.className.indexOf('ack') < 0) { return; }
    var k = li.getAttribute('data-k') || '';
    var now = (li.className.indexOf('open') < 0);
    li.className = now ? (li.className + ' open') : li.className.split(' open').join('');
    if (!k) { return; }
    if (now) { openKeys[k] = 1; } else { delete openKeys[k]; }
  }

  /* 知らせの一覧。ntfy へ出るのは異常だけになったので、読み物はここから取る。 */
  var NOTICES_URL = 'https://kfsr148-art.github.io/koushu-handan/notices.json';
  /* 「ここまで読んだ」の控え（v34）。{at, upto} の二つだけを持つ。
     チャットの側で state.json や報告書を直に読んで済ませた回は、パネルの「写す」を
     押していないので札が残り続ける。その受け。upto **以前**の札は写した扱いにする。
     ＊書くのは Claude Code の側（node seen-set.js）。パネルからは読むだけ。 */
  var SEEN_URL = 'https://kfsr148-art.github.io/koushu-handan/seen.json';
  var seenUpto = 0;
  /* ＊「写した札を出す」の釦とともに `ignoreSeen` も **v43 で外した**。
       押す相手が無くなったので、常に false のまま残る死んだ旗になっていた。 */
  function pullSeen() {
    fetch(SEEN_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        var v = (s && typeof s.upto === 'number' && s.upto > 0) ? s.upto : 0;
        /* 値が動いたら一覧を組み直す。取得は一覧より遅れて返ることがあるので、
           待たずに一度組んでおいて、届いた時点で直す。 */
        if (v !== seenUpto) { seenUpto = v; try { pull(); } catch (e) {} }
      })
      .catch(function () { seenUpto = 0; });
  }

  /* 板の値（v45）。**未処理の知らせが無いときだけ**、一覧の場所に二段で出す。
       上段 ① あなた待ち … 人の合図や返事が無いと進まない件（**無ければ箱ごと出さない**・v90）
       中  ② 作業中の終了予定 … 作業中のときだけ、字だけの一行（v90）
       下段 ③ 直近に終わった仕事3件 … 件名と結果一行
     ＊v44 で置いた三つ（台帳の残り一覧・今日の押し送り・控えの最終実行）は **v45 で外した**。
       未処理が無い画面で読みたいのは「数」ではなく「**こちらの番かどうか**」だから。
     ＊値はどれも VAIO の側にしか無いので、`board-emit.ps1` が10分ごとに
       `board.json` へ書いて押し出す。パネルは**読むだけ**で、何も数えない。
     ＊読めなかったら**そう書く**。黙って空にしない。 */
  var BOARD_URL = 'https://kfsr148-art.github.io/koushu-handan/board.json';
  var board = null;        /* 読めた中身 */
  var boardErr = '';       /* 読めなかった理由 */
  var boardEverRead = false;  /* 一度でも読めたか（v113）。読めていれば、取れない回も前の値を出す */
  /* 板の二段（あなた待ち・直近に終わった仕事）を写した印（v56）。
     ＊札と違って行き先の箱が無いので、印は端末にも残さず、その場かぎりで持つ。
     ＊板の中身が変わったら解く。新しい件が来たのに0件のままでは出しようが無い。 */
  var boardTaken = false, boardSig = '';

  function pullBoard() {
    fetch(BOARD_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
      .then(function (b) {
        var sig = JSON.stringify(b);
        if (sig !== boardSig) { boardSig = sig; boardTaken = false; }
        board = b; boardErr = ''; boardEverRead = true;
        /* 一覧が空のときだけ描き直す。札が出ている画面は触らない。 */
        paintBoard();   /* v97：札の有無に関わらず、板は常に塗る */
      })
      /* ---- 取れない回に、前に読めた値を捨てない（v113・板の欠け-1）----
           ＊v112 まではここで board = null にしていた。取りに行くのは2分ごとなので、
             **通信が一度こけただけで、板の箱も写しの板の行も最大2分消える**。
             2026-09-03 11:45、公開側の board.json は 200・909バイト・JSON も通る
             （中身も 10:14:02 から変わっていない）のに、画面には
             「板の値を読めません（Load failed）」が出ていた。**消えていたのは手元の値**。
           ＊よって値は残す。断りは boardErr に持ち、**一度も読めていないときだけ**
             箱の代わりに理由を出す（下の boardHtml）。 */
      .catch(function (e) {
        boardErr = e.message;
        paintBoard();
      });
  }

  /* 待ちの種類を、台帳の状態欄から機械で判じる（v58）。
     ＊出すのは 実機会待ち／裁定待ち／返事待ち の三つだけ。どれにも当たらなければ「不明」。
     ＊字面だけで判じる。台帳の書き方が変われば当たらなくなるので、そのときは「不明」に倒れる。 */
  function waitKind(why) {
    var s = String(why || '');
    if (s.indexOf('実機') >= 0) { return '実機会待ち'; }
    if (s.indexOf('ヨシ') >= 0 || s.indexOf('裁定') >= 0) { return '裁定待ち'; }
    if (s.indexOf('返事') >= 0 || s.indexOf('合図') >= 0 || s.indexOf('指示') >= 0) { return '返事待ち'; }
    return '不明';
  }
  /* 何が起きれば進むかを一行で（v58）。種類から引く。日付だけの件は、その日を出す。 */
  function waitCond(why) {
    var k = waitKind(why);
    if (k === '実機会待ち') { return 'その場面が実機で起きれば進む'; }
    if (k === '裁定待ち') { return 'ヨシ（裁定）が返れば進む'; }
    if (k === '返事待ち') { return '返事か合図が届けば進む'; }
    var m = String(why || '').match(/(\d{4}-\d{2}-\d{2})/);
    if (m) { return m[1] + ' が来れば進む'; }
    return '';
  }

  /* 作業中の終了予定の字（v90）。**釦と、板の跡地の一行の両方**がここを見る。
     ＊v89 まではこの組み立てが setCopyBoardLabel() の中にしか無かった。
       同じ字を二箇所で作ると必ずずれるので、先に一箇所へ寄せる。
     ＊刻は作業中の終了予定をそのまま出す。候補が複数あるときは noteEnd がいちばん遅いものを残す。
     ＊見込みが無くて刻が取れないときは、過去の実測から当てる（順は 系統 → 種類 → 全体）。
     ＊出す刻が既に過ぎていたら、当てた分を足して先へ延ばす。過ぎた時刻を出したままにしない。 */
  function endPredText(head) {
    /* head … 頭に置く字（v102）。既定は「作業中」。
       ＊v101 まで、いま動いている枠の印は**一番上の札の左**に出ていた。
         v102 でその札ごと畳んだので、印の出しどころがここになった。
       ＊呼ぶ側が「作業中（パネルの整理-13）」のような字を渡す。渡さなければ今までどおり。 */
    var W = head || '作業中';
    var endSec = lastEndAt;
    var gm = 0;
    if (endSec <= 0) {
      gm = guessMin(lastSubj);
      if (gm > 0 && lastStartedAt > 0) { endSec = lastStartedAt + gm * 60; }
    }
    var nowSec = Math.floor(Date.now() / 1000);
    /* 遠すぎる刻は当てにしない（v107）。上の黄色の行と同じ見張り。 */
    if (endSec > 0 && (endSec - nowSec) > FAR_SEC) { endSec = 0; gm = 0; }
    if (endSec > 0 && endSec <= nowSec) {
      var step = (gm > 0 ? gm : 10) * 60;   /* 延ばす幅。当てが無ければ10分刻み */
      var guard = 0;
      while (endSec <= nowSec && guard < 200) { endSec += step; guard++; }
    }
    if (endSec > 0) {
      var e = new Date(endSec * 1000);
      return W + '、' + e.getHours() + '時' + ('0' + e.getMinutes()).slice(-2) + '分終了予定';
    }
    return W + '、終了予定不明';
  }

  /* 板の跡地へ出す状態の一行（v91 で三通り・v94 で字を替えた）。
       ・作業中   … 「作業中、HH時MM分終了予定」（endPredText が組む。今までどおり）
       ・手待ち   … **「次の指示待ち」**
       ・ヨシ待ち … **「ヨシを返してください」**
     ＊v93 までは「手待ち・経過N分」「ヨシ待ち・経過N分」と数字を出していた。**数字はやめた。**
       この行が言うべきは「いま誰の番か」であって、待った長さではない。
       ＊数字が要るときは、上の札のヨシ待ちの側（「ヨシ待ち・N分N秒」）が持っている。
     ＊数字を出さなくなったので、経過の基準（sinceBase）はもう見ない。
     ＊上の三つ以外（連絡なし・読めないとき）は**行ごと出さない**。 */
  /* 刻を「HH:MM」の字にする。黄色の行と、上の札を組む側の両方が使う（v98）。 */
  function pad2s(sec) {
    var t = new Date(sec * 1000);
    return ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
  }
  /* 黄色の行が使う値。pullState が取得のたびに置き直す（v98）。 */
  var lastStartHM = '', lastOrderHM = '';
  /* いま動いている枠の印（v102）。黄色の行の頭に出す。pullState が置き直す。 */
  var lastMark = '';

  /* 件名を「印」と「説明」に割る（v99）。
       例 … 「パネルの整理-8（お知らせを消し、黄色の行を固定位置へ）— panel v97」
              → 印 ＝ パネルの整理-8
                 説明 ＝ お知らせを消し、黄色の行を固定位置へ — panel v97
     ＊印は頭から、括弧・空白・ダッシュのどれかに当たるまで。
     ＊括弧の中は説明の頭へ回し、括弧の外に続く分（「— panel v97」など）はその後ろへ繋ぐ。
     ＊説明が無い件名（「パネルの整理-9」だけ）は、説明を空にする。
       **印を左に出すので、右へ同じ字をもう一度出さない。**
     ＊割れない形（印が取れない）のときは、印を空にして全部を説明へ回す。
       そのときは今までどおり右側だけに出る。 */
  function splitSubj(t) {
    var s = String(t || '').trim();
    if (!s) { return { mark: '', rest: '' }; }
    var m = s.match(/^([^（(\s—]+)\s*(?:（([^）]*)）)?\s*(.*)$/);
    if (!m || !m[1]) { return { mark: '', rest: s }; }
    var inner = m[2] || '';
    var tail = (m[3] || '').trim();
    var rest = (inner + ((inner && tail) ? ' ' : '') + tail).trim();
    /* 頭に残った繋ぎのダッシュは落とす（v99）。
       ＊「v1429 — 副産物三件を…」のように括弧で始まらない件名だと、
         印を外したあとに「— 副産物三件を…」と横棒から始まってしまう。
       ＊落とすのは**頭の一つだけ**。文中のダッシュには触らない。 */
    rest = rest.replace(/^[—–ー-]\s*/, '');
    return { mark: m[1], rest: rest };
  }

  /* **異常はここに出さない**で確定（2026-09-01 の裁定）。
     ＊異常は 🪟 の押し送りで直接鳴る形が既にある。パネルにも持つと**二重**になり、
       片方だけ古い・片方だけ出る、という食い違いの元になる。
     ＊よってこの行は 作業中／次の指示待ち／ヨシ待ち の**三通りのまま**でよい。
       状態が異常の回は、今までどおり行ごと出さない（下の return ''）。
     ＊この点は**今後掘り返さない**。検査（panel-check.js）にも同じ一行が入っている。 */
  /* 最後に終わった仕事（v115）。控えの札から、いちばん新しい「終わり／調べた」を採る。
     ＊名は一行目の括弧より前だけ（「読みの道-3（…）」→「読みの道-3」）。
     ＊写した札も含めて見る（写したら消える、では「何を終えたか」が分からなくなる）。 */
  function lastDone() {
    var best = null;
    (allRows || []).forEach(function (d) {
      var t = String(d.title || '');
      if (t.indexOf('終わりました') < 0 && t.indexOf('調べました') < 0) { return; }
      if (/写せます（/.test(String(d.message || ''))) { return; }   /* 数だけの札は仕事ではない */
      if (!best || (d.time || 0) > (best.time || 0)) { best = d; }
    });
    if (!best) { return null; }
    var nm = plain(headOf(best)).split(/[（(＝=]/)[0].replace(/s+$/, '');
    if (!nm) { return null; }
    return { name: nm, at: hhmm(best.time) };
  }

  function stateLineText() {
    if (lastStat === '作業中') {
      /* 添えの括弧（v98）。上の札から移してきた三つ。
         ＊開始と指示は pullState が控えた字をそのまま使う。
         ＊経過は**ここで数え直す**。塗るたびに新しくなる（15秒ごとの取得で進む）。
         ＊取れない項目は落とす。「—」で埋めない（無いことを字で埋めない決め）。 */
      var bits = [];
      if (lastStartHM) { bits.push('開始' + lastStartHM); }
      if (lastStartedAt > 0) {
        bits.push('経過' + Math.max(0, Math.floor((Date.now() / 1000 - lastStartedAt) / 60)) + '分');
      }
      if (lastOrderHM) { bits.push('指示' + lastOrderHM); }
      /* 頭に**いま動いている枠の印**を入れる（v102）。
         ＊v101 まで印は一番上の札の左に出ていた。v102 でその札を畳んだので、
           **印の出しどころがこの行だけ**になった。出さないと、何の件で動いているかが
           画面のどこにも無くなる。
         ＊印が取れない回（件名が割れない形）は、今までどおり「作業中、…」のまま。 */
      var head = '作業中' + (lastMark ? '（' + lastMark + '）' : '');
      return endPredText(head) + (bits.length ? ('（' + bits.join('・') + '）') : '');
    }
    /* ---- 何を終えて待っているのかを、先に出す（v115・パネルの見え方-1 ③⑥）----
       ＊「次の指示待ち」だけでは、**何が終わってこうなったのか**が画面のどこにも無い。
       ＊形は「<題> が終わりました・次の指示待ち」。題を**先**に置く。
       ＊題は最後に終わった札の一行目から、括弧より前だけを採る（長い件名で行が溢れないため）。
       ＊刻は小さく添える。終わった札が見つからない回は、今までどおり「次の指示待ち」だけ。 */
    if (lastStat === '手待ち') {
      var fin = lastDone();
      if (fin) {
        return '<span class="fin">' + esc(fin.name) + ' が終わりました</span>'
             + '<span class="finT"> ' + esc(fin.at) + '</span>・次の指示待ち';
      }
      return '次の指示待ち';
    }
    if (lastStat === 'ヨシ待ち') { return 'ヨシを返してください'; }
    return '';
  }

  /* 「N件」を数字と単位に分けずに、そのまま字で組む。 */
  function boardHtml() {
    if (!board) {
      return '<li class="why"><p class="m">'
           + esc('板の値を読めません（' + (boardErr || '理由ふめい') + '）。board.json が公開ページに無いか、通信が届いていません。')
           + '</p></li>';
    }
    /* 改行は逃がし字ではなく符号から作る。差し替えの途中で本物の改行に化けたことがあるため。 */
    var NL = String.fromCharCode(10), CR = String.fromCharCode(13);
    var h = '';

    /* 上段 — あなた待ち。**こちらの番の件だけ**。無ければ「0件」とだけ言う。
       ＊まとめて写したあとは 0件 として出す（v56）。中身も出さない。 */
    var w = (!boardTaken && board.waiting && board.waiting.length) ? board.waiting : [];
    /* 折り畳み式（v47）。表紙は「あなた待ち（N件）」の一行だけ。押すと全文が開く。 */
    var wk = 'board:waiting';
    /* 写す釦は**表題の行**へ置く（v56）。札の写す釦と同じ形・同じ場所にする。
       ＊もとは本文の側（p.m）に置いていたが、そこは畳んでいるあいだ隠れるので、
         表紙だけ見えている状態では押せなかった。
       ＊`cp` で始まる名は一覧の写す釦の受けが拾ってしまうので、**id で先に分ける**。 */
    /* 開いた形で組み直すのは**中身があるときだけ**（v60）。
       ＊0件のときに開いた印が残っていると、中身が無いのに開いた形になり、
         空の帯だけが居座って見えた。0件は必ず畳んだ形にする。 */
    /* ---- 0件の箱は出さない（v90）----
       ＊v89 までは「あなた待ちは0件」という表紙だけの箱が常に居座っていた。
         **無いことを言うためだけの箱**で、読む場所が一つ増えるだけだった。
       ＊有るときの表示（表紙＋写す釦＋開いた中身）は**そのまま残す**。
       ＊この跡地へは、作業中のときだけ終了予定の一行が入る（下の endPredText）。 */
    if (w.length) {
      h += '<li class="why ack board' + (isOpen(wk) ? ' open' : '') + '" data-k="' + okey(wk) + '">'
         + '<p class="t"><span class="tx">'
         + esc('あなた待ち（' + w.length + '件）')
         + '</span>'
         + '<button type="button" class="cp" id="cpWait">写す</button></p>';
      /* 件名の下に、印・立てた時刻・待ちの種類・動く条件を小さめの字で一行足す（v58）。
         ＊この一行は本文（p.m）の中なので、畳んでいるあいだは出ない。開いたときだけ見える。
         ＊元の値に無い項目は、その項目だけ落とす（無いことを「—」で埋めない）。 */
      h += '<p class="m">' + w.map(function (it, i) {
             var head = esc((i + 1) + '. ' + (it.name || '') + '（' + (it.why || '') + '）');
             var bits = [];
             if (it.no) { bits.push('印 ' + it.no); }
             if (it.at) { bits.push('立てた ' + it.at); }
             bits.push(waitKind(it.why));
             var cond = waitCond(it.why);
             if (cond) { bits.push(cond); }
             return head + '<br><span class="wmeta">' + esc(bits.join(' ／ ')) + '</span>';
           }).join('<br>') + '</p>';
      h += '</li>';
    }

    /* ＊状態の一行は **v97 でここから出した**（#stLine へ移した）。
         板が出ない回にも常に見えている要があるため。組むのは paintStateLine()。 */

    /* 下段 — 直近に終わった仕事3件。件名と、結果を一行だけ。 */
    var r = (!boardTaken && board.recent && board.recent.length) ? board.recent : [];
    /* 板の枠は札ではないので、決め打ちの鍵を与える（v47）。 */
    var rk = 'board:recent';
    /* こちらにも写す釦を付ける（v56）。あなた待ちと同じで、表題の行に置く。 */
    /* こちらも、開いた形で組み直すのは中身があるときだけ（v60）。 */
    h += '<li class="ack board' + ((r.length && isOpen(rk)) ? ' open' : '') + '" data-k="' + okey(rk) + '">'
       + '<p class="t"><span class="tx">' + esc('直近に終わった仕事（' + r.length + '件）') + '</span>'
       + '<button type="button" class="cp" id="cpRecent">写す</button></p>';
    /* 畳んだままでも題が読めるように、小さな行を添える（v115・パネルの見え方-1）。
       ＊`.m` は開いたときだけ見える。こちらは**表紙の下に常に出る**。
       ＊出すのは番号（no）と題（name）だけ。中身（result）は開いてから読む。 */
    if (r.length) {
      h += '<p class="sub">' + r.map(function (it) {
             var nm = String(it.no || '');
             var tt = String(it.name || '');
             return '<span>' + esc('・' + (nm ? nm + '　' : '') + tt) + '</span>';
           }).join('') + '</p>';
    }
    if (r.length) {
      h += '<p class="m">' + esc(r.map(function (it) {
             /* 結果は**切らない**（v47）。畳んである枠なので、開いた人は全文が読める。
                ＊v45 では78字で切っていたが、**中身を切って出す形はやめた**。 */
             var line = String(it.result || '').split(CR).join(' ').split(NL).join(' ');
             return '・' + (it.name || '') + NL + '　　' + line;
           }).join(NL)) + '</p>';
    }
    /* ＊0件のときの「まだありません。」は **v60 で外した**。
         表紙が「直近に終わった仕事（0件）」と既に言っているので、中身の側で言い直す必要が無い。
         残しておくと、畳んだはずの箱に27pxの空の帯が居座って見えた。 */
    h += '</li>';

    return h;
  }

  /* ---- 板の写し（v46）----
     ＊画面では長い結果を78字で畳んでいるが、**控えには全文を入れる**。
       写し取るのは読み返すためで、そこで切れていては用をなさない。
     ＊改行は逃がし字ではなく符号から作る（差し替えで本物の改行に化けたことがあるため）。 */
  function ymdText(d) {
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function waitText() {
    var NL = String.fromCharCode(10);
    if (!board) { return 'あなた待ち：板の値を読めません（' + (boardErr || '理由ふめい') + '）'; }
    var w = (board.waiting && board.waiting.length) ? board.waiting : [];
    if (!w.length) { return 'あなた待ちは0件'; }
    /* 画面に出した添えの一行（印・立てた時刻・種類・動く条件）も、そのまま写しへ入れる（v58）。
       ＊この釦は「一覧をそのまま写す」ためのもの。画面と写しで中身が違うと用をなさない。 */
    return 'あなた待ち ' + w.length + '件' + NL + w.map(function (it, i) {
      var bits = [];
      if (it.no) { bits.push('印 ' + it.no); }
      if (it.at) { bits.push('立てた ' + it.at); }
      bits.push(waitKind(it.why));
      var cond = waitCond(it.why);
      if (cond) { bits.push(cond); }
      return (i + 1) + '. ' + (it.name || '') + '（' + (it.why || '') + '）'
           + NL + '   ' + bits.join(' ／ ');
    }).join(NL);
  }

  function recentText() {
    var NL = String.fromCharCode(10), CR = String.fromCharCode(13);
    if (!board) { return '直近に終わった仕事：板の値を読めません'; }
    var r = (board.recent && board.recent.length) ? board.recent : [];
    if (!r.length) { return '直近に終わった仕事：まだありません。'; }
    return '直近に終わった仕事' + NL + r.map(function (it) {
      var line = String(it.result || '').split(CR).join(' ').split(NL).join(' ');
      return '・' + (it.name || '') + NL + '　　' + line;
    }).join(NL);
  }

  /* 今日の報告 ＝ 今日届いた知らせの本文、全部。写した札も含める（読み返すためなので落とさない）。 */
  function todayText() {
    var NL = String.fromCharCode(10);
    var d0 = new Date(); d0.setHours(0, 0, 0, 0);
    var t0 = Math.floor(d0.getTime() / 1000);
    var rows = (allRows || []).filter(function (d) {
      return d && typeof d.time === 'number' && d.time >= t0;
    });
    rows.sort(function (a, b) { return (a.time || 0) - (b.time || 0); });
    var head = '今日の報告（' + ymdText(d0) + '・' + rows.length + '件）';
    if (!rows.length) { return head + NL + '今日はまだありません。'; }
    return head + NL + rows.map(function (d) {
      return '［' + (d.title || '(題なし)') + '］' + hhmm(d.time) + NL + String(d.message || '');
    }).join(NL + NL);
  }

  /* 写して、字を戻す。**札の写した印には触らない**——これは読み出しであって受け渡しではない。 */
  function copyInto(btn, text, back) {
    var base = (btn.id === 'btnCopyBoard') ? 'cpall' : 'cp';
    var ok = function () {
      btn.textContent = '写した';
      btn.className = base + ' ok';
      setTimeout(function () { btn.textContent = back; btn.className = base; }, 2000);
    };
    var ng = function () {
      fallback(text);
      btn.textContent = '写せません';
      setTimeout(function () { btn.textContent = back; btn.className = base; }, 3000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { navigator.clipboard.writeText(text).then(ok, ng); } catch (e) { ng(); }
    } else { ng(); }
  }

  /* 知らせの一覧のURLを写す（v64）。
     ＊写すのは**この一行だけ**。前後に改行も空白も付けない。
     ＊copyInto は釦の名で札を選ぶ作りで、こちらは cpall のままにしたいので、
       同じ手をここへ書く。字を戻す先も札も、この釦のものを使う。 */
  var NOTICES_RAW = 'https://raw.githubusercontent.com/kfsr148-art/koushu-handan/main/notices.json';
  function copyUrl(btn) {
    var back = 'URLを写す';
    var reset = function (ms) {
      setTimeout(function () { btn.textContent = back; btn.className = 'cpall url'; }, ms);
    };
    var ok = function () { btn.textContent = '写した'; btn.className = 'cpall url ok'; reset(2000); };
    var ng = function () { fallback(NOTICES_RAW); btn.textContent = '写せません'; reset(3000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { navigator.clipboard.writeText(NOTICES_RAW).then(ok, ng); } catch (e) { ng(); }
    } else { ng(); }
  }

  function copyWait(btn) { copyInto(btn, waitText(), '写す'); }
  /* 直近に終わった仕事の写す釦（v56）。中身は recentText() の全文で、どこも切らない。 */
  function copyRecent(btn) { copyInto(btn, recentText(), '写す'); }

  /* お知らせ（まだ写していない札）を全文で（v48）。
     ＊件名も本文も括弧の中身も**切らない**。写し取るのは読み返すためで、
       そこで切れていては用をなさない。
     ＊数え方は釦（setCopyAllLabel）と同じ `shown`。別の数え方を持ち込まない。
     ＊写した印には触らない。こちらは読み出しで、受け渡しではない。 */
  function noticesText() {
    var NL = String.fromCharCode(10);
    var todo = (shown || []).filter(function (d) { return !isDone(d); });
    todo.sort(function (a, b) { return (a.time || 0) - (b.time || 0); });   /* 古い順 */
    var head = 'お知らせ（' + todo.length + '件）';
    if (!todo.length) { return head + NL + 'いまは有りません。'; }
    return head + NL + todo.map(function (d) {
      return '［' + (d.title || '(題なし)') + '］' + hhmm(d.time) + NL + String(d.message || '');
    }).join(NL + NL);
  }

  /* 順は お知らせ → あなた待ち → 直近に終わった仕事 → 今日の報告 → 現況の一行（v48）。 */
  /* まとめて写すの釦に出す件数（v52・v74 で数え方を一箇所へ寄せた）。
     ＊数えるのは**実際に写しに入る札**だけ。数えるのは buildBundle() ただ一つで、
       押す前の字も、押した後の「N件 写した」も、同じ一回の走査の結果を使う。
     ＊今日の報告と現況の一行は数えない。あちらは読み返すための添えで、片付く物ではない。
     ＊あなた待ちと直近に終わった仕事は**数える**（v56）。まとめて写すで一緒に渡り、
       押したあとは 0件 になるので、片付く物として数の中に入れる。 */
  function boardCount() { return buildBundle().count; }
  function boardLabel() { return 'まとめて写す（' + boardCount() + '件）'; }
  /* 作業中の札（v78）。写しに入る札のうち、題から読める状態が「作業中」のもの。
     ＊見るのは buildBundle() と同じ todo（＝片付いていない札）なので、
       釦の数と同じ走査を見ていることになる。
     ＊stateWord() は五つのどれかを必ず返す。題から読み取れない札も「作業中」に落ちる。 */
  function workingCards() {
    var todo = (shown || []).filter(function (d) { return !isDone(d); });
    return todo.filter(function (d) { return stateWord(d && d.title) === '作業中'; });
  }
  /* 作業中が一件でもあれば、まとめて写すは押させない（v78）。
     ＊字を「作業中 — 終わるまで待つ」に変え、disabled にする（見た目は上の CSS）。
     ＊0件に戻れば、そのまま元の「まとめて写す（N件）」へ戻る。
     ＊個別の「写す」釦は触らない。要る札は一枚ずつ取れる。 */
  /* 直近の「写せます（N件）」の知らせが言っている数を読む（v96）。
     ＊控えの札（allRows）を新しい順に見て、本文に「写せます（N件）」を含む
       いちばん新しい一枚から N を取る。
     ＊まとめ札（「この間にまとまった知らせ 2本」）の中に入っていることもあるので、
       一行目だけでなく**本文のどこでも**当てる。
     ＊見つからなければ 0 を返す。呼ぶ側が落とし方を決める。 */
  function lastReadyCount() {
    var best = null;
    (allRows || []).forEach(function (d) {
      var mm = String(d.message || '').match(/写せます（(\d+)件）/);
      if (!mm) { return; }
      var t = d.time || 0;
      if (!best || t > best.t) { best = { t: t, n: parseInt(mm[1], 10) }; }
    });
    return best ? best.n : 0;
  }

  /* 写せる札の目次を塗る（v115・パネルの見え方-1）。
     ＊並びは釦の数と**同じ一回の走査**（mergedTodo）から取る。数と中身がずれない。
     ＊題は札の一行目（headOf）、通知は題そのもの。刻は時と分だけ。 */
  function paintTodoList() {
    var el = $('todoList');
    if (!el) { return; }
    var a = mergedTodo();
    if (!a.length) { el.innerHTML = ''; el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = a.map(function (m) {
      var name, mark, t;
      if (m.kind === 'card') {
        name = plain(headOf(m.card)) || '（件名なし）';
        mark = kindMark(m.card.title);
        t = hhmm(m.card.time);
      } else {
        name = String(m.ntfy.title || '（題なし）');
        mark = '📣';
        t = hhmm(m.ntfy.time);
      }
      return '<li><span class="tt">' + esc(name) + '</span>'
           + '<span class="tm">' + esc(mark + ' ' + t) + '</span></li>';
    }).join('');
  }

  /* 種類の一字（v115）。写せる札の目次で使う。 */
  function kindMark(title) {
    var t = String(title || '');
    if (t.indexOf('🙋') >= 0) { return '🙋'; }
    if (t.indexOf('🔎') >= 0) { return '🔎'; }
    if (t.indexOf('🪟') >= 0) { return '🪟'; }
    if (t.indexOf('🕒') >= 0) { return '🕒'; }
    if (t.indexOf('🕘') >= 0) { return '🕘'; }
    return '✅';
  }

  function setCopyBoardLabel() {
    var b = $('btnCopyBoard');
    paintTodoList();   /* 目次は釦の字と同じ回に塗る（v115） */
    if (!b) { return; }
    /* ＊v92：この関数は作業中かどうかを見なくなった。釦の出し入れは
         「写せる札が在るか」だけで決まる。状態は板の跡地の一行が受け持つ。
         （v82 で入れた `var busy = (lastStat === '作業中')` は、見る相手が無くなったので外した。） */
    /* ---- 釦は「写せる札が在るとき」だけ（v84 で順序を決め、v92 で予定表示を外した）----
       ＊写せる札が1件でも在るあいだは、**作業中でも**「まとめて写す（N件）」を出して押させる。
         済んだ札は作業の状態と関わりが無い。写せるものを、作業中だからと止めない。
       ＊N は未写しの札の数（buildBundle().count）。押せば必ずこの数が写る。
         写せますの知らせの N と**同じ物**を指す。
       ＊**未写しが0件なら、状態を問わず畳む（v92）。**
         v84〜v91 は作業中のとき「作業中、HH時MM分終了予定」を押せない釦として出していたが、
         v90 で板の跡地にも同じ字の行を置いたので、**同じ字が二段に並んでいた**。
         押せない釦は用が無いので釦の側を外し、**字だけの一行**（黄色）を残す。 */
    var n = buildBundle().count;   /* v114：札と通知の合計（mergedTodo が数える） */
    /* M ＝ **直近の「写せます（N件）」の知らせと同じ数**（v96）。
       ＊v95 は控えの札の全数（allRows.length）だった。あれは「溜まっている総量」で、
         **いま片付いたひとまとまりの大きさ**ではない。知らせが「写せます（2件）」と
         言っているのに釦が「全20件」と出ると、どちらを見ればよいのか分からない。
       ＊いまは知らせと同じ数を出す。**知らせが出るたびに M がその値へ置き直り、
         N は写すごとに減る。**全部写せば N は 0。
       ＊出どころは控えそのもの（allRows）。**知らせの本文に書いてある数**を読むので、
         知らせ側（watch-notify.ps1）と必ず同じ値になる。数え直しはしない。 */
    /* ---- M も N と同じものを数える（v117・矛盾の三つ-1 ③）----
       ＊v116 まで M は `lastReadyCount()`＝**直近の「写せます（N件）」の札に書いてある数**だった。
         あれは**知らせを出した時点の写し**で、こちらが写しても減らない。
         そのため「残1／3件・目次1行・写せます（3件）」のように、**分母だけが取り残される**。
         2026-09-04 の実測がこれ（10:13:01 の札が 3件、そのあと2件を写して残1）。
       ＊数の不一致-1 の裁定は「**三つとも、写した印の無い中身のある札の数で統一**」。
         分母もその数にする——つまり **M ＝ N**。残っている数と、数え上げの母数が同じものを指す。
       ＊崩れていた箇所はここ一つ。v116 で通知の在庫を外したとき、
         **`lastReadyCount()` を残したまま**にしたのが取りこぼしだった。 */
    var m = n;
    /* ＊知らせが一度も出ていない（控えに「写せます」の札が無い）ときは M が 0 になる。
         そのときは N をそのまま使う（「残N／N件」）。0 と出すより意味が通る。
       ＊知らせのあとに札が増えると N が M を超えることがある。そのときも N に揃える。
         **M が N より小さい字は出さない**（残のほうが多い、という読めない形になるため）。 */
    if (m < n) { m = n; }
    if (n > 0) {
      b.textContent = 'まとめて写す（残' + n + '／' + m + '件）';
      b.disabled = false;
      b.hidden = false;
    } else {
      /* 写せる札が無い。作業中かどうかに関わらず畳む。
         ＊字は残しておく。出し直したときに元の姿へ戻る。
         ＊状態（作業中／手待ち／ヨシ待ち）は、板の跡地の一行が受け持つ。 */
      b.textContent = 'まとめて写す（0件）';
      b.disabled = true;
      b.hidden = true;
    }
    /* 個別の「写す」は**常に押せる**（v84）。
       ＊v81〜v83 は作業中のあいだ全部 disabled にしていた。済んだ札まで写せなくなるので外した。
       ＊body.busy の class も付けない。掛ける先（CSS）を v84 で外した。
       ＊URLを写す（#btnCopyUrl）と写し取り一覧（#btnShots）は .cpall なので、もともと当たらない。 */
    document.body.classList.remove('busy');
    var cps = document.querySelectorAll('button.cp');
    for (var i = 0; i < cps.length; i++) { cps[i].disabled = false; }
  }

  /* ---- まとめて写しの中身（v65 で頭紙へ・v69 で本文を戻し・v72 で受領の行を落とした）----
     ＊並びは上から URL の一行 → 現況の一行 → 札。
       札は「ヨシしてください」を全部（全文）、そのあと残りを新しい順に全文で入れ、
       全体が四千字に達したら、そこから先は一行だけにして「ほかN件」で締める。
     ＊受け取った指示の一行は **v72 で落とした**。画面から消した行（v70）は写しにも入れない。
     ＊長い本文を貼ると受け取る側が添付へ変えてしまうので、四千字はその上限として置いた値。 */
  var NOTICES_PAGE = 'https://kfsr148-art.github.io/koushu-handan/notices.json';
  /* 本文を全文で入れる上限（v69）。ここに達したら、そこから先の札は一行だけにする。
     ＊四千字は「貼り付けが本文のまま届く上限」としてまず置いた値。
       実地で壊れるようなら下げる。下げるときはこの一行だけを直す。 */
  var BUNDLE_FULL_MAX = 4000;

  /* 一件一行。時刻・種別・件名・台帳の印を、この順に繋ぐ。空の項目は落とす。 */
  function briefOf(when, kind, name, no) {
    var a = [];
    if (when) { a.push(when); }
    if (kind) { a.push(kind); }
    if (name) { a.push(name); }
    if (no) { a.push('印 ' + no); }
    return a.join(' ／ ');
  }

  /* 札の並び。新しい順（上の一覧がそもそも新しい順に組んである）。
     ＊一枚につき、一行の形（brief）と全文の形（full）の両方を作っておく。
       どちらを使うかは buildBundle() が上限を見て決める。
     ＊絞りはここでは掛けない（v74）。渡された札をそのまま形にするだけにして、
       「写す札を選ぶ」走査を buildBundle() の一箇所に集める。 */
  /* 写しから落とす行の絞り（v106・写しの絞り-1）。
     ＊落とすのは**貼る写しだけ**。reports 側の記録も、パネルの画面も、今までどおり全部残る。
     ＊「ファイル:」は、読む側が判断に使わない行なので落とす。
       **ただし壊れの調べ・原因の特定が本題の回は残す**——どのファイルを見たかが答えの一部になるため。
       見分けは題と本文の字（調べました／原因／不具合／壊れ／落ちた／直し…）。
     ＊「実機:」は残す（触って確かめるのは読む側）。「実測:」と本文は今までどおり全部。 */
  var FILE_KEEP = /調べました|調べた|原因|不具合|壊れ|こわれ|落ちた|落ちて|失敗|誤り|直し|直す|異常|穴|取りこぼし|詰まり/;
  function trimForCopy(title, body) {
    var NL = String.fromCharCode(10);
    var keepFile = FILE_KEEP.test(String(title || '')) || FILE_KEEP.test(String(body || ''));
    if (keepFile) { return body; }
    var lines = String(body || '').split(NL);
    var out = [], drop = false;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (/^ファイル[:：]/.test(l)) { drop = true; continue; }      /* 行の頭から落とす */
      /* 続きの行（字下げ）も落とす。次の見出しが来たら戻す。 */
      if (drop) {
        if (/^(件名|待ち|外待ち|完了|実測|実機|未検収|種類|そのまま|印|版)[:：]/.test(l) || l === '') { drop = false; }
        else { continue; }
      }
      out.push(l);
    }
    return out.join(NL);
  }

  /* ＊**本文の切れは、ここではなかった**（2026-09-03・写しの切れ-1）。
       札の本文が一行目しか写らないという件を追ったところ、`full` は前から
       `line + 改行 + body` で**本文を丸ごと**繋いでいた。作り値（本文5行）で確かめても
       5行とも写しへ入る。落としていたのは**見張りの控えの読み手**（watch-notify.ps1）で、
       行ごとに見出しを当て、見出しに当たらない続きの行をどの枝でも拾わず捨てていた。
       ＊`ファイル:` の行だけが写しから消えるのは、写しの絞り（v106・trimForCopy）の仕事。
         こちらは意図どおりで、切れではない。
       ＊この裏は panel-check の ⑫ が取り続ける。 */
  /* 通知（ntfy-sent.json の一本）を、札と同じ形の「一行＋本文」にする（v114・写しの一本化-1）。
     ＊頭に**「通知」**と入れて、札と見分けられるようにする。刻と題は札と同じ並びに揃える。
     ＊本文は割る前の一枚がそのまま入っている（通知の分け方-1 以降、長い報告は札の側に立つ）。 */
  function ntfyCardOf(e) {
    var NL = String.fromCharCode(10);
    var line = briefOf(hhmm(e.time), '通知', String(e.title || '（題なし）'), '');
    return { brief: line, full: line + NL + String(e.body || ''), ask: false };
  }

  /* 札と通知を、刻の順（新しい順）で一本に並べる（v114）。
     ＊まとめて写すはこの並びだけを見る。数（残N）も、写す字も、印を付ける相手も、ここから取る。
     ＊未写しだけを返す。印の持ち方は別々（札は copied、通知は ntfyCopied）なので、
       それぞれの見方で外す。 */
  /* 「写せます（N件）」の札は、数にも目次にも入れない（v116・数の不一致-1 の裁定）。
     ＊あれは**数の知らせ**であって仕事ではない。入れると、釦の残・目次の行数・知らせの N の
       三つが揃わなくなる（2026-09-04 の実測：釦「残2／3件」・目次2行・知らせ「写せます（3件）」）。
     ＊三つとも**写した印の無い、中身のある札の数**で揃える。見張りの側も同じ決めで
       自分の一枚を足すのをやめた。
     ＊写す中身からも外れる（このふるいを通った物だけが写しに入る）。 */
  function isCountCard(d) {
    return /^写せます（[0-9]+件）$/.test(String((d && d.message) || '').trim());
  }

  function mergedTodo() {
    var a = [];
    (shown || []).forEach(function (d) {
      if (isCountCard(d)) { return; }
      if (!isCopied(d)) { a.push({ t: d.time || 0, kind: 'card', card: d }); }
    });
    (ntfySent || []).forEach(function (e) {
      if (!ntfyCopied[ntfyKeyOf(e)]) { a.push({ t: e.time || 0, kind: 'ntfy', ntfy: e }); }
    });
    a.sort(function (x, y) { return y.t - x.t; });
    return a;
  }

  function bundleCards(todo) {
    var NL = String.fromCharCode(10);
    return (todo || []).map(function (d) {
      var body = trimForCopy(d.title, String(d.message || ''));
      var head = body.split(NL)[0];
      var line = briefOf(hhmm(d.time), kindWord(d.title), plain(head) || '（件名なし）', '');
      return { brief: line, full: line + NL + body, ask: (kind(d.title) === 'ask') };
    });
  }

  /* 板の二段（あなた待ち・直近に終わった仕事）。こちらは本文を持たないので、常に一行。 */
  function bundleBoard() {
    var out = [];
    if (board && !boardTaken) {
      ((board.waiting) || []).forEach(function (it) {
        /* 立てた時刻は「yyyy-MM-dd HH:mm」で来る。出すのは時と分だけ。 */
        var m = String(it.at || '').match(/(\d{2}:\d{2})/);
        out.push(briefOf(m ? m[1] : '', 'あなた待ち', String(it.name || ''), it.no || ''));
      });
      /* ＊「直近に終わった仕事」の三行は **v106 で写しから落とした**（写しの絞り-1）。
           既に検収の済んだ分の繰り返しで、貼った先での判断には使わないため。
           **画面には今までどおり出る**（畳んだ箱の中）。落としたのは貼る写しだけ。 */
    }
    return out;
  }

  /* 写しの中身・落とす札・釦に出す数を、**同じ一回の走査**から作る（v74）。
     ＊v73 まではこれが四箇所に散っていた——boardCount()（押す前の字）／bundleCards()（写す札）／
       bundleBoard()（板の二枠）／copyBundle() の todo（落とす札と「N件 写した」の数）。
       同じ絞りを四度書いていたので、どれか一つが揃わないだけで数がずれた。
       実際 v73 では「N件 写した」だけが板の二枠を数えず、枠が1件以上ある回は必ずその数だけ少なく出た。
     ＊数え方はこう決める——**実際に out へ入れた札だけを数える**。
       札を一つ入れるたびに数を一つ増やす。入れ損ねた札は数に入らない。
     ＊返すのは三つ。text（写す字）／todo（落とす札の並び）／count（釦に出す数）。 */
  function buildBundle() {
    var NL = String.fromCharCode(10);
    /* ＊「受け取った指示 …」の一行は **v72 で写しからも落とした**。
         v70 で画面から消したので、写しにだけ残っているのは筋が通らない。
         画面から消した行は写しにも入れない、で揃える。
       ＊足していたのは push の一行だけなので、抜いても空行は残らない。 */
    var out = [NOTICES_PAGE, nowLine()];
    /* 作業中の札があるときは、文の頭に一行だけ立てる（v78）。
       ＊「未了 N件：（題）、（題）」の形。題は読点で並べる。
       ＊0件のときは行ごと出さない（空の見出しを残さない）。
       ＊釦は作業中のあいだ押せない（setCopyBoardLabel）ので、この行が出るのは
         個別の写しや、字を組んだ後に状態が変わった回の備え。写しだけを見て
         「まだ途中がある」と分かるようにしておく。 */
    /* 作業中の分は、頭の一行だけで示す（v84）。
       ＊いま動いている仕事には、まだ中身（報告）が無い。名前だけを一行で立てる。
       ＊出す名は札の題（lastSubj）＝**受けた枠の印**。控えを書き直す前は印そのもの、
         書き直したあとは件名になる（inbox-watch の側が決める）。
       ＊v78〜v83 は「未了 N件：（題）、（題）」の形だった。題は種別しか語らないので
         「🕒 延びています、🕘 定時の報せ」のように並び、何の件か分からなかった。
       ＊v79：一行目は必ず notices.json の URL。この行はその**次**へ入れる。
       ＊この行は数（N）に入れない。札ではないため。 */
    if (lastStat === '作業中') {
      out.splice(1, 0, '作業中 1件：' + (lastSubj || '（件名なし）'));
    }
    var count = 0;   /* 実際に out へ入れた札の数。釦に出るのはこの数 */
    /* 走査はここ一度きり。ここで選んだ札が、そのまま写しの中身になり、落とす札になる。 */
    /* ---- 写すのは未写しの分だけ（v89）----
       ＊v87/v88 は「写した印の付いた札」も混ぜて一本にしていた（読み返し）。
         押すたびに同じ札が何度も入り、写しが太るだけだった。**v89 で読み返しをやめた。**
       ＊写した札を後から見たいときは、**「終わりました」の箱の個別の「写す」**で足りる。
         あちらは v84 から作業中でも押せる。
       ＊数（釦の N）＝ 未写しの札の数。押せば必ずこの数が写り、この数だけ落ちる。
         **写せますの知らせの N も同じ物**（watch-notify.ps1 が「前に知らせてから増えた分」を数える）。 */
    /* ---- 札と通知を一本にまとめる（v114・写しの一本化-1）----
       ＊「通知を写す」の釦は畳んだ。**押す所を二つに分けない**のが眼目。
       ＊並びは刻の新しい順。札も通知も同じ物差しで並ぶ。 */
    var merged = mergedTodo();
    var todo = merged.filter(function (m) { return m.kind === 'card'; }).map(function (m) { return m.card; });
    var ntodo = merged.filter(function (m) { return m.kind === 'ntfy'; }).map(function (m) { return m.ntfy; });
    /* ＊読み返しの断り書きは v89 で外した。写すのは未写しの分だけなので、断る要が無い。 */
    /* 刻の順のまま、札は bundleCards、通知は ntfyCardOf で同じ形にする。 */
    var cards = merged.map(function (m) {
      return m.kind === 'card' ? bundleCards([m.card])[0] : ntfyCardOf(m.ntfy);
    });
    /* 「🙋 ヨシしてください」の札は、何枚あっても全部を全文で入れる（v66）。
       ＊ヨシを返す判断はここでしかできない。何を待っているかが写しに無いと、
         写しだけを見て返事ができない。上限の勘定より先に置く。 */
    cards.forEach(function (c) { if (c.ask) { out.push(c.full); count++; } });
    /* 残りは新しい順に全文で入れ、全体が上限に達したら、そこから先は一行だけにする（v69）。
       ＊落とすのではなく**短くする**。写しに名前は残るので、要る札は箱や一覧の
         写す釦で個別に全文を取れる。短くした札も写しには入っているので、数には入れる。 */
    var brief = 0;
    cards.forEach(function (c) {
      if (c.ask) { return; }
      if (out.join(NL).length < BUNDLE_FULL_MAX) { out.push(c.full); }
      else { out.push(c.brief); brief++; }
      count++;
    });
    /* 板の二段（あなた待ち・直近に終わった仕事）は、写しには入れるが**数には入れない**（v84）。
       ＊v74〜v83 は板の行も count に足していた。そのため釦の「N件」は
         「お知らせの札＋板の行」の合計になり、**N と札の枚数が食い違って見えた**
         （2026-08-30 実測：札20枚に対して count は 23）。
       ＊N は「押せば写る札の数」に揃える。板の行は札ではなく添えの一行なので、
         中身には入れたまま、数からは外す。 */
    bundleBoard().forEach(function (t) { out.push(t); });
    if (brief) { out.push('ほか' + brief + '件（写す釦で個別に写せます）'); }
    /* ＊v89：reread / unread / back は返さない。写すのは未写しだけなので、count が全部を語る。 */
    return { text: out.join(NL), todo: todo, ntodo: ntodo, count: count };
  }

  function copyBundle(btn) {
    /* 写しに入る札（v54）。この並びが、そのまま「落とす札」「印を付ける札」になる。
       ＊組むのは一度だけ（v74）。写す字も、落とす札も、釦に出す数も、この一回から取る。
       ＊落とす動きは v65 でも変えていない。変えたのは写す中身と数え方だけ。 */
    var bundle = buildBundle();
    var todo = bundle.todo;
    var text = bundle.text;

    /* 写せたときだけ、一枚ずつ写したときと同じ始末をする（v54）。
       ＊印を付ける → 一覧から落とす → 下の箱を組み直す → 二つの釦の字を組み直す。
         振り分けは箱の側が持つので、終わりましたは終わりましたの箱、
         調べました・その他は写した札の箱へ入る。
       ＊次の取得を待たない。待つと、押したのに残って見える。 */
    var done = function () {
      var nowSec = Math.floor(Date.now() / 1000);
      todo.forEach(function (d) { copied[keyOf(d)] = nowSec; });
      saveCopied();
      /* 通知の側にも印を付ける（v114）。持ち方は別だが、押す所は一つ。 */
      (bundle.ntodo || []).forEach(function (e) { ntfyCopied[ntfyKeyOf(e)] = 1; });
      try { localStorage.setItem(NTFY_COPIED_KEY, JSON.stringify(ntfyCopied)); } catch (e) {}
      shown = shown.filter(function (x) { return todo.indexOf(x) < 0; });
      /* 板の二段も写した扱いにする（v56）。行き先の箱が無いので、表紙を0件にして中身を消す。
         ＊板の中身が変わればこの印は解ける（pullBoard で見ている）。 */
      boardTaken = true;
      paintDoneBox(allRows);
      paintCopied(allRows);
      setCopyAllLabel();
      paintBoard();        /* 札が0件になるので、跡地へ板の二段を出す */
      /* 出す数は「実際に写しへ入った札の数」（v74）。todo.length は板の二枠を数えないので使わない。 */
      btn.textContent = bundle.count + '件 写した';
      btn.className = 'cpall ok';
      setTimeout(function () { setCopyBoardLabel(); btn.className = 'cpall'; }, 2000);
    };
    /* 写せなかったときは印を付けない。落としもしない（copyOne と同じ構え）。
       ＊成功に見せると、写せていない札が片付いたように見える。 */
    var ng = function () {
      fallback(text);
      btn.textContent = '写せません';
      setTimeout(function () { setCopyBoardLabel(); btn.className = 'cpall'; }, 3000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { navigator.clipboard.writeText(text).then(done, ng); } catch (e) { ng(); }
    } else { ng(); }
  }

  /* 押し送った本文を写す（v111・通知のコピー-1）。**「まとめて写す」と同じ形**にした。
     ＊一度のタップで写る … 本文は**先に取っておく**。押してから取りに行くと、
       取得を待つあいだに iOS Safari の「触られた」印が切れ、一度目のタップで写せない。
       **押したときにするのは写すことだけ**。
     ＊印と残N／M件 … 写した本文には印を付け（`localStorage`）、釦は「残N／M件」を出す。
       N は未写しの本数、M は控えにある本数。押すごとに N が減る。
     ＊畳み … 未写しが0本になったら釦ごと畳む（「まとめて写す」と同じ）。
     ＊分割は結合して一枚 … 控えには**割る前の一枚**が入っている。未写しが複数あれば、
       古い順に continuous へ繋いで**一度に一枚**で写す。 */
  var NTFY_SENT_URL = 'https://kfsr148-art.github.io/koushu-handan/ntfy-sent.json';
  var NTFY_COPIED_KEY = 'ntfyCopied.v1';
  var ntfySent = [];          /* 先に取っておいた一覧（古い順） */
  var ntfyCopied = {};        /* 写した印。鍵は 刻|題 */
  var ntfyBusy = false;      /* 「N件 写した」を見せている間。字を上書きさせない目印（v111） */
  try { ntfyCopied = JSON.parse(localStorage.getItem(NTFY_COPIED_KEY) || '{}') || {}; } catch (e) { ntfyCopied = {}; }
  function ntfyKeyOf(d) { return String(d.time || 0) + '|' + String(d.title || ''); }
  /* ＊`ntfyLeft` / `ntfyBundle` / `setCopyNtfyLabel` / `copyNtfyLatest` は **v114 で畳んだ**
       （写しの一本化-1）。押す所を一つにしたので、通知だけを数える手も写す手も要らない。
       ＊残してあるのは `ntfyKeyOf`（印の鍵）と `ntfyCopied`（印）と `pullNtfyLatest`（取得）。
         この三つは、まとめて写すの側（mergedTodo）がそのまま使う。 */

  function pullNtfyLatest() {
    return fetch(NTFY_SENT_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      /* 通知が増えたら**まとめて写すの字**を組み直す（v114）。
         ＊釦を一つにしたので、数え直す先もそちら一つ。 */
      .then(function (a) { if (Array.isArray(a)) { ntfySent = a; setCopyBoardLabel(); } })
      .catch(function () { /* 取れない回は前の控えを残す。空で塗り潰さない */ });
  }

  function paintBoard() { $('board').innerHTML = boardHtml(); }

  /* 状態の一行を、固定の置き場（#stLine）へ塗る（v97）。
     ＊お知らせの一覧とも板とも切り離してあるので、**どの回でも同じ場所に出る**。
     ＊字が取れないとき（連絡なし・読めないとき）は器を空にする。行ごと消える。 */
  function paintStateLine() {
    var el = $('stLine');
    if (!el) { return; }
    var sl = stateLineText();
    /* 刻だけを包む（v108）。**逃がしたあとで包む**——包んでから逃がすと、
       足した札そのものが字として出てしまう。刻は数字と漢字だけなので、逃がしても形は変わらない。
       ＊包むのは「HH時MM分終了予定」の形だけ。「終了予定不明」「終了予定 未定」は包まない
         （刻が無いので、目立たせる相手がいない）。 */
    /* ＊v115 から、手待ちの行は**組んだ時点で札を含む**（題を色分けするため）。
         その回は逃がさない——逃がすと札そのものが字として出る。
         刻の色分け（v108）は作業中の行だけなので、包む相手も作業中のときだけ。 */
    var hasTag = (sl.indexOf('<span') >= 0);
    var sh = sl ? (hasTag ? sl : esc(sl).replace(/([0-9]+時[0-9]+分終了予定)/, '<span class="pred">$1</span>')) : '';
    el.innerHTML = sh ? ('<li class="why stline"><p class="m">' + sh + '</p></li>') : '';
  }

  /* この札は片付いているか。「写す」を押した／「ここまで読んだ」に含まれる、のどちらか。 */
  function isDone(d) {
    if (copied[keyOf(d)]) { return true; }
    if (seenUpto && d && typeof d.time === 'number' && d.time <= seenUpto) { return true; }
    return false;
  }
  /* 写した印だけで見る側（v104・写しの食い違い-1）。
     ＊「まとめて写す」の束ねと残の数えは**こちら**を使う。
       isDone は seenUpto（ヨシした数の印）でも札を落とすが、**写せますの N を数える側
       （watch-notify.ps1）は印より後を種類も問わず全部数える**。seenUpto で落ちた札
       （ヨシ済みの定時の報せ・延びています等）が「数えたのに束ねない」ずれを作っていた
       ——2026-08-31 の実測：写せます（4件）に対し、束ねる側だけが札を落とし得た。
     ＊束ねる側は**写した印（copied）だけ**で落とす。押せば全部に印が付くので、
       次の回からは残0。数える側には例外を入れない（あちらは触らない）。
     ＊seenUpto は「ヨシした数」の箱の見せ方に残る。役目を分けた。 */
  function isCopied(d) { return !!copied[keyOf(d)]; }
  /* 最後の更新からこれを超えたら「連絡なし」。
     ＊見張りは「変化があったときだけ」流す作りだったので、**手待ちの間は何も書かない**。
       そこへ v39 で 30分の脈（`$PULSE_SEC`）を入れた。**この閾値は脈と対で決まる**——
       脈より短い閾値だと、脈を打っているのに赤帯が出る。**片方だけ変えないこと。**
     ＊v40 で 1200 へ戻したのは「あの3時間半は窓が落ちていて赤帯は正しかった」という
       読みによるが、**その読みが誤りだった**。記録では窓は生きていた——08:48:41 の
       resume が 05:07 に付けた題のまま同じ取っ手へ繋がり、usage.json は帯の全域で
       `windows:1`・cpu 0.5〜0.9% を出し続けている。v41 で 2700 へ戻した。
     ＊**赤帯は「本当に止まった時だけ」出す。**手待ちと窓落ちの見分けは、この閾値ではなく
       **`watch.claude` の本数**（v40 で「窓に繋がっている claude の数」へ直した）で行う。 */
  var STALE_SEC = 2700;

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ＊話題名の設定は v17 で丸ごと撤去した。
       一覧は notices.json、状態は state.json、版は ver.txt から読む。どれも話題名を使わない。
       送る側の道具は v11 で、ntfy そのものは v15 で無くなった。話題名の出番はもう無い。
       ＊残しておくと罠になる。load() が話題名の保存を必須にしていたので、
         新しい端末では設定画面から先へ進めなくなる。
       ＊保存済みの値（localStorage の kh-panel-topics）は消さない。害が無く、
         古い写しへ戻したくなったときに要る。 */

  var sinceTimer = null;
  var usageTimer = null;
  var boardTimer = null;
  var verTimer = null;

  /* 版の見張りを**一度きりにしない**（v42）。
     ＊`checkPanelVer` は `showMain()` から**開いた一度だけ**呼ばれていた。パネルは
       開きっぱなしで使うもので、中身は15秒ごとに取りに行くが**頁は読み直されない**。
       そのため v38 を掴んだ端末が **v39・v40・v41 を三度続けて取り逃がした**
       （2026-08-27 実機。公開側は panel-ver.txt も panel.html も v41 で正しかった）。
     ＊二本立てで見る——**5分ごと**と、**画面が手前に戻ったとき**。
       iOS は背面に回すと時計を止めるので、時間だけでは間に合わない。
     ＊`checkPanelVer` 自身が「同じ版へ二度は跳ばない」を持っているので、
       何度呼んでも堂々巡りにはならない。 */
  function watchPanelVer() {
    if (verTimer) { clearInterval(verTimer); }
    verTimer = setInterval(checkPanelVer, 300000);
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { checkPanelVer(); }
  });

  /* ---- RunCat の猫（v103）----
     Cat sprites: RunCat Neo (runcat-dev, Apache-2.0)
     ＊現況（lastStat）で切り替える。**新しい取得はしない**——パネルが既に読んでいる値だけ見る。
         作業中       … cat0→1→2→3→4→0 のコマ送り（1コマ100ミリ秒）
         それ以外全部 … cat-sleep の静止絵（次の指示待ち・ヨシ待ち・連絡なし・読めない、みな眠る）
     ＊六枚は最初に一度だけ先読みして持つ。毎コマ src を替えるだけなので、通信は起きない。
     ＊眠りへ入るときに src を一度だけ替え、眠っている間は書き換えない（無駄な描き直しを避ける）。 */
  var catTimer = null;
  var catFrames = ['cat0.png', 'cat1.png', 'cat2.png', 'cat3.png', 'cat4.png'];
  var catI = 0;
  var catAwake = false;
  (function () {   /* 先読み。読めなくても画面は壊れない（img が出ないだけ） */
    catFrames.concat(['cat-sleep.png']).forEach(function (n) { var im = new Image(); im.src = n; });
  })();
  function runCatTick() {
    var el = $('runcat');
    if (!el) { return; }
    if (lastStat === '作業中') {
      catAwake = true;
      catI = (catI + 1) % catFrames.length;
      el.src = catFrames[catI];
    } else if (catAwake || el.src.indexOf('cat-sleep') < 0) {
      catAwake = false;
      el.src = 'cat-sleep.png';
    }
  }

  function showMain() {
    $('main').className = '';
    checkPanelVer();
    watchPanelVer();
    pullVer();
    pullEst();   /* 過去の実測（estimates.json）。見込みが無いときの終了予定に使う（v82） */
    pullSeen();   /* 「ここまで読んだ」を先に取る（v34）。一覧を組む前に間に合わせる */
    pullBoard();  /* 板の三つ（v44）。一覧が空のときだけ出るが、取得は先に始める */
    pullUsage();
    tick();
    if (timer) { clearInterval(timer); }
    pullNtfyLatest();     /* 押したその場で写せるよう、開いたときに一度取っておく */
    timer = setInterval(tick, 15000);
    /* 使用量は10分ごとにしか動かないので、取りに行くのも控えめでよい（2分ごと）。 */
    if (usageTimer) { clearInterval(usageTimer); }
    usageTimer = setInterval(pullUsage, 120000);
    /* 板は10分ごとにしか書き直されないので、取りに行くのも2分ごとでよい。 */
    if (boardTimer) { clearInterval(boardTimer); }
    boardTimer = setInterval(pullBoard, 120000);
    /* 現況行の経過だけは毎秒。取得（15秒）とは別の時計で回す。 */
    if (sinceTimer) { clearInterval(sinceTimer); }
    sinceTimer = setInterval(tickSince, 1000);
    catTimer = setInterval(runCatTick, 100);   /* 猫のコマ送り（v103）。1コマ100ミリ秒 */
  }

  /* 本体の版を一度だけ取りに行く。取れなければ写しには「未確認」と出る。
     画面には出さない。写しの中だけで使う。 */
  /* 版が届いたら、その場で塗り直す（v33）。
     ＊版の取得は投げっぱなしで、塗るのは状態の取得（15秒おき）のときだけだった。
       そのため開いた直後は「公開 v未確認」のまま最大15秒あり、
       stable の枝は別の宿（raw.githubusercontent）なので、そちらが後から届くと取り残された。
       ＊塗る材料の at は、直近に読めた状態の時刻を使い回す。無ければ 0（＝横棒）。 */
  function reFacts() {
    try { paintFacts((lastState && lastState.at) || 0); } catch (e) {}
  }

  function pullVer() {
    fetch(VER_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { honVer = String(t || '').trim().replace(/[^0-9]/g, ''); reFacts(); })
      .catch(function () { honVer = ''; reFacts(); });
    /* stable の枝の ver.txt が、検収の済んだ版。タグを動かすとこちらも動く。 */
    fetch(STB_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { stbVer = String(t || '').trim().replace(/[^0-9]/g, ''); reFacts(); })
      .catch(function () { stbVer = ''; reFacts(); });
  }

  /* 15秒ごとに、知らせの一覧と状態の両方を取りに行く。 */
  /* ＊「ここまで読んだ」も毎回見に行く（v34）。こちらで書き換えた直後に、
       パネルを開き直さなくても札が片付くようにするため。中身は二つの数だけで軽い。 */
  function tick() { pull(); pullState(); pullSeen(); pullNtfyLatest(); }

  /* 題の種類で色を分ける。絵文字で頭が揃っているので、そこを見る。
       🙋 ヨシしてください   … 黄（返事が要る）
       📥 返事を受けました    … 灰（受け取りの控え。何もしなくてよい）
       👍 ヨシを受けました    … 灰（同上）
       ✅ 終わりました        … 緑
       👀 異常です（待てば戻ります）… 青
       🪟 異常です（手が要ります）  … 赤 */
  function kind(t) {
    t = String(t || '');
    if (t.indexOf('🙋') >= 0) { return 'ask'; }
    if (t.indexOf('📥') >= 0 || t.indexOf('👍') >= 0) { return ''; }
    if (t.indexOf('🔎') >= 0) { return 'wait'; }   /* 調べた。青。手は入れていない */
    if (t.indexOf('✅') >= 0) { return 'done'; }
    if (t.indexOf('👀') >= 0) { return 'wait'; }
    if (t.indexOf('🪟') >= 0) { return 'act'; }
    if (t.indexOf('📮') >= 0) { return 'act'; }   /* 郵便受けが詰まった（v74）。手が要るので act と同じ扱い */
    /* 絵文字の無い古い知らせも読めるようにしておく */
    if (t.indexOf('ヨシしてください') >= 0 || t.indexOf('返事してください') === 0) { return 'ask'; }
    if (t.indexOf('受けました') >= 0) { return ''; }
    if (t.indexOf('終わりました') === 0) { return 'done'; }
    if (t.indexOf('待てば戻ります') >= 0) { return 'wait'; }
    if (t.indexOf('手が要ります') >= 0) { return 'act'; }
    if (t.indexOf('異常です') === 0) { return 'act'; }
    return '';
  }

  function hhmm(sec) {
    try {
      var d = new Date(sec * 1000);
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return ''; }
  }

  /* ntfy の poll は一行に一件の JSON（JSON の配列ではない）。行ごとに解く。 */
  /* 一覧が0件のときは、白紙にせず理由を出す。 */
  function sayWhy(msg) {
    /* ＊出し先は **#board**（v97）。#list は画面から消したので、そこへ入れると
         「一覧を読めません」が**誰にも見えないまま**消える。
         「無い」と「読めない」を混ぜないための文言なので、見える器へ出す。 */
    $('board').innerHTML = '<li class="why"><p class="m">' + esc(msg) + '</p></li>';
  }

  function pull() {
    /* ＊「送る側」の話題名は、もう一覧には要らない（v10）。
       押し通知を iPhone で受けるために ntfy の側で購読する名前として残してあるだけ。 */
    /* 一覧は notices.json から読む（v10）。ntfy へ出るのは異常のときだけになったので、
       話題を読んでも異常しか並ばない。読み物はリポジトリ経由に一本化した。
       中身は status.md と同じ二十件で、書いているのは notify-record.ps1。 */
    fetch(NOTICES_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      })
      .then(function (arr) {
        /* 配列でなければ「読めません」へ落とす（v31）。
           以前は空配列と同じ扱いにしていたので、控えに20件積まれていても
           画面は「まだ知らせがありません」になった（2026-08-25 実測）。
           **空の一覧**と**壊れた一覧**は別物で、混ぜると気づけない。 */
        if (!Array.isArray(arr)) { throw new Error('形が違います（一覧が配列ではありません）'); }
        var rows = arr.slice();
        rows.sort(function (a, b) { return (b.time || 0) - (a.time || 0); });
        /* 控えに無くなった件の印は捨てる。端末の中に溜め続けない。
           ＊これは「写した札を落とす」より**前**に行う。あとで行うと、落としたばかりの
             札を「控えに無い」と判じて印まで消し、次の取得でまた出てくる。 */
        var live = {}, changed = false;
        rows.forEach(function (d) { live[keyOf(d)] = 1; });
        Object.keys(copied).forEach(function (k) { if (!live[k]) { delete copied[k]; changed = true; } });
        if (changed) { saveCopied(); }

        /* 写した札は一覧から落とす（v24）。押していない札は、何件あっても全部残す。
           ＊localStorage に残っている印も、ここで効く。開き直しても写した札は出ない。 */
        /* 落とす前の全件を控える。写した札の控え（下の畳んだ箱）がここから作られる。 */
        allRows = rows.slice();
        rows = rows.filter(function (d) { return !isCopied(d); });   /* v104：写した印だけで落とす。seenUpto では落とさない */
        shown = rows;
        setCopyAllLabel();   /* 釦の字を件数つきに（v38）。落としたあとの数で組む */
        setCopyBoardLabel(); /* まとめて写すの側も同じ数で組む（v52） */
        paintDoneBox(allRows);   /* 「終わりました」の箱（v47）。写した写さないに関わらず全部 */
        paintCopied(allRows);

        /* ＊「◯件ぜんぶ片付いています」の枠と「片付いた札を出す」の釦は **v43 で外した**。
             ＊もともとは「控えには届いているのに『ありません』と出ると壊れて見える」ため
               置いたものだが、片付いている日は毎回この枠が居座って、
               **空であることのほうが読み取りにくくなっていた**。
             ＊出し直したいときは、下の畳んだ箱（写した札の控え）を開けば全件そのまま読める。
               控え（notices.json）には最初から触っていないので、失われるものは無い。
           ＊**v44 で、その跡地に三つ出すことにした**——台帳の残り／今日の押し送り／控えの最終実行。
             未処理が無い日にこそ読みたいのは「知らせがない」ことではなく、
             **仕組みが動いているか**だから。中身は `board.json`（下の pullBoard）。
           ＊**読めなかったとき**の断りは今までどおり出す（下の catch）。
             「無い」と「読めない」は別物なので、そちらは黙らせない。 */

        var html = '';
        rows.forEach(function (d, i) {
          var k = kind(d.title);
          /* 受け取り確認（📥／👍）は畳む。題の行を押せば開く。 */
          var ack = isAck(d.title);
          /* ⑧そのままを持つ件は畳んでおく。長いので開いたままだと一覧が読めない。
             題の行を押せば開く（畳んだ件と同じ受け）。 */
          var hasRaw = /^そのまま[:：]/m.test(String(d.message || ''));
          /* 「終わりました（返事不要）」も畳む（v48）。
             ＊本文を最初から全部出すと、報告が長い日は一覧が読めなくなる。
               **表紙の一行（題と時刻）だけを出し、押したときに本文が開く。**
             ＊畳んだ状態が初期値。写す釦は題の行にあるので、畳んだままでも押せる。 */
          var isDoneCard = isDoneNotice(d.title);
          /* 「調べました」も畳む（v53）。畳む理由は終わりましたと同じで、
             調べ物の報告は長くなりやすく、開いたままだと一覧が読めなくなる。
             ＊表紙は題と時刻と写す釦の一行だけ。押せば本文が**全文**開く（どこも切らない）。
             ＊開閉は openKeys に載るので、15秒の読み直しでも開いたまま保たれる（v47）。 */
          var isLookCard = isLookNotice(d.title);
          /* 「🕘 定時の報せ」も畳む（v55）。畳む理由は調べました・終わりましたと同じ。
             ＊表紙は題と時刻と写す釦の一行だけ。押せば本文が**全文**開く（どこも切らない）。
             ＊開閉は openKeys に載るので、15秒の読み直しでも開いたまま保たれる（v47）。 */
          var isDailyCard = isDailyNotice(d.title);
          /* 写した札はここへ来ない（上で落としてある）。 */
          var fold = (ack || hasRaw || isDoneCard || isLookCard || isDailyCard);
          var cls = k + (fold ? ' ack' : '');
          /* 開いてあった件は、開いた形で組み直す（v47）。 */
          if (fold && isOpen(keyOf(d))) { cls = cls + ' open'; }
          html += '<li class="' + cls.trim() + '" data-i="' + i + '" data-k="' + okey(keyOf(d)) + '">'
                + '<p class="t"><span class="tx">' + esc(d.title || '(題なし)')
                + '<span class="when">' + hhmm(d.time) + '</span></span>'
                + '<button type="button" class="cp" data-i="' + i + '">写す</button></p>'
                + (fold ? '<p class="sj">' + esc(headOf(d)) + '</p>' : '')
                + '<p class="m">' + esc(d.message) + '</p></li>';
        });
        /* 未処理が無ければ、跡地に板の三つを出す（v44）。札があるときは今までどおり札だけ。 */
        $('list').innerHTML = html;   /* 器は残す（画面には出さない・v97） */
        paintBoard();                  /* 板はいつでも塗る（v97） */
        paintStateLine();              /* 状態の一行も塗り直す（v97） */
        paintBar();
      })
      .catch(function (e) {
        /* 取得に失敗したことと、その理由を必ず画面に出す。白紙にしない。 */
        sayWhy('一覧を読めません（' + e.message + '）。'
             + 'notices.json が公開ページに無いか、通信が届いていません。');
        paintBar();
      });
  }

  /* 畳んだ札の表紙に添える件名（v75）。本文の一行目＝控えの「件名:」がそのまま来る。
     ＊題（「✅ 終わりました（返事不要）」など）は種別しか語らないので、
       畳んだ札が並ぶとどれが何の件か分からない。一行目を添えて見分けられるようにする。 */
  function headOf(d) {
    var NL = String.fromCharCode(10);
    var L = String((d && d.message) || '').split(NL);
    for (var i = 0; i < L.length; i++) {
      var t = L[i].replace(/^\s+|\s+$/g, '');
      if (t) { return t; }
    }
    return '';
  }

  /* 受け取り確認かどうか。ここだけ一覧で畳む。 */
  function isAck(t) {
    t = String(t || '');
    return (t.indexOf('📥') >= 0 || t.indexOf('👍') >= 0 || t.indexOf('受けました') >= 0);
  }

  /* 一覧の上の行。出すのは最後に取りに行った時刻だけ。
     ＊「未処理◯件」は撤去した（v16）。数えていたのは受信箱（inbox.txt）の未処理で、
       その受信箱に書く者はパネルからの送信だけだった。v11 でその送信を撤去したので、
       いまは構造上いつも0にしかならない（最後に増えたのは 17:28:33）。
       数える先の無い表示は誤解を生むので、行ごと落とした。 */
  /* 版の並びと生存の時刻。どちらもずれ／古さが分かるように色を変える。 */
  var SEEN_WARN_SEC = 300;   /* 生存がこれより古ければ、止まっている恐れ */
  function paintFacts(atSec) {
    var v = $('fVer'), s = $('fSeen');
    if (!v || !s) { return; }
    var hv = honVer || '未確認', sv = stbVer || '未確認';
    /* 右の数は stable の枝の ver.txt（STB_URL）。v76 まで「公開v」と呼んでいたが、
       公開しているのは main（VER_URL＝左の数）なので、名と中身が食い違っていた。
       v77 で「stable v」へ改めた。下の nowLine() も同じ名にしてある。 */
    v.textContent = '本体 v' + hv + ' ／ stable v' + sv;
    /* 二つがずれている＝検収の済んだ版（stable）が本体より遅れている。 */
    v.className = (honVer && stbVer && honVer !== stbVer) ? 'warn' : '';
    var age = atSec ? Math.floor(Date.now() / 1000 - atSec) : -1;
    s.textContent = '最終確認 ' + (atSec ? hhmm(atSec) : '—');
    s.className = (age < 0 || age > SEEN_WARN_SEC) ? 'warn' : '';
  }

  function paintBar() {
    $('stat').textContent = hhmm(Math.floor(Date.now() / 1000)) + ' 更新';
  }

  /* 写しの中身は、相談役のクロードへ貼るためのもの（v9）。
     相談役はこの機械の中が一切見えないので、貼られた文だけで状況を判断する。
     したがって六行を決まった順で書き、確かめていないことは「未確認」と明記する。

       状態:      作業中／ヨシ待ち／終わり／異常 のどれか
       したこと:  二文以内
       版:        本体とstableの両方
       ファイル:  触ったファイル名と、変えた行の位置
       実測:      時刻・数値・PASS/FAIL をそのまま
       未決:      無ければ「未決なし」

     絵文字と飾りの記号、行頭の時刻の見出し、「返事不要」などの案内文は入れない。
     ただし実測の中の時刻は残す（数値だからで、見出しではない）。 */

  /* 題から状態の一語を取り出す。絵文字は落とす。 */
  function stateWord(title) {
    var t = String(title || '');
    if (t.indexOf('ヨシしてください') >= 0 || t.indexOf('返事してください') >= 0) { return 'ヨシ待ち'; }
    /* 調べた＝手を入れていないが、訊かれたことの答えが出た状態（v22 で足した五つ目）。
       「終わりました」より先に見ること。どちらも「〜ました」で終わるため。 */
    if (t.indexOf('調べました') >= 0 || t.indexOf('調べた') >= 0) { return '調べた'; }
    if (t.indexOf('終わりました') >= 0) { return '終わり'; }
    if (t.indexOf('異常') >= 0) { return '異常'; }
    /* ＊「未確認」は返さない。状態は五つだけと決めてある。
         題から読み取れないもの（試しの一本など）は、確かめの最中とみなして「作業中」。 */
    return '作業中';
  }

  /* 絵文字と飾りの記号だけを落とす。
     ＊矢印（U+2190〜U+21FF）は落とさない。「パネル→受信箱→この窓」のように
       向きを表す意味があり、消すと文が壊れる（v9 の実測で実際に壊れた）。
     ＊鉤括弧も落とさない。引用の範囲が分からなくなる。 */
  function plain(s) {
    return String(s || '')
      .replace(/[\u{1F000}-\u{1FAFF}]/gu, '')       /* 絵文字の本体 */
      .replace(/[\u{2600}-\u{27BF}]/gu, '')         /* ✅ ★ などの記号と絵記号 */
      .replace(/[\u{2B00}-\u{2BFF}]/gu, '')         /* 飾りの図形 */
      .replace(/[\u{FE00}-\u{FE0F}\u{200D}]/gu, '') /* 異体字選択子とゼロ幅接合子 */
      .replace(/[■□◆◇▲△▼▽◎]/g, '')                /* 飾りの図形（続き） */
      .replace(/^[・\-*\s]+/, '')
      /* ＊改行も潰す。潰さないと「したこと」が二行になり、写しが七行を超える
         （2026-08-23 実測：本文が二行の件で八行になった）。写しは必ず七行。 */
      .replace(/\s+/g, ' ')
      .trim();
  }

  /* 二文までに切る。句点で数える。 */
  function twoSentences(s) {
    var t = String(s || '').trim();
    if (!t) { return ''; }
    var parts = t.split('。').filter(function (x) { return x.trim(); });
    if (parts.length <= 2) { return t; }
    return parts.slice(0, 2).join('。') + '。';
  }

  /* 本文に「版:」「ファイル:」のような見出しの行があれば拾う。無ければ空。 */
  function pick(body, names) {
    var lines = String(body || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i].trim();
      for (var j = 0; j < names.length; j++) {
        var re = new RegExp('^' + names[j] + '[:：]\\s*(.+)$');
        var m = ln.match(re);
        if (m) { return plain(m[1]); }
      }
    }
    return '';
  }

  /* 本文からファイル名を拾う。「名前.拡張子」と、すぐ後ろに続く行の位置まで。
     ＊見出しの「ファイル:」が本文にあればそちらが優先。ここは無いときの拾い方。 */
  function findFiles(body) {
    /* ＊長い拡張子を先に並べること。js を json より前に置くと、
         state.json が state.js で切れる（2026-08-23 実測）。 */
    var re = /[A-Za-z0-9_.\-]+\.(?:jsonl|json|html|ps1|tsv|txt|png|md|js)(?::[\d,\-]+行?)?/g;
    var seen = {}, out = [];
    var m;
    while ((m = re.exec(String(body || ''))) !== null) {
      var t = m[0];
      if (!seen[t]) { seen[t] = 1; out.push(t); }
    }
    return out.join(' / ');
  }

  /* 実測らしい言い回し。時刻・数値・PASS/FAIL・「実測」「とも正」など。 */
  var MEAS = /(PASS|FAIL|実測|確かめ|とも正|通りとも|\d{1,2}:\d{2}|HTTP=?\d|\d+\s*(?:件|本|回|px|バイト|通り))/;

  /* 本文を「したこと」と「実測」に振り分ける。
     ＊括弧の中に実測が入ることが多い（「（932で起こしても UTF-8 で出ることを実測）」）。
       先に括弧を取り出して判じ、実測なら本文から抜く。残りを句点で切って同じ判じにかける。 */
  function splitFacts(body) {
    var text = String(body || '');
    var meas = [];
    text = text.replace(/[（(]([^（）()]{4,})[）)]/g, function (whole, inner) {
      if (MEAS.test(inner)) { meas.push(inner.trim()); return ''; }
      return whole;
    });
    var did = [];
    text.split('\n').forEach(function (ln) {
      ln.split('。').forEach(function (s) {
        s = s.trim();
        if (!s) { return; }
        if (MEAS.test(s)) { meas.push(s); } else { did.push(s); }
      });
    });
    return { did: did.join('。') + (did.length ? '。' : ''), meas: meas.join(' ／ ') };
  }

  /* 六行を組む。 */
  function sixLines(d) {
    var body = String(d.message || '');
    /* ⑧そのままから下は、③したことにも⑥実測にも回さない。
       ＊⑧は見出しの無い行が並ぶので、切らずに渡すと⑧の中身が③へ流れ込む
         （2026-08-24 実測：「■ 一段目 - 字下げを残す行」が したこと に出た）。
       ＊見出しの拾い（pick）も head だけを見る。⑧の中に「実測:」のような行が
         あっても、それは貼った本文の一部で、この件の見出しではない。 */
    var rawIdx = body.search(/^そのまま[:：]/m);
    var head = (rawIdx >= 0) ? body.slice(0, rawIdx) : body;
    var lines = head.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);

    /* 見出しの付いた行は「したこと」から外す。件名（一行目）も外す。 */
    var LABEL = /^(版|ファイル|実測|未決|待ち|完了|件名|状態|したこと|食い違い|答え|そのまま|種類|実機|未検収)[:：]/;
    var rest = lines.slice(1).filter(function (x) { return !LABEL.test(x); }).join('\n');
    if (!rest) { rest = lines[0] || ''; }

    /* 見出しの「実測:」が本文にあるなら、振り分けはしない。残り全部が「したこと」。
       ＊振り分けを掛けると、数値を含む一文まで実測へ回り、「したこと」が空になる
         （2026-08-23 実測：「一覧も控えの実体も最新5件に揃えた」が5件で実測扱いになり未確認に落ちた）。
       見出しが無い古い知らせだけ、本文から実測を拾い分ける。 */
    var hasMeasLabel = pick(head, ['実測', '確かめ方', '結果']);
    var f = hasMeasLabel ? { did: rest, meas: '' } : splitFacts(rest);
    var did = twoSentences(plain(f.did));
    if (!did) { did = twoSentences(plain(rest)); }   /* 全部が実測に見えたときの落ち */

    var ver = pick(head, ['版', 'バージョン']);
    if (!ver) {
      /* 版は公開ページの ver.txt から取る。main の分が本体、stable の枝の分が stable。
         取れなかった側だけ「未確認」と書く。
         ＊panel の版も並べる。三つのうち panel だけは取りに行かず、この写し自身が
           持っている値（PANEL_VER）をそのまま書く。読んでいる写しの版そのものなので、
           取り違えようがない（2026-08-24 のご指摘：panel が落ちている回があった）。 */
      var a = honVer ? ('本体v' + honVer) : '本体 未確認';
      var b = stbVer ? ('stable v' + stbVer) : 'stable 未確認';
      ver = a + ' ／ ' + b + ' ／ panel v' + PANEL_VER;
    }
    /* 見出しがあればそれを使う。無ければ本文から拾ったものを使う。 */
    var files = pick(head, ['ファイル', '触ったファイル']);
    if (!files) { files = findFiles(rest); }
    var meas  = pick(head, ['実測', '確かめ方', '結果']);
    if (!meas) { meas = plain(f.meas); }
    /* ⑦は三つに書き分ける。空なら「なし」。
       食い違い＝受けた指示のうち、そのままでは成立しない点と、どう読み替えたか
       答え＝指示の中で訊かれたことへの答え（③したことには書かない）
       未決＝判断待ちの項目 */
    var gap   = pick(head, ['食い違い']);
    var ans   = pick(head, ['答え']);
    var open  = pick(head, ['未決', '待ち']);
    /* 実機で見るところ＝画面に出るものを直した回に、どの画面のどこがどう変わっていれば
       合格かを一行で（作法24）。直していない回は控えに欄が無いので、ここも出ない。
       未検収＝ヨシがまだ出ていない件。日時と件名で並べる。 */
    var jikki = pick(head, ['実機', '実機で見るところ']);
    var pend  = pick(head, ['未検収']);

    /* ⑧そのまま＝要約せずに貼る欄。字数の上限なし。
       ＊ここだけは plain も twoSentences も通さない。改行も原文のまま残す。
         迷ったら削らずここへ貼る、という決めなので、削る処理を一切かけない。 */
    var raw = '';
    if (rawIdx >= 0) { raw = body.slice(rawIdx).replace(/^そのまま[:：]\s*/, '').trim(); }

    /* 「調べた」の回だけ、⑥実測を一項目一行の箇条書きにする。
       ＊調べた結果はファイル名・行番号・パスの並びで、一行に詰めると読めない。
         表にもしない（画面から切れて写しが撮り直しになる）。省略記号でも切らない。
       ＊控えの側は一行に収める決まりなので、「 ／ 」で区切って書き、ここで行に開く。 */
    var st = stateWord(d.title);
    if (st === '調べた' && meas) {
      meas = '\n' + meas.split(/\s*／\s*/).filter(Boolean).map(function (x) { return '- ' + x; }).join('\n');
    }

    /* 欄の組み立て。**中身の無い欄は行ごと出さない**（2026-08-24 の決め）。
       ＊以前は「未確認」「なし」で埋めていた。その便が持たない欄まで毎回並ぶので、
         一覧が空欄の行で埋まって読めなくなる。書けないなら出さない。
       ＊必ず出るのは一行目（いつの何の件か）と「状態」の二つだけ。 */
    /* 「なし」「無し」「未確認」だけが書かれた欄は、中身が無いのと同じ扱いにする。
       ＊控えの側で「待ち: なし」と書く決めにしたので、そのまま出すと「未決: なし」が
         毎回並ぶ。書いてある語ではなく、中身があるかで出し分ける。 */
    function has(v) {
      var s = String(v || '').trim();
      if (!s) { return ''; }
      if (/^(なし|無し|ない|無い|未確認|不明|-|—|―)$/.test(s)) { return ''; }
      return s;
    }
    did = has(did); files = has(files); meas = has(meas); jikki = has(jikki);
    gap = has(gap); ans = has(ans); open = has(open); pend = has(pend);

    var out = [];
    /* 一行目は「いつの何の件か」。一件でも一括でも同じ形にする。
       件名は本文の一行目。**題は使わない**——題の中身（終わりました／異常です など）は
       次の行の「状態」と同じことを言うので、写しに二度書くことになる
       （2026-08-23 実測：件名の無い件で「終わりました（返事不要）」が一行目に出た）。 */
    out.push('[' + hhmm(d.time) + '] ' + (plain(lines[0] || '') || '（件名なし）'));
    out.push('状態: ' + st);
    if (did)   { out.push('したこと: ' + did); }
    if (ver)   { out.push('版: ' + ver); }
    if (files) { out.push('ファイル: ' + files); }
    if (meas)  { out.push('実測: ' + meas); }
    if (jikki) { out.push('実機で見るところ: ' + jikki); }
    if (gap)   { out.push('食い違い: ' + gap); }
    if (ans)   { out.push('答え: ' + ans); }
    if (open)  { out.push('未決: ' + open); }
    if (pend)  { out.push('未検収: ' + pend); }
    /* ⑧は最後。要約せず原文のまま。四つの該当（成立しなかった箇所と理由／訊かれたことへの答え／
       調べて出たファイル名・行番号・パスの一覧／判断の根拠にしたコマンドの出力）が
       あれば必ず全文が入る。無ければ欄ごと出さない。 */
    if (raw)   { out.push('そのまま: ' + raw); }
    return out.join('\n');
  }

  /* いまの現況を一行に。上部に出しているのと同じ値をそのまま使う。
     ＊「全部写す」の末尾だけに付ける。一件ずつの写しには付けない。 */
  function nowLine() {
    var a = [];
    a.push('現況：' + (lastState.word || '—') + (lastState.since ? '・' + lastState.since : ''));
    a.push('本体v' + (honVer || '未確認'));
    /* stable の枝の ver.txt。v77 で「公開v」から名を改めた（上の paintFacts と同じ理由）。 */
    a.push('stable v' + (stbVer || '未確認'));
    a.push('最終確認' + (lastState.at ? hhmm(lastState.at) : '—'));
    return a.join(' ／ ');
  }

  /* 「全部写す」の釦の字（v38）。写す対象の件数を添える。
     ＊Nの数え方は**一覧に出している札と同じ**（`shown`）。写した札は一覧から落ちる作りなので、
       画面に見えている枚数と釦の数が食い違わない。別の数え方を持ち込まないこと。
     ＊0件のときは**押せなくし**、「写す物なし」と出す。押しても何も起きない釦を
       押せる顔で置いておくと、写し損ねたのか写す物が無いのかが見分けられない。
     ＊写した直後の「N件 写した」から戻すときも、この関数を通す。固定の字に戻すと
       件数が消えたまま残る。 */
  function setCopyAllLabel() {
    var b = $('btnCopyAll');
    if (!b) { return; }
    var n = shown.length;
    if (n === 0) {
      /* 0件のときは**行ごと出さない**（v51）。
         ＊v38 から v50 までは「写す物なし」の灰色の帯を残していたが、
           押せない帯が常に居座るぶん、読む場所が一つ増えるだけだった。
         ＊字と押せない印はそのまま残す。出し直したときに元の姿へ戻る。 */
      b.textContent = '写す物なし';
      b.disabled = true;
      b.className = 'cpall';
      b.hidden = true;
    } else {
      b.textContent = 'お知らせ（' + n + '件）';   /* v48：字だけ変えた。数え方も動きもそのまま */
      b.disabled = false;
      b.className = 'cpall';
      b.hidden = false;
    }
  }

  /* 写していない件を、古い順にまとめて一本の文にする。 */
  function copyAllText() {
    var todo = shown.filter(function (d) { return !isDone(d); });
    todo.sort(function (a, b) { return (a.time || 0) - (b.time || 0); });   /* 古い順。上から読めば時系列 */
    if (!todo.length) { return null; }
    var parts = todo.map(function (d) { return sixLines(d); });
    parts.push(nowLine());
    return { text: parts.join('\n\n'), items: todo };
  }

  function copyAll(btn) {
    var r = copyAllText();
    if (!r) {
      btn.textContent = '未写しなし';
      setTimeout(setCopyAllLabel, 2000);   /* v38：件数つきの字へ戻す */
      return;
    }
    var done = function () {
      /* 写した刻（秒）を控える。あとで「届いた」を判じる物差しになる（v32）。
         ＊v31 以前は 1 を入れていた。その古い印は刻が無いので、印を付けない側へ倒れる。 */
      var nowSec = Math.floor(Date.now() / 1000);
      r.items.forEach(function (d) { copied[keyOf(d)] = nowSec; });
      saveCopied();
      btn.textContent = r.items.length + '件 写した';
      btn.className = 'cpall ok';
      pull();   /* 写した件は一覧から消える（v24） */
      setTimeout(setCopyAllLabel, 2000);   /* v38：件数つきの字へ戻す（className もここで直る） */
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r.text).then(done, function () { fallback(r.text); done(); });
    } else {
      fallback(r.text); done();
    }
  }

  /* 下の箱に収まった札の写す釦（v67）。
     ＊写る中身も釦の見え方も、上の一覧の写す釦（copyOne）と同じ。
     ＊違うのは**札を動かさない**ところだけ。ここに居る札はもう片付いた札なので、
       印を付け直す相手も、落とす先も無い。箱に収まったまま置く。
     ＊どの札かは、箱を組んだときに控えた並び（doneItems／copiedItems）から引く。 */
  var doneItems = [], copiedItems = [];
  /* 写しの一行目には、必ず notices.json の道を置く（v79）。
     ＊まとめて写しは前から入れていたが、個別の「写す」には入っていなかった。
       受け取る側は写された文だけを見るので、どの札の写しにも読み元を添える。
     ＊「URLを写す」の釦（#btnCopyUrl・L319）はそのまま残す。あちらは道だけを渡す口。 */
  function withPage(t) { return NOTICES_PAGE + String.fromCharCode(10) + String(t); }
  function copyBoxed(items, i, btn) {
    var d = (items || [])[i];
    if (!d) { return; }
    /* 写すのは**本文の全文**。上の一覧の写す釦（copyOne）は七行にまとめた形を渡すが、
       こちらは「本文が全文で写る」ことを求められている箱なので、
       題と時刻の一行を頭に付けたうえで、本文をそのまま渡す（どこも切らない）。 */
    var NL = String.fromCharCode(10);
    var text = '［' + (d.title || '(題なし)') + '］' + hhmm(d.time) + NL + String(d.message || '');
    copyInto(btn, withPage(text), '写す');
  }

  function copyOne(i, btn) {
    var d = shown[i];
    if (!d) { return; }
    var text = withPage(sixLines(d));   /* 一行目に notices.json の道（v79） */
    var done = function () {
      /* 写した印を端末の中に残す。開き直しても消えない。 */
      copied[keyOf(d)] = Math.floor(Date.now() / 1000);   /* 写した刻。届いた印の物差し（v32） */
      saveCopied();
      /* 押した直後に下の箱も組み直す（v50）。
         ＊これが無いと、箱へ現れるのは次の取得（15秒後）になる。上からは同じ瞬間に
           消えているので、そのあいだ**札がどこにも無いように見える**。
         ＊終わりました（返事不要）は「終わりました N件」の箱、
           調べました・その他は「写した札 N件」の箱。振り分けは箱の側が持つ。 */
      paintDoneBox(allRows);
      paintCopied(allRows);
      /* 写した札は、押した時点で一覧から消す（v24）。薄く残さない。
         ＊次の取得を待たずにその場で消す。待つと、押したのに残って見える。 */
      var li = btn.parentNode && btn.parentNode.parentNode;
      if (li && li.tagName === 'LI' && li.parentNode) { li.parentNode.removeChild(li); }
      /* 最後の一枚を写して空になったら、その場で板の三つへ入れ替える（v44）。
         ＊次の取得を待たない。待つと、写し終えた直後だけ真っ白になる。 */
      shown = shown.filter(function (x) { return x !== d; });
      /* 二つの釦の件数も、その場で組み直す（v52）。
         ＊しないと、次の取得（15秒後）まで古い数字が残る。件数つきの字にした以上、
           **数字が実際と食い違って見える時間**を作らない。 */
      setCopyAllLabel();
      setCopyBoardLabel();
      paintBoard();
    };
    /* 写せなかったとき。**成功に見せない**——done は通さない。
       ＊v20 で「落ちたのか分からない」を直そうとして done を通したが、それだと
         写せていないのに「写した」と出て、失敗が成功に見える（2026-08-23 のご指摘）。
       ＊印も付けない。付けると一覧から畳まれ、写せていない件が片付いたように見える。
       ＊手で写す逃げ道（選択済みの箱）は出す。字は3秒で元へ戻す。 */
    var failed = function () {
      fallback(text);
      btn.textContent = '写せません';
      btn.className = 'cp ng';
      /* 写せなかった札は一覧に残る（消すのは写せたときだけ）。字を戻す。 */
      setTimeout(function () {
        btn.textContent = '写す';
        btn.className = 'cp';
      }, 3000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      /* ＊writeText はその場で例外を投げることもある。then だけでは拾えない。 */
      try { navigator.clipboard.writeText(text).then(done, failed); }
      catch (e) { failed(); }
    } else {
      failed();
    }
  }

  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.className = 'copybox';
    ta.value = text;
    document.body.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(0, ta.value.length);
    var close = function () {
      if (ta.parentNode) { ta.parentNode.removeChild(ta); }
      document.removeEventListener('touchstart', close, true);
      document.removeEventListener('mousedown', close, true);
    };
    setTimeout(function () {
      document.addEventListener('touchstart', close, true);
      document.addEventListener('mousedown', close, true);
    }, 0);
  }

  /* いまの状態を一行で出す。
     作業中＝青／ヨシ待ち＝黄／手待ち＝灰。最後の更新から3分を超えたら赤で「連絡なし」。 */
  /* ＊右端の「N分前」は **v73 で消した**。器も飾りも引数も落としてある。
       ＊経過は二段目の「開始HH:MM・終了予定…・経過N分」が持っているので、二重に出ていた。 */
  /* ＊三段目は郵便受けの読み残し（v74）。**0件のときは行ごと畳む**ので、
       普段はこれまでどおり二段のまま。詰まったときだけ一行増える。 */
  function paintState(cls, word, subj, mik, mail, ord) {
    $('state').className = 'state ' + cls;
    $('stWord').textContent = word;
    $('stSubj').textContent = subj;
    /* 見込みは二段目。無いときは畳んで、今までどおりの一行に戻す。 */
    $('stMik').textContent = mik || '';
    $('stMik').className = mik ? 'k' : 'k hide';

          var ends = endSec ? pad2(endSec) : ' 未定';
          /* 釦の字にも同じ刻を出す（v80）。いちばん遅い候補だけを残す。 */
          lastEndAt = 0; noteEnd(endSec);
          mik = '開始' + hm
              + '・終了予定' + ends
              + '・経過' + min + '分';
        }

        /* 最後に指示を受けた刻（v79）。作業中のときだけ出す。
           ＊読む元は state.json の orderAt。形は "YYYY-MM-DD HH:MM:SS" の字。
             刻が読めない回は行ごと出さない（「—」で埋めない）。
           ＊指示を受けていない状態＝作業中の札が無いときは、そもそもここへ来ない。 */
        if (w !== '作業中') { lastEndAt = 0; }
        setCopyBoardLabel();   /* 刻が変わった／作業中でなくなった回に、釦の字も合わせ直す（v80） */
        var ord = '';
        if (w === '作業中') {
          var om = String(d.orderAt || '').match(/(\d{1,2}):(\d{2})/);
          if (om) { ord = '指示を受けた ' + om[1] + ':' + om[2]; }
        }
        /* ---- 時間の刻は黄色の行が持つ（v98）----
           ＊v97 までは上の札の二段（`開始…・終了予定…・経過…` と `指示を受けた …`）に出していた。
             v90 で黄色の行にも終了予定を出したので、**同じ刻が二箇所**にあった。
             上の札は題だけにし、刻はまとめて黄色の行へ寄せる。
           ＊黄色の行が組むのに要る三つを、ここで控えておく。
             開始（HH:MM）／指示を受けた（HH:MM）／開始の epoch（経過を数え直すため）。
           ＊経過はここで固めない。黄色の行を塗るたびに数え直す（v98 も今までと同じで、
             15秒ごとの取得で進む）。 */
        lastStartHM = (w === '作業中' && d.startedAt) ? pad2s(d.startedAt) : '';
        lastOrderHM = '';
        if (w === '作業中') {
          var om2 = String(d.orderAt || '').match(/(\d{1,2}):(\d{2})/);
          if (om2) { lastOrderHM = om2[1] + ':' + om2[2]; }
        }

        /* 版と最終確認は、状態がどうであろうと**必ず**塗る（v33）。
           ＊v18 から、下の「連絡なし」の早戻りが paintFacts より前にあり、
             連絡なしの間だけ「版 —／最終確認 —」の初期値のまま残っていた（2026-08-25 実機で発覚）。
             いちばん知りたいのは、連絡が途切れたときの**最後に見えていた時刻**なので、
             ここが横棒になるのは筋が通らない。塗るのを先に済ませる。 */
        paintFacts(d.at || 0);
        /* ＊受け取った指示を塗る呼び出し（v61）は **v72 で外した**。画面にも写しにも出さないため。 */

        if (sec > STALE_SEC) {
          /* 連絡なしの間は数えない。数えると、毎秒の書き換えが「連絡なし」を上書きしてしまう。 */
          sinceBase = { at: 0, word: '' };
          paintState('lost', '連絡なし', subj + '（最後は ' + w + '）', mik, d.mailUnread, ord);
          return;
        }
        var cls = 'idle';
        if (w.indexOf('作業中') === 0) { cls = 'run'; }
        else if (w.indexOf('ヨシ待ち') === 0) { cls = 'ask'; }
        else if (w.indexOf('手待ち') === 0) { cls = 'idle'; }
        /* 札の左の字（v93 まで三通りとも「状態・経過」だった。v94 で手待ちだけ替えた）。
             ・作業中   … 「作業中」。経過は見込みの段（開始・終了予定・経過）が持つ
             ・ヨシ待ち … 「ヨシ待ち・N分N秒」。待たせている長さが要るので経過を残す
             ・手待ち   … **「次の指示待ち」**。数字は出さない
           ＊手待ちは「何分待っているか」より「こちらの番だ」ということのほうが要る。
             経過を出すと、待たせている長さのように読めてしまう。
           ＊経過を出さない回は sinceBase を空にする。**空にしないと tickSince が
             毎秒この字を「手待ち・N分N秒」で上書きする。** */
        var word = w;
        /* ---- 作業中の札の左は「印」（v99）----
           ＊v98 までは左が「作業中」だった。状態は**下の黄色の行**が受け持っているので、
             札の左に状態の字を出すと同じことを二度言うことになる。
             左には**いま動いている枠の印**（例：パネルの整理-8）を出す。
           ＊右側は説明の分だけにする。印は左に一度だけ。
           ＊印が取れない件名のときは、左を空にして右側だけに出す（今までどおりの姿）。
           ＊次の指示待ち・ヨシ待ちの左の字は今のまま（下の枝が決める）。 */
        lastMark = '';
        if (w === '作業中') {
          var sp = splitSubj(subj);
          word = sp.mark || '';
          subj = sp.mark ? sp.rest : subj;
          lastMark = sp.mark || '';   /* 黄色の行の頭へ渡す（v102） */
        }
        /* 取得のたびに statAt を読み直して基準を合わせ直す。数え直しは tickSince が毎秒行う。 */
        if (w === '手待ち') {
          sinceBase = { at: 0, word: '' };
          word = '次の指示待ち';
        } else if (w === 'ヨシ待ち' && d.statAt) {
          sinceBase = { at: d.statAt, word: w };
          word = w + '・' + sinceText(Date.now() / 1000 - d.statAt);
        } else {
          sinceBase = { at: 0, word: '' };
        }
        lastState = { word: word, since: '', at: d.at || 0 };
        /* ＊上の札は**題だけ**にする（v98）。時間の二段（mik / ord）は黄色の行へ移した。
             同じ刻を二箇所に出さないため、ここでは空を渡す（渡す先で行ごと畳まれる）。
             ＊mik と ord の**組み立てそのものは残してある**——lastEndAt を決めるのに要り、
               まとめて写しの中でも使う。画面へ出す口だけを閉じた。 */
        paintState(cls, word, subj, '', d.mailUnread, '');
        /* 状態が変わったら、黄色の一行もその場で塗り直す（v97）。
           ＊お知らせの取得（pull）とは別の呼び出しなので、ここでも塗る。
             塗らないと、状態が変わってから次の pull までのあいだ古い字が残る。 */
        paintStateLine();
      })
      .catch(function (e) {
        sinceBase = { at: 0, word: '' };
        paintState('lost', '連絡なし', '状態を読めません（' + e.message + '）', '');
      });
  }

  /* ＊送る側の処理（post）は v11 で撤去した。Claude アプリの Code タブから直に指せる。
       戻したくなったら git の履歴（panel v10）から引く。印（tags の yoshi / shiji）で
       ヨシか指示かを分ける作りだったことも、そこに残っている。 */

  $('btnCopyAll').addEventListener('click', function () { copyAll(this); });
  $('btnCopyBoard').addEventListener('click', function () { copyBundle(this); });
  $('btnCopyUrl').addEventListener('click', function () { copyUrl(this); });

  /* 写す釦と、畳んだ件の開閉。一覧ごと張り替わるので親で受ける。
     ＊v97 で板を #board へ切り離したので、**両方に同じ受けを掛ける**。
       掛けないと、あなた待ち・直近に終わった仕事の「写す」釦と開閉が効かなくなる。 */
  ['list', 'board'].forEach(function (id) {
  $(id).addEventListener('click', function (e) {
    var b = e.target;
    /* あなた待ちの写す釦は id で先に分ける（v46）。名が cp で始まるので、
       下の受けに任せると data-i が無いまま copyOne へ落ちる。 */
    if (b && b.id === 'cpWait') { copyWait(b); return; }
    if (b && b.id === 'cpRecent') { copyRecent(b); return; }
    if (b && b.className && b.className.indexOf('cp') === 0) {
      copyOne(parseInt(b.getAttribute('data-i'), 10), b);
      return;
    }
    var li = b;
    while (li && li.tagName !== 'LI') { li = li.parentNode; }
    toggleOpen(li);   /* 開閉は一箇所で。開いた印を覚えるのもここ（v47） */
  });
  });

  /* 「終わりました」の箱。写す釦と開閉を、この一つの受けで分ける（開閉は v47・釦は v67）。 */
  $('doneList').addEventListener('click', function (e) {
    var b = e.target;
    if (b && b.className && b.className.indexOf('cp') === 0) {
      copyBoxed(doneItems, parseInt(b.getAttribute('data-i'), 10), b);
      return;
    }
    var li = b;
    while (li && li.tagName !== 'LI') { li = li.parentNode; }
    toggleOpen(li);
  });

  /* 済んだ札の箱も同じ形（開閉は v32・写す釦は v67）。 */
  $('copiedList').addEventListener('click', function (e) {
    var b = e.target;
    if (b && b.className && b.className.indexOf('cp') === 0) {
      copyBoxed(copiedItems, parseInt(b.getAttribute('data-i'), 10), b);
      return;
    }
    var li = b;
    while (li && li.tagName !== 'LI') { li = li.parentNode; }
    toggleOpen(li);   /* 開閉は一箇所で。開いた印を覚えるのもここ（v47） */
  });

  /* ＊「確認も見る」の切り替えと、ヨシ・入力欄・送るの受けは v11 で撤去した。
       受け取り確認（📥／👍）の知らせ自体が出なくなったので、切り替える相手がいない。
       畳んだ件を開く道は残してある（題の行を押す）。 */

  loadCopied();
  showMain();
})();
</script>
</body>
