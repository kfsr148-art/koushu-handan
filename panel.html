<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>返事パネル</title>
<!-- 宣言しておかないと /favicon.ico を勝手に取りに行って起動のたび404になる -->
<link rel="icon" href="data:,">
<!-- ホーム画面に置かれたときの絵。現場猫（本体の CAT_TILE_GENBA から焼いた 180x180）。
     透過のままだと iOS が黒地に置くので、パネルと同じ地の色で焼いてある。 -->
<link rel="apple-touch-icon" href="panel-icon.png">
<meta name="apple-mobile-web-app-title" content="返事パネル">
<meta name="theme-color" content="#14241c">
<style>
  /* 外部の読み込みは一切しない。字体も端末のものだけを使う。 */
  :root{
    --bg:#14241c; --card:#1d3328; --line:#2f4b3c; --fg:#f3ece0;
    --dim:rgba(243,236,224,0.65);
    --ask:#e8c14a; --done:#4caf7d; --wait:#4a9fe8; --act:#e05a4a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:18px; line-height:1.6;}
  body{padding:0 0 40px; max-width:520px; margin:0 auto;}

  header{position:sticky; top:0; z-index:10; background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 14px;}
  h1{font-size:19px; margin:0 0 10px; letter-spacing:.05em;}

  /* いまの状態の一行。ヨシの釦より上に置く。
     リモートデスクトップを開かずに、動いているか止まっているかを見るため。 */
  .state{display:flex; align-items:center; gap:8px; min-height:44px;
    border:1px solid var(--line); border-left-width:6px; border-radius:10px;
    padding:6px 10px; margin:0 0 10px; background:var(--card);}
  .state .w{font-size:18px; font-weight:700; flex:0 0 auto;}
  .state .c{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px;}
  /* 件名も見込みも切らない。入りきらなければ「…」で削らず、枠のほうを縦に伸ばす。
     一行箱（nowrap＋ellipsis）だと iPhone の幅では末尾から呑まれ、
     消えるのが見込みの側になる（実測：390px で 317px 要るのに、箱は 232px しかない）。 */
  .state .s{font-size:15px; color:var(--fg); min-width:0;
    white-space:normal; overflow-wrap:anywhere;}
  .state .k{font-size:13px; color:var(--dim); min-width:0;
    white-space:normal; overflow-wrap:anywhere;}
  .state .a{font-size:13px; color:var(--dim); flex:0 0 auto;}
  .state button{flex:0 0 auto; min-height:36px; padding:0 10px; font-size:13px;
    color:var(--dim); background:none; border:1px solid var(--line); border-radius:8px;}
  .state.run  {border-left-color:var(--wait);} .state.run  .w{color:var(--wait);}
  .state.ask  {border-left-color:var(--ask);}  .state.ask  .w{color:var(--ask);}
  .state.idle {border-left-color:var(--line);} .state.idle .w{color:var(--dim);}
  .state.lost {border-left-color:var(--act);}  .state.lost .w{color:var(--act);}

  /* 指で押す的は44px以上。ヨシは親指で外さない大きさにする。 */
  .yoshi{display:block; width:100%; min-height:76px; font-size:30px; font-weight:700;
    letter-spacing:.35em; text-indent:.35em; color:#14241c; background:var(--done);
    border:0; border-radius:12px; margin:0 0 10px;}
  .yoshi:active{filter:brightness(.85);}
  .row{display:flex; gap:8px;}
  .row input{flex:1 1 auto; min-width:0; min-height:52px; font-size:18px; padding:8px 12px;
    color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:10px;}
  .row button{flex:0 0 auto; min-width:92px; min-height:52px; font-size:18px; font-weight:700;
    color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:10px;}
  .row button:active{filter:brightness(1.4);}
  #say{margin-top:8px; font-size:15px; min-height:1.6em; color:var(--dim); word-break:break-all;}
  #say.ok{color:var(--done);}
  #say.ng{color:var(--act);}

  .bar{display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 14px; font-size:14px; color:var(--dim);}
  .bar button{flex:0 0 auto; font-size:14px; color:var(--dim); background:none;
    border:1px solid var(--line); border-radius:8px; min-height:44px; padding:0 12px;}
  .bar .sw{flex:0 0 auto; display:flex; align-items:center; gap:6px; min-height:44px;}
  .bar .sw input{width:22px; height:22px;}
  /* 「未処理◯件」の飾りは v16 で撤去。数える先（受信箱）に書く者がもう居ない。 */

  /* 常時出す事実の行。版の並びと生存の時刻。 */
  .facts{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:var(--dim);
    margin:0 0 4px;}
  .facts .warn{color:var(--ask); font-weight:700;}   /* 版がずれている／生存が古い */

  /* 全部写す。一覧のいちばん上。的は44px以上。 */
  .cpall{display:block; width:calc(100% - 28px); margin:4px 14px 12px; min-height:48px;
    font-size:16px; font-weight:700; color:var(--fg); background:var(--card);
    border:1px solid var(--line); border-radius:10px;}
  .cpall:active{filter:brightness(1.4);}
  .cpall.ok{color:var(--done); border-color:var(--done);}

  /* 版の印。画面のいちばん下に小さく。 */
  .ver{margin:18px 14px calc(8px + env(safe-area-inset-bottom));
    font-size:13px; color:var(--dim); text-align:center;}
  /* 一覧が0件のときの理由。白紙にしない。 */
  li.why{border-left-color:var(--ask);}
  li.why .m{color:var(--fg);}

  /* 受け取り確認と、写し終えた件は畳んでおく。題の行だけ出し、押すと本文が開く。 */
  li.ack .m{display:none;}
  li.ack.open .m{display:block;}
  li.ack{cursor:pointer;}
  /* 写し終えた件は薄くする。消しはしない——もう一度押せば、また写せる。 */
  li.copied{opacity:.45;}

  ul{list-style:none; margin:0; padding:0 14px;}
  li{background:var(--card); border-left:6px solid var(--line); border-radius:10px;
    margin:0 0 12px; padding:12px 14px;}
  li.ask{border-left-color:var(--ask);}
  li.done{border-left-color:var(--done);}
  li.wait{border-left-color:var(--wait);}
  li.act{border-left-color:var(--act);}
  /* 題の行は左に題と時刻、右に写す釦。釦は44px以上にする。 */
  .t{font-size:17px; font-weight:700; margin:0 0 4px;
    display:flex; align-items:flex-start; gap:8px;}
  .t .tx{flex:1 1 auto; min-width:0;}
  .cp{flex:0 0 auto; min-width:64px; min-height:44px; font-size:14px; font-weight:400;
    color:var(--dim); background:none; border:1px solid var(--line); border-radius:8px;}
  .cp:active{filter:brightness(1.5);}
  .cp.ok{color:var(--done); border-color:var(--done);}
  /* 写せなかったとき。成功の緑と紛れないよう赤にする。 */
  .cp.ng{color:var(--act); border-color:var(--act);}
  .copybox{position:fixed; left:14px; right:14px; bottom:14px; height:40vh; z-index:20;
    font-size:15px; color:var(--fg); background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:10px;}
  li.ask .t{color:var(--ask);}
  li.done .t{color:var(--done);}
  li.wait .t{color:var(--wait);}
  li.act .t{color:var(--act);}
  .when{font-size:13px; color:var(--dim); font-weight:400; margin-left:.6em;}
  .m{white-space:pre-wrap; word-break:break-word; font-size:17px; margin:0;}

  .hide{display:none;}
</style>
</head>
<body>

<!-- 話題名の設定画面は v17 で撤去した。一覧も状態も版も、話題名を使わずに読む。
     残しておくと罠になる——起動の判定が話題名の保存を必須にしていたので、
     新しい端末では設定画面から先へ進めなくなっていた。 -->

<div id="main" class="hide">
  <header>
    <h1>返事パネル</h1>
    <div class="state idle" id="state">
      <span class="w" id="stWord">…</span>
      <span class="c">
        <span class="s" id="stSubj">読み込み中</span>
        <span class="k hide" id="stMik"></span>
      </span>
      <span class="a" id="stAgo"></span>
    </div>
    <!-- 常時出す三つ。どれも既にリポジトリへ書いてある値の見せ方だけで、経路は増やしていない。
         版の並び＝ver.txt（本体）と stable の枝の ver.txt（公開）。
         最終確認＝state.json の at。生存の時刻そのもの。 -->
    <div class="facts">
      <span id="fVer">版 —</span>
      <span id="fSeen">最終確認 —</span>
    </div>
    <!-- 送る側の道具（ヨシの釦・入力欄・送る釦・言づて欄）は v11 で撤去した。
         Claude アプリの Code タブから直に指せるようになったので、パネルから送る必要がない。
         このパネルは「見る」ためだけの道具になった。 -->
  </header>
  <div class="bar">
    <span id="stat">読み込み中…</span>
    <!-- 「話題名を入れ直す」は v17 で撤去した。話題名を使う先がもう無い。 -->
  </div>
  <button class="cpall" id="btnCopyAll" type="button">全部写す</button>
  <ul id="list"></ul>
  <!-- 版の印。直すたびに数字を上げる。古い写しを見ていないかの目印。 -->
  <p class="ver" id="verTag">panel v23（8月24日）</p>
</div>

<script>
(function () {
  'use strict';
  var send = '', reply = '', timer = null;
  var shown = [];        // いま一覧に出している知らせ。写す釦から引く。
  /* 本体の版。写しの「版:」の行に入れる。公開ページの ver.txt から取る。
     stable の版はどのファイルにも出ていないので、写しでは「未確認」と書く。 */
  var honVer = '', stbVer = '';
  var VER_URL = 'https://kfsr148-art.github.io/koushu-handan/ver.txt';
  /* ＊読み先は公開ページ（github.io）にする。raw.githubusercontent は
       Cache-Control: max-age=300 で、しかも ?_t= では破れない（2026-08-23 実測。
       押し出し済みの中身が5分間そのまま古く返った）。公開ページ側は ?_t= ごとに
       新しい鍵になり、実測で Age: 0 の最新が返る。
     ＊stable の版だけは raw のまま。公開ページは main しか出さないので、
       stable の枝のファイルは公開ページからは取れない。版はめったに動かないので5分の遅れで足りる。 */
  var STB_URL = 'https://raw.githubusercontent.com/kfsr148-art/koushu-handan/stable/ver.txt';
  /* 一覧に出す上限。控えの側（notify-record.ps1 の $KEEP）と揃える。
     ＊5件に絞っていたが、写す前に実体ごと消える恐れがあるので20へ戻した（2026-08-23）。
       表示を絞るのは件数ではなく「写したかどうか」で行う。 */
  var SHOW_MAX = 20;
  /* 写した件の印。端末の中だけに残る。開き直しても消えない。
     ＊印の付いた件は一覧で畳む。消してしまうと、もう一度写せなくなるため。 */
  var COPIED_KEY = 'kh-panel-copied';
  var copied = {};
  /* 上部の常時表示と「全部写す」の末尾で使う、いまの様子。state.json から拾ったものを控える。
     ＊新しい経路は増やさない。すでに読んでいる state.json / ver.txt の値の見せ方だけ。 */
  var lastState = { word: '', since: '', at: 0 };
  function loadCopied() {
    try { copied = JSON.parse(localStorage.getItem(COPIED_KEY) || '{}') || {}; } catch (e) { copied = {}; }
  }
  function saveCopied() {
    try { localStorage.setItem(COPIED_KEY, JSON.stringify(copied)); } catch (e) {}
  }
  /* 一件の見分け。題と時刻で決める。控えが入れ替わっても同じ件は同じ鍵になる。 */
  function keyOf(d) { return String(d.time || 0) + '|' + String(d.title || ''); }
  /* 知らせの一覧。ntfy へ出るのは異常だけになったので、読み物はここから取る。 */
  var NOTICES_URL = 'https://kfsr148-art.github.io/koushu-handan/notices.json';
  /* 最後の更新からこれを超えたら「連絡なし」。
     見張りは「変化があったときだけ」流す作りで、変化が無い間は15分（900秒）おきに
     心拍を一本だけ出す。したがってここは 900 より長くないと、生きているのに
     「連絡なし」と出る。二つは対で決まる値。片方だけ変えないこと。 */
  var STALE_SEC = 1200;

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ＊話題名の設定は v17 で丸ごと撤去した。
       一覧は notices.json、状態は state.json、版は ver.txt から読む。どれも話題名を使わない。
       送る側の道具は v11 で、ntfy そのものは v15 で無くなった。話題名の出番はもう無い。
       ＊残しておくと罠になる。load() が話題名の保存を必須にしていたので、
         新しい端末では設定画面から先へ進めなくなる。
       ＊保存済みの値（localStorage の kh-panel-topics）は消さない。害が無く、
         古い写しへ戻したくなったときに要る。 */

  var sinceTimer = null;

  function showMain() {
    $('main').className = '';
    pullVer();
    tick();
    if (timer) { clearInterval(timer); }
    timer = setInterval(tick, 15000);
    /* 現況行の経過だけは毎秒。取得（15秒）とは別の時計で回す。 */
    if (sinceTimer) { clearInterval(sinceTimer); }
    sinceTimer = setInterval(tickSince, 1000);
  }

  /* 本体の版を一度だけ取りに行く。取れなければ写しには「未確認」と出る。
     画面には出さない。写しの中だけで使う。 */
  function pullVer() {
    fetch(VER_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { honVer = String(t || '').trim().replace(/[^0-9]/g, ''); })
      .catch(function () { honVer = ''; });
    /* stable の枝の ver.txt が、検収の済んだ版。タグを動かすとこちらも動く。 */
    fetch(STB_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { stbVer = String(t || '').trim().replace(/[^0-9]/g, ''); })
      .catch(function () { stbVer = ''; });
  }

  /* 15秒ごとに、知らせの一覧と状態の両方を取りに行く。 */
  function tick() { pull(); pullState(); }

  /* 題の種類で色を分ける。絵文字で頭が揃っているので、そこを見る。
       🙋 ヨシしてください   … 黄（返事が要る）
       📥 返事を受けました    … 灰（受け取りの控え。何もしなくてよい）
       👍 ヨシを受けました    … 灰（同上）
       ✅ 終わりました        … 緑
       👀 異常です（待てば戻ります）… 青
       🪟 異常です（手が要ります）  … 赤 */
  function kind(t) {
    t = String(t || '');
    if (t.indexOf('🙋') >= 0) { return 'ask'; }
    if (t.indexOf('📥') >= 0 || t.indexOf('👍') >= 0) { return ''; }
    if (t.indexOf('🔎') >= 0) { return 'wait'; }   /* 調べた。青。手は入れていない */
    if (t.indexOf('✅') >= 0) { return 'done'; }
    if (t.indexOf('👀') >= 0) { return 'wait'; }
    if (t.indexOf('🪟') >= 0) { return 'act'; }
    /* 絵文字の無い古い知らせも読めるようにしておく */
    if (t.indexOf('ヨシしてください') >= 0 || t.indexOf('返事してください') === 0) { return 'ask'; }
    if (t.indexOf('受けました') >= 0) { return ''; }
    if (t.indexOf('終わりました') === 0) { return 'done'; }
    if (t.indexOf('待てば戻ります') >= 0) { return 'wait'; }
    if (t.indexOf('手が要ります') >= 0) { return 'act'; }
    if (t.indexOf('異常です') === 0) { return 'act'; }
    return '';
  }

  function hhmm(sec) {
    try {
      var d = new Date(sec * 1000);
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return ''; }
  }

  /* ntfy の poll は一行に一件の JSON（JSON の配列ではない）。行ごとに解く。 */
  /* 一覧が0件のときは、白紙にせず理由を出す。 */
  function sayWhy(msg) {
    $('list').innerHTML = '<li class="why"><p class="m">' + esc(msg) + '</p></li>';
  }

  function pull() {
    /* ＊「送る側」の話題名は、もう一覧には要らない（v10）。
       押し通知を iPhone で受けるために ntfy の側で購読する名前として残してあるだけ。 */
    /* 一覧は notices.json から読む（v10）。ntfy へ出るのは異常のときだけになったので、
       話題を読んでも異常しか並ばない。読み物はリポジトリ経由に一本化した。
       中身は status.md と同じ二十件で、書いているのは notify-record.ps1。 */
    fetch(NOTICES_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      })
      .then(function (arr) {
        var rows = Array.isArray(arr) ? arr.slice() : [];
        rows.sort(function (a, b) { return (b.time || 0) - (a.time || 0); });
        /* ＊件数では絞らない。絞るのは「写したかどうか」。
             写していない件は古くても残す——写す前に消えるのがいちばん困るため。
             それでも上限は要るので SHOW_MAX（＝控えの上限と同じ20）で頭を切る。 */
        rows = rows.slice(0, SHOW_MAX);
        shown = rows;

        /* 控えに無くなった件の印は捨てる。端末の中に溜め続けない。 */
        var live = {}, changed = false;
        rows.forEach(function (d) { live[keyOf(d)] = 1; });
        Object.keys(copied).forEach(function (k) { if (!live[k]) { delete copied[k]; changed = true; } });
        if (changed) { saveCopied(); }

        var html = '';
        rows.forEach(function (d, i) {
          var k = kind(d.title);
          /* 受け取り確認（📥／👍）は畳む。題の行を押せば開く。 */
          var ack = isAck(d.title);
          /* 写した件も同じように畳む。題の行だけ残り、押せばまた開く。 */
          var cp = !!copied[keyOf(d)];
          /* ⑧そのままを持つ件は畳んでおく。長いので開いたままだと一覧が読めない。
             題の行を押せば開く（畳んだ件と同じ受け）。 */
          var hasRaw = /^そのまま[:：]/m.test(String(d.message || ''));
          var cls = k + (ack || cp || hasRaw ? ' ack' : '') + (cp ? ' copied' : '');
          html += '<li class="' + cls.trim() + '" data-i="' + i + '">'
                + '<p class="t"><span class="tx">' + esc(d.title || '(題なし)')
                + '<span class="when">' + hhmm(d.time) + '</span></span>'
                + '<button type="button" class="cp' + (cp ? ' ok' : '') + '" data-i="' + i + '">'
                + (cp ? '写した' : '写す') + '</button></p>'
                + '<p class="m">' + esc(d.message) + '</p></li>';
        });
        if (html) { $('list').innerHTML = html; }
        else { sayWhy('まだ知らせがありません。出ればここに並びます。'); }
        paintBar();
      })
      .catch(function (e) {
        /* 取得に失敗したことと、その理由を必ず画面に出す。白紙にしない。 */
        sayWhy('一覧を読めません（' + e.message + '）。'
             + 'notices.json が公開ページに無いか、通信が届いていません。');
        paintBar();
      });
  }

  /* 受け取り確認かどうか。ここだけ一覧で畳む。 */
  function isAck(t) {
    t = String(t || '');
    return (t.indexOf('📥') >= 0 || t.indexOf('👍') >= 0 || t.indexOf('受けました') >= 0);
  }

  /* 一覧の上の行。出すのは最後に取りに行った時刻だけ。
     ＊「未処理◯件」は撤去した（v16）。数えていたのは受信箱（inbox.txt）の未処理で、
       その受信箱に書く者はパネルからの送信だけだった。v11 でその送信を撤去したので、
       いまは構造上いつも0にしかならない（最後に増えたのは 17:28:33）。
       数える先の無い表示は誤解を生むので、行ごと落とした。 */
  /* 版の並びと生存の時刻。どちらもずれ／古さが分かるように色を変える。 */
  var SEEN_WARN_SEC = 300;   /* 生存がこれより古ければ、止まっている恐れ */
  function paintFacts(atSec) {
    var v = $('fVer'), s = $('fSeen');
    if (!v || !s) { return; }
    var hv = honVer || '未確認', sv = stbVer || '未確認';
    v.textContent = '本体 v' + hv + ' ／ 公開 v' + sv;
    /* 二つがずれている＝実機へ出ている版が本体より遅れている。 */
    v.className = (honVer && stbVer && honVer !== stbVer) ? 'warn' : '';
    var age = atSec ? Math.floor(Date.now() / 1000 - atSec) : -1;
    s.textContent = '最終確認 ' + (atSec ? hhmm(atSec) : '—');
    s.className = (age < 0 || age > SEEN_WARN_SEC) ? 'warn' : '';
  }

  function paintBar() {
    $('stat').textContent = hhmm(Math.floor(Date.now() / 1000)) + ' 更新';
  }

  /* 写しの中身は、相談役のクロードへ貼るためのもの（v9）。
     相談役はこの機械の中が一切見えないので、貼られた文だけで状況を判断する。
     したがって六行を決まった順で書き、確かめていないことは「未確認」と明記する。

       状態:      作業中／ヨシ待ち／終わり／異常 のどれか
       したこと:  二文以内
       版:        本体とstableの両方
       ファイル:  触ったファイル名と、変えた行の位置
       実測:      時刻・数値・PASS/FAIL をそのまま
       未決:      無ければ「未決なし」

     絵文字と飾りの記号、行頭の時刻の見出し、「返事不要」などの案内文は入れない。
     ただし実測の中の時刻は残す（数値だからで、見出しではない）。 */

  /* 題から状態の一語を取り出す。絵文字は落とす。 */
  function stateWord(title) {
    var t = String(title || '');
    if (t.indexOf('ヨシしてください') >= 0 || t.indexOf('返事してください') >= 0) { return 'ヨシ待ち'; }
    /* 調べた＝手を入れていないが、訊かれたことの答えが出た状態（v22 で足した五つ目）。
       「終わりました」より先に見ること。どちらも「〜ました」で終わるため。 */
    if (t.indexOf('調べました') >= 0 || t.indexOf('調べた') >= 0) { return '調べた'; }
    if (t.indexOf('終わりました') >= 0) { return '終わり'; }
    if (t.indexOf('異常') >= 0) { return '異常'; }
    /* ＊「未確認」は返さない。状態は五つだけと決めてある。
         題から読み取れないもの（試しの一本など）は、確かめの最中とみなして「作業中」。 */
    return '作業中';
  }

  /* 絵文字と飾りの記号だけを落とす。
     ＊矢印（U+2190〜U+21FF）は落とさない。「パネル→受信箱→この窓」のように
       向きを表す意味があり、消すと文が壊れる（v9 の実測で実際に壊れた）。
     ＊鉤括弧も落とさない。引用の範囲が分からなくなる。 */
  function plain(s) {
    return String(s || '')
      .replace(/[\u{1F000}-\u{1FAFF}]/gu, '')       /* 絵文字の本体 */
      .replace(/[\u{2600}-\u{27BF}]/gu, '')         /* ✅ ★ などの記号と絵記号 */
      .replace(/[\u{2B00}-\u{2BFF}]/gu, '')         /* 飾りの図形 */
      .replace(/[\u{FE00}-\u{FE0F}\u{200D}]/gu, '') /* 異体字選択子とゼロ幅接合子 */
      .replace(/[■□◆◇▲△▼▽◎]/g, '')                /* 飾りの図形（続き） */
      .replace(/^[・\-*\s]+/, '')
      /* ＊改行も潰す。潰さないと「したこと」が二行になり、写しが七行を超える
         （2026-08-23 実測：本文が二行の件で八行になった）。写しは必ず七行。 */
      .replace(/\s+/g, ' ')
      .trim();
  }

  /* 二文までに切る。句点で数える。 */
  function twoSentences(s) {
    var t = String(s || '').trim();
    if (!t) { return ''; }
    var parts = t.split('。').filter(function (x) { return x.trim(); });
    if (parts.length <= 2) { return t; }
    return parts.slice(0, 2).join('。') + '。';
  }

  /* 本文に「版:」「ファイル:」のような見出しの行があれば拾う。無ければ空。 */
  function pick(body, names) {
    var lines = String(body || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i].trim();
      for (var j = 0; j < names.length; j++) {
        var re = new RegExp('^' + names[j] + '[:：]\\s*(.+)$');
        var m = ln.match(re);
        if (m) { return plain(m[1]); }
      }
    }
    return '';
  }

  /* 本文からファイル名を拾う。「名前.拡張子」と、すぐ後ろに続く行の位置まで。
     ＊見出しの「ファイル:」が本文にあればそちらが優先。ここは無いときの拾い方。 */
  function findFiles(body) {
    /* ＊長い拡張子を先に並べること。js を json より前に置くと、
         state.json が state.js で切れる（2026-08-23 実測）。 */
    var re = /[A-Za-z0-9_.\-]+\.(?:jsonl|json|html|ps1|tsv|txt|png|md|js)(?::[\d,\-]+行?)?/g;
    var seen = {}, out = [];
    var m;
    while ((m = re.exec(String(body || ''))) !== null) {
      var t = m[0];
      if (!seen[t]) { seen[t] = 1; out.push(t); }
    }
    return out.join(' / ');
  }

  /* 実測らしい言い回し。時刻・数値・PASS/FAIL・「実測」「とも正」など。 */
  var MEAS = /(PASS|FAIL|実測|確かめ|とも正|通りとも|\d{1,2}:\d{2}|HTTP=?\d|\d+\s*(?:件|本|回|px|バイト|通り))/;

  /* 本文を「したこと」と「実測」に振り分ける。
     ＊括弧の中に実測が入ることが多い（「（932で起こしても UTF-8 で出ることを実測）」）。
       先に括弧を取り出して判じ、実測なら本文から抜く。残りを句点で切って同じ判じにかける。 */
  function splitFacts(body) {
    var text = String(body || '');
    var meas = [];
    text = text.replace(/[（(]([^（）()]{4,})[）)]/g, function (whole, inner) {
      if (MEAS.test(inner)) { meas.push(inner.trim()); return ''; }
      return whole;
    });
    var did = [];
    text.split('\n').forEach(function (ln) {
      ln.split('。').forEach(function (s) {
        s = s.trim();
        if (!s) { return; }
        if (MEAS.test(s)) { meas.push(s); } else { did.push(s); }
      });
    });
    return { did: did.join('。') + (did.length ? '。' : ''), meas: meas.join(' ／ ') };
  }

  /* 六行を組む。 */
  function sixLines(d) {
    var body = String(d.message || '');
    /* ⑧そのままから下は、③したことにも⑥実測にも回さない。
       ＊⑧は見出しの無い行が並ぶので、切らずに渡すと⑧の中身が③へ流れ込む
         （2026-08-24 実測：「■ 一段目 - 字下げを残す行」が したこと に出た）。
       ＊見出しの拾い（pick）も head だけを見る。⑧の中に「実測:」のような行が
         あっても、それは貼った本文の一部で、この件の見出しではない。 */
    var rawIdx = body.search(/^そのまま[:：]/m);
    var head = (rawIdx >= 0) ? body.slice(0, rawIdx) : body;
    var lines = head.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);

    /* 見出しの付いた行は「したこと」から外す。件名（一行目）も外す。 */
    var LABEL = /^(版|ファイル|実測|未決|待ち|完了|件名|状態|したこと|食い違い|答え|そのまま|種類)[:：]/;
    var rest = lines.slice(1).filter(function (x) { return !LABEL.test(x); }).join('\n');
    if (!rest) { rest = lines[0] || ''; }

    /* 見出しの「実測:」が本文にあるなら、振り分けはしない。残り全部が「したこと」。
       ＊振り分けを掛けると、数値を含む一文まで実測へ回り、「したこと」が空になる
         （2026-08-23 実測：「一覧も控えの実体も最新5件に揃えた」が5件で実測扱いになり未確認に落ちた）。
       見出しが無い古い知らせだけ、本文から実測を拾い分ける。 */
    var hasMeasLabel = pick(head, ['実測', '確かめ方', '結果']);
    var f = hasMeasLabel ? { did: rest, meas: '' } : splitFacts(rest);
    var did = twoSentences(plain(f.did));
    if (!did) { did = twoSentences(plain(rest)); }   /* 全部が実測に見えたときの落ち */

    var ver = pick(head, ['版', 'バージョン']);
    if (!ver) {
      /* 版は公開ページの ver.txt から取る。main の分が本体、stable の枝の分が stable。
         取れなかった側だけ「未確認」と書く。 */
      var a = honVer ? ('本体v' + honVer) : '本体 未確認';
      var b = stbVer ? ('stable v' + stbVer) : 'stable 未確認';
      ver = a + ' ／ ' + b;
    }
    /* 見出しがあればそれを使う。無ければ本文から拾ったものを使う。 */
    var files = pick(head, ['ファイル', '触ったファイル']);
    if (!files) { files = findFiles(rest); }
    var meas  = pick(head, ['実測', '確かめ方', '結果']);
    if (!meas) { meas = plain(f.meas); }
    /* ⑦は三つに書き分ける。空なら「なし」。
       食い違い＝受けた指示のうち、そのままでは成立しない点と、どう読み替えたか
       答え＝指示の中で訊かれたことへの答え（③したことには書かない）
       未決＝判断待ちの項目 */
    var gap   = pick(head, ['食い違い']);
    var ans   = pick(head, ['答え']);
    var open  = pick(head, ['未決', '待ち']);

    /* ⑧そのまま＝要約せずに貼る欄。字数の上限なし。
       ＊ここだけは plain も twoSentences も通さない。改行も原文のまま残す。
         迷ったら削らずここへ貼る、という決めなので、削る処理を一切かけない。 */
    var raw = '';
    if (rawIdx >= 0) { raw = body.slice(rawIdx).replace(/^そのまま[:：]\s*/, '').trim(); }

    /* 「調べた」の回だけ、⑥実測を一項目一行の箇条書きにする。
       ＊調べた結果はファイル名・行番号・パスの並びで、一行に詰めると読めない。
         表にもしない（画面から切れて写しが撮り直しになる）。省略記号でも切らない。
       ＊控えの側は一行に収める決まりなので、「 ／ 」で区切って書き、ここで行に開く。 */
    var st = stateWord(d.title);
    if (st === '調べた' && meas) {
      meas = '\n' + meas.split(/\s*／\s*/).filter(Boolean).map(function (x) { return '- ' + x; }).join('\n');
    }

    return [
      /* 一行目は「いつの何の件か」。一件でも一括でも同じ形にする。
         件名は本文の一行目。**題は使わない**——題の中身（終わりました／異常です など）は
         次の行の「状態」と同じことを言うので、写しに二度書くことになる
         （2026-08-23 実測：件名の無い件で「終わりました（返事不要）」が一行目に出た）。 */
      '[' + hhmm(d.time) + '] ' + (plain(lines[0] || '') || '（件名なし）'),
      '状態: ' + st,
      'したこと: ' + (did || '未確認'),
      '版: ' + ver,
      'ファイル: ' + (files || '未確認'),
      '実測: ' + (meas || '未確認'),
      '食い違い: ' + (gap || 'なし'),
      '答え: ' + (ans || 'なし'),
      '未決: ' + (open || 'なし'),
      /* ⑧は最後。要約せず原文のまま。四つの該当（成立しなかった箇所と理由／訊かれたことへの答え／
         調べて出たファイル名・行番号・パスの一覧／判断の根拠にしたコマンドの出力）が
         あれば必ず全文が入る。無いときだけ「なし」。 */
      'そのまま: ' + (raw || 'なし')
    ].join('\n');
  }

  /* いまの現況を一行に。上部に出しているのと同じ値をそのまま使う。
     ＊「全部写す」の末尾だけに付ける。一件ずつの写しには付けない。 */
  function nowLine() {
    var a = [];
    a.push('現況：' + (lastState.word || '—') + (lastState.since ? '・' + lastState.since : ''));
    a.push('本体v' + (honVer || '未確認'));
    a.push('公開v' + (stbVer || '未確認'));
    a.push('最終確認' + (lastState.at ? hhmm(lastState.at) : '—'));
    return a.join(' ／ ');
  }

  /* 写していない件を、古い順にまとめて一本の文にする。 */
  function copyAllText() {
    var todo = shown.filter(function (d) { return !copied[keyOf(d)]; });
    todo.sort(function (a, b) { return (a.time || 0) - (b.time || 0); });   /* 古い順。上から読めば時系列 */
    if (!todo.length) { return null; }
    var parts = todo.map(function (d) { return sixLines(d); });
    parts.push(nowLine());
    return { text: parts.join('\n\n'), items: todo };
  }

  function copyAll(btn) {
    var r = copyAllText();
    if (!r) {
      btn.textContent = '未写しなし';
      setTimeout(function () { btn.textContent = '全部写す'; }, 2000);
      return;
    }
    var done = function () {
      r.items.forEach(function (d) { copied[keyOf(d)] = 1; });
      saveCopied();
      btn.textContent = r.items.length + '件 写した';
      btn.className = 'cpall ok';
      pull();   /* 写した件は畳んで薄くなる */
      setTimeout(function () { btn.textContent = '全部写す'; btn.className = 'cpall'; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r.text).then(done, function () { fallback(r.text); done(); });
    } else {
      fallback(r.text); done();
    }
  }

  function copyOne(i, btn) {
    var d = shown[i];
    if (!d) { return; }
    var text = sixLines(d);
    /* すでに写した件をもう一度押したか。押せることは変えないが、
       字が「写した」のままだと押した手応えが無く、効いていないように見える
       （2026-08-23 のご指摘）。二度目は字を変えて、1.5秒で戻す。 */
    var again = !!copied[keyOf(d)];
    var done = function () {
      /* 写した印を端末の中に残す。開き直しても消えない。 */
      copied[keyOf(d)] = 1;
      saveCopied();
      btn.textContent = again ? 'また写した' : '写した';
      btn.className = 'cp ok';
      var li = btn.parentNode && btn.parentNode.parentNode;
      if (li && li.tagName === 'LI' && li.className.indexOf('copied') < 0) {
        li.className = (li.className + ' ack copied').replace(/\s+/g, ' ').trim();
      }
      if (again) { setTimeout(function () { btn.textContent = '写した'; }, 1500); }
    };
    /* 写せなかったとき。**成功に見せない**——done は通さない。
       ＊v20 で「落ちたのか分からない」を直そうとして done を通したが、それだと
         写せていないのに「写した」と出て、失敗が成功に見える（2026-08-23 のご指摘）。
       ＊印も付けない。付けると一覧から畳まれ、写せていない件が片付いたように見える。
       ＊手で写す逃げ道（選択済みの箱）は出す。字は3秒で元へ戻す。 */
    var failed = function () {
      fallback(text);
      btn.textContent = '写せません';
      btn.className = 'cp ng';
      setTimeout(function () {
        btn.textContent = again ? '写した' : '写す';
        btn.className = again ? 'cp ok' : 'cp';
      }, 3000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      /* ＊writeText はその場で例外を投げることもある。then だけでは拾えない。 */
      try { navigator.clipboard.writeText(text).then(done, failed); }
      catch (e) { failed(); }
    } else {
      failed();
    }
  }

  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.className = 'copybox';
    ta.value = text;
    document.body.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(0, ta.value.length);
    var close = function () {
      if (ta.parentNode) { ta.parentNode.removeChild(ta); }
      document.removeEventListener('touchstart', close, true);
      document.removeEventListener('mousedown', close, true);
    };
    setTimeout(function () {
      document.addEventListener('touchstart', close, true);
      document.addEventListener('mousedown', close, true);
    }, 0);
  }

  /* いまの状態を一行で出す。
     作業中＝青／ヨシ待ち＝黄／手待ち＝灰。最後の更新から3分を超えたら赤で「連絡なし」。 */
  function paintState(cls, word, subj, ago, mik) {
    $('state').className = 'state ' + cls;
    $('stWord').textContent = word;
    $('stSubj').textContent = subj;
    /* 見込みは二段目。無いときは畳んで、今までどおりの一行に戻す。 */
    $('stMik').textContent = mik || '';
    $('stMik').className = mik ? 'k' : 'k hide';
    $('stAgo').textContent = ago;
  }

  function agoText(sec) {
    if (sec < 60) { return Math.max(0, Math.floor(sec)) + '秒前'; }
    if (sec < 3600) { return Math.floor(sec / 60) + '分前'; }
    return Math.floor(sec / 3600) + '時間前';
  }

  /* 現況行の経過の言い回し。1時間未満は「3分12秒」、1時間以上は「1時間4分」。
     ＊秒まで出すのは1時間未満だけ。長く待つほど秒は読まれないし、毎秒動く字が増えると読みにくい。 */
  function sinceText(sec) {
    sec = Math.max(0, Math.floor(sec));
    if (sec < 3600) { return Math.floor(sec / 60) + '分' + (sec % 60) + '秒'; }
    return Math.floor(sec / 3600) + '時間' + Math.floor((sec % 3600) / 60) + '分';
  }

  /* 現況行の経過は、画面側の時計で毎秒数え直す。
     ＊以前は 15 秒ごとの取得のときだけ数えていたので、表示が飛び飛びに動いた。
     ＊基準（statAt）は取得のたびに置き直す。画面側の時計がずれても、次の取得で合う。
     at が 0 のときは数えない（連絡なし・作業中・読めないとき）。 */
  var sinceBase = { at: 0, word: '' };

  function tickSince() {
    if (!sinceBase.at || !sinceBase.word) { return; }
    var el = $('stWord');
    if (!el) { return; }
    el.textContent = sinceBase.word + '・' + sinceText(Date.now() / 1000 - sinceBase.at);
  }

  /* いまの様子は state.json から読む（v8）。以前は ntfy の話題へ5分おきに流していたが、
     それだけで1日394件になり、ntfy の1日の上限に当たった（2026-08-23）。
     押し送りは「人を呼ぶもの」三種だけに絞り、状態はこちらから読みに行く形にした。
     置き場はリポジトリ直下。iPhone から VAIO のファイルには手が届かないので、
     見張りが commit と push で公開ページへ出す。status.md と同じ道。 */
  var STATE_URL = 'https://kfsr148-art.github.io/koushu-handan/state.json';

  function pullState() {
    /* 取り置きを避ける。GitHub の配信網は少し遅れるが、状態は「呼ぶもの」ではないので構わない。 */
    fetch(STATE_URL + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      })
      .then(function (d) {
        var sec = Math.floor(Date.now() / 1000) - (d.at || 0);
        var w = String(d.stat || '');
        var subj = String(d.subj || '');

        paintBar();

        /* 見込みの段は「作業中」のときだけ。経過はここで数えるので、
           次の書き出しを待たずに 15 秒ごとの取得で伸びていく。 */
        var mik = '';
        if (w === '作業中') {
          var min = d.startedAt ? Math.max(0, Math.floor((Date.now() / 1000 - d.startedAt) / 60)) : 0;
          mik = '見込み' + (d.mikomi ? d.mikomi : '不明') + '・開始から' + min + '分';
        }

        if (sec > STALE_SEC) {
          /* 連絡なしの間は数えない。数えると、毎秒の書き換えが「連絡なし」を上書きしてしまう。 */
          sinceBase = { at: 0, word: '' };
          paintState('lost', '連絡なし', subj + '（最後は ' + w + '）', agoText(sec), mik);
          return;
        }
        var cls = 'idle';
        if (w.indexOf('作業中') === 0) { cls = 'run'; }
        else if (w.indexOf('ヨシ待ち') === 0) { cls = 'ask'; }
        else if (w.indexOf('手待ち') === 0) { cls = 'idle'; }
        /* ヨシ待ち・手待ちは、その状態に入ってからの経過を題の横に出す。
           作業中は見込みの段に「開始から◯分」が出るので、こちらには足さない。 */
        var word = w;
        /* 取得のたびに statAt を読み直して基準を合わせ直す。数え直しは tickSince が毎秒行う。 */
        if ((w === 'ヨシ待ち' || w === '手待ち') && d.statAt) {
          sinceBase = { at: d.statAt, word: w };
          word = w + '・' + sinceText(Date.now() / 1000 - d.statAt);
        } else {
          sinceBase = { at: 0, word: '' };
        }
        lastState = { word: word, since: '', at: d.at || 0 };
        paintFacts(d.at || 0);
        paintState(cls, word, subj, agoText(sec), mik);
      })
      .catch(function (e) {
        sinceBase = { at: 0, word: '' };
        paintState('lost', '連絡なし', '状態を読めません（' + e.message + '）', '');
      });
  }

  /* ＊送る側の処理（post）は v11 で撤去した。Claude アプリの Code タブから直に指せる。
       戻したくなったら git の履歴（panel v10）から引く。印（tags の yoshi / shiji）で
       ヨシか指示かを分ける作りだったことも、そこに残っている。 */

  $('btnCopyAll').addEventListener('click', function () { copyAll(this); });

  /* 写す釦と、畳んだ件の開閉。一覧ごと張り替わるので親で受ける。 */
  $('list').addEventListener('click', function (e) {
    var b = e.target;
    if (b && b.className && b.className.indexOf('cp') === 0) {
      copyOne(parseInt(b.getAttribute('data-i'), 10), b);
      return;
    }
    var li = b;
    while (li && li.tagName !== 'LI') { li = li.parentNode; }
    if (li && li.className.indexOf('ack') >= 0) {
      li.className = (li.className.indexOf('open') >= 0)
        ? li.className.replace(/\s*open/, '')
        : li.className + ' open';
    }
  });

  /* ＊「確認も見る」の切り替えと、ヨシ・入力欄・送るの受けは v11 で撤去した。
       受け取り確認（📥／👍）の知らせ自体が出なくなったので、切り替える相手がいない。
       畳んだ件を開く道は残してある（題の行を押す）。 */

  loadCopied();
  showMain();
})();
</script>
</body>
</html>
