<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スクショ受付</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e18;color:#f3ece0;font-family:-apple-system,'Hiragino Sans',sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box;text-align:center;}
  .big{font-size:16px;padding:14px 26px;border-radius:10px;border:1px solid rgba(243,236,224,.4);background:#1c2233;color:#f3ece0;}
  .note{font-size:12px;opacity:.78;line-height:1.6;}
  a{color:#9db8ff;font-size:12px;}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0b0e18;}
  /* ページの中のカメラ（2026-11-14）：映像の上に手牌の帯と左端の線を重ね、右の撮るボタンで撮る */
  #cam{position:fixed;inset:0;background:#000;display:none;}
  #camBox{position:absolute;overflow:hidden;}
  #camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;}
  #camGuide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #camBtns{position:absolute;right:max(10px, env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;align-items:center;}
  #camShot{width:68px;height:68px;border-radius:50%;border:4px solid #f3ece0;background:#e0392b;color:#fff;font-size:13px;font-weight:700;}
  #camBack{min-width:56px;min-height:44px;border-radius:10px;border:1px solid rgba(243,236,224,.5);background:rgba(28,34,51,.85);color:#f3ece0;font-size:12px;}
  #camTip{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:12px;color:#f3ece0;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:6px;white-space:nowrap;}
  #camState{position:absolute;font-size:12px;line-height:18px;color:#fff;background:rgba(0,0,0,.6);padding:1px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;}
  #camState:empty{display:none;}
  #camTurn{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:15px;color:#f3ece0;background:rgba(0,0,0,.7);text-align:center;padding:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="note" id="msg">軽い受付ページですの。ここなら写真選択で落ちませんわ。</div>
  <button type="button" class="big" id="camOpen">📷 カメラで撮る</button>
  <button type="button" class="big" id="pick">🖼 写真を選ぶ</button>
  <input type="file" id="f" accept="image/*" style="display:none">
  <a href="koushu-handan.html">← 本体へ戻る</a>
</div>
<div id="cam">
  <div id="camBox">
    <video id="camVideo" playsinline muted autoplay></video>
    <svg id="camGuide" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <!-- 手牌の帯（既定の枠と同じ割合：横18.55%〜71.05%・縦85.92%〜99.24%） -->
      <rect x="185.5" y="859.2" width="525" height="133.2" fill="rgba(212,175,55,0.10)" stroke="#d4af37" stroke-width="4" stroke-dasharray="14 8" vector-effect="non-scaling-stroke"/>
      <!-- 左端の線（帯の左端を縦に通す） -->
      <line x1="185.5" y1="760" x2="185.5" y2="1000" stroke="#ff5a4a" stroke-width="5" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>
  <div id="camTip">手牌を金の枠に、左端の牌を赤い線に合わせてくださいまし。枠が緑になったら自動で撮りますわ</div>
  <div id="camBtns">
    <button type="button" id="camShot">撮る</button>
    <button type="button" id="camBack">戻る</button>
  </div>
  <div id="camState"></div>
  <div id="camTurn">スマホを横向きにしてくださいまし</div>
</div>
<iframe id="app" title="本体"></iframe>
<script>
/* 受付ページ（2026-11-14・v1469）
   ＊写真を選ぶのはこの軽いページで行う（重い本体で選ぶと落ちるため）。
   ＊「写真を選ぶ」を押したその時に、音を鳴らせる状態を取っておく：攻め／守りの声のファイルを無音で一度鳴らして止め、
     OS の読み上げも空の一言で一度起こす。スマホは、押した操作の中で一度鳴らした物だけ、後で鳴らせる。
   ＊写真を預けたら、ページを読み直さずに、この画面の上へ本体を全面の枠で開く。本体は預かった写真を読んで判定まで進め、
     判定した直後の声だけをこのページ（window.ssReaderVoice）に頼む。読み直すと押した操作の効き目が消えるため。 */
(function(){
  var msg = document.getElementById('msg');
  var VOICES = { attack: 'attack.wav.wav', defend: 'defend.wav.wav' };
  /* 攻めの三場面の声（v1480・voice-scenes.txt）。ファイルが置かれていれば、判定の声の代わりに本体が鳴らしてもらう。
     置かれていない名前は聞こえず、本体が今までの attack の声を鳴らす（ssReaderHas が false を返す）。 */
  var SCENE = ['scene-nashi', 'scene-yakuhai'];
  ['man', 'pin', 'sou'].forEach(function(k){ [6, 7, 8, 9, 10].forEach(function(n){ SCENE.push('scene-some-' + k + '-' + n); }); });
  var sceneOk = {};
  var aud = {}, unlocked = false;
  function say(text, rate){
    if(!text || !window.speechSynthesis) return;
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = rate || 1.0;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function unlock(){
    if(unlocked) return;
    unlocked = true;
    Object.keys(VOICES).forEach(function(k){
      try{
        var a = new Audio(VOICES[k]);
        a.preload = 'auto';
        a.muted = true;
        var stop = function(){ try{ a.pause(); a.currentTime = 0; }catch(e){} a.muted = false; };
        var p = a.play();
        if(p && p.then) p.then(stop, function(){ a.muted = false; }); else stop();
        aud[k] = a;
      }catch(e){}
    });
    /* 場面の声も、押した操作の中で一度だけ無音で鳴らして止める。読めた物だけ sceneOk を立てる。 */
    SCENE.forEach(function(k){
      try{
        var a = new Audio(k + '.wav.wav');
        a.preload = 'auto';
        a.muted = true;
        a.addEventListener('canplay', function(){ sceneOk[k] = true; }, { once: true });
        a.addEventListener('error', function(){ sceneOk[k] = false; }, { once: true });
        var stop = function(){ try{ a.pause(); a.currentTime = 0; }catch(e){} a.muted = false; };
        var p = a.play();
        if(p && p.then) p.then(stop, function(){ a.muted = false; }); else stop();
        aud[k] = a;
      }catch(e){}
    });
    try{
      if(window.speechSynthesis){ var u = new SpeechSynthesisUtterance(' '); u.volume = 0; window.speechSynthesis.speak(u); }
    }catch(e){}
  }
  /* 本体（枠の中）から先に問われる：この場面の声のファイルを鳴らせるか（読めた物だけ true） */
  window.ssReaderHas = function(name){ return sceneOk[name] === true && !!aud[name]; };
  /* 本体（枠の中）から呼ばれる。取っておいた声のファイルを鳴らし、無ければ OS の読み上げ */
  window.ssReaderVoice = function(name, text, rate){
    var a = aud[name];
    if(a){
      try{
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        a.muted = false;
        a.currentTime = 0;
        var p = a.play();
        if(p && p.catch) p.catch(function(){ say(text, rate); });
        return true;
      }catch(e){}
    }
    say(text, rate);
    return true;
  };
  document.getElementById('pick').addEventListener('click', function(){
    unlock();
    document.getElementById('f').click();
  });
  /* ページの中のカメラ（2026-11-14）。iPhone のカメラを呼び出さず、横向きの映像に手牌の帯と左端の線を重ね、撮るボタンで撮る。
     撮った一枚は「写真を選ぶ」と同じく ssReaderTake へ渡す（読み直さず枠で本体を開いて判定まで）。 */
  var cam = document.getElementById('cam'), box = document.getElementById('camBox'), video = document.getElementById('camVideo');
  var stream = null;
  function camLayout(){
    if(cam.style.display !== 'block') return;
    var W = window.innerWidth, H = window.innerHeight;
    document.getElementById('camTurn').style.display = (H > W) ? 'flex' : 'none';
    var a = (video.videoWidth && video.videoHeight) ? video.videoWidth / video.videoHeight : 16 / 9;
    var bw = W, bh = W / a;
    if(bh > H){ bh = H; bw = H * a; }
    box.style.width = Math.round(bw) + 'px'; box.style.height = Math.round(bh) + 'px';
    box.style.left = Math.round((W - bw) / 2) + 'px'; box.style.top = Math.round((H - bh) / 2) + 'px';
    /* 今どこが合っていないかの字は、枠の下に置く。下に場所が無ければ枠のすぐ上 */
    var st = document.getElementById('camState'), bx = (W - bw) / 2, by = (H - bh) / 2;
    var below = by + bh * G.y2 + 4;
    st.style.left = Math.round(bx + bw * G.x1) + 'px';
    st.style.top = Math.round(below + 22 <= H ? below : by + bh * G.y1 - 24) + 'px';
  }
  function camStop(){
    autoStop();
    if(stream){ stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); stream = null; }
    try{ video.srcObject = null; }catch(e){}
    cam.style.display = 'none';
  }
  /* 自動で撮る（2026-11-14・同日ゆるめた）：0.2秒ごとに映像を小さく取って見る。
     ①手牌が枠に大体収まる：枠の列の55%以上に白い牌の面があり、枠の上へのはみ出しが少ない（4割まで）
     ②左端が線の近く：線の左右8%の中で、白い面が始まる列が線から4%以内
     ③大体止まっている：前の一枚との明るさの差が小さい（少しの手ぶれは許す）
     三つがそろって0.6秒続いたら枠を緑にし、緑になったら0.5秒後に必ず撮る（途中で外れても撮る）。
     それでも合わない時は、手牌らしい物（枠の列の35%以上に白い面）が3秒続けて見えていれば撮る。
     今どこが合っていないかは、枠の下に短い字で出す。 */
  var G = { x1: 0.1855, x2: 0.7105, y1: 0.8592, y2: 0.9924 };
  var autoTimer = null, okSince = 0, greenSince = 0, seenSince = 0, prevGray = null, shot = false;
  function stateText(t){ var el = document.getElementById('camState'); if(el) el.textContent = t; }
  var guideRect = document.querySelector('#camGuide rect');
  function guideColor(green){
    guideRect.setAttribute('stroke', green ? '#3ad46a' : '#d4af37');
    guideRect.setAttribute('fill', green ? 'rgba(58,212,106,0.18)' : 'rgba(212,175,55,0.10)');
    guideRect.setAttribute('stroke-dasharray', green ? '' : '14 8');
  }
  function autoStop(){ if(autoTimer){ clearInterval(autoTimer); autoTimer = null; } okSince = 0; greenSince = 0; seenSince = 0; prevGray = null; guideColor(false); stateText(''); }
  var probeCv = document.createElement('canvas');
  window.ssCamLook = function(){   /* いまの一枚を見て {fit, edge, still, ok} を返す */
    var vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh) return null;
    var W = 320, H = Math.max(1, Math.round(320 * vh / vw));
    probeCv.width = W; probeCv.height = H;
    var g = probeCv.getContext('2d');
    g.drawImage(video, 0, 0, W, H);
    var d = g.getImageData(0, 0, W, H).data, n = W * H, L = new Uint8Array(n), wh = new Uint8Array(n), hist = [], i;
    for(i = 0; i < 256; i++) hist.push(0);
    for(i = 0; i < n; i++){
      var r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2];
      L[i] = Math.round(0.299 * r + 0.587 * gg + 0.114 * b); hist[L[i]]++;
    }
    var sum = 0; for(i = 0; i < 256; i++) sum += i * hist[i];
    var sB = 0, wB = 0, best = -1, T = 128;
    for(i = 0; i < 256; i++){ wB += hist[i]; if(!wB) continue; var wF = n - wB; if(!wF) break; sB += i * hist[i]; var mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF); if(v > best){ best = v; T = i; } }
    T = Math.max(120, T);
    for(i = 0; i < n; i++){ var j = i * 4; wh[i] = (L[i] >= T && Math.max(d[j], d[j + 1], d[j + 2]) - Math.min(d[j], d[j + 1], d[j + 2]) <= 80) ? 1 : 0; }
    function frac(x0, x1, y0, y1){
      var X0 = Math.max(0, Math.round(x0 * W)), X1 = Math.min(W, Math.round(x1 * W)), Y0 = Math.max(0, Math.round(y0 * H)), Y1 = Math.min(H, Math.round(y1 * H));
      var s = 0, c = 0;
      for(var y = Y0; y < Y1; y++) for(var x = X0; x < X1; x++){ s += wh[y * W + x]; c++; }
      return c ? s / c : 0;
    }
    /* 枠の列のうち、白い面が縦に3割以上ある列の割合 */
    var X0 = Math.round(G.x1 * W), X1 = Math.round(G.x2 * W), Y0 = Math.round(G.y1 * H), Y1 = Math.round(G.y2 * H), cols = 0, good = 0;
    for(var x = X0; x < X1; x++){ var s = 0; for(var y = Y0; y < Y1; y++) s += wh[y * W + x]; cols++; if(s >= (Y1 - Y0) * 0.3) good++; }
    var cover = cols ? good / cols : 0;
    var above = frac(G.x1, G.x2, G.y1 - 0.08, G.y1 - 0.02);
    /* 左端：線の左右8%の中で、白い面が縦に3割以上ある最初の列 */
    var leftX = -1, LX0 = Math.max(0, Math.round((G.x1 - 0.08) * W)), LX1 = Math.min(W, Math.round((G.x1 + 0.08) * W));
    for(var lx = LX0; lx < LX1 && leftX < 0; lx++){ var ls = 0; for(var ly = Y0; ly < Y1; ly++) ls += wh[ly * W + lx]; if(ls >= (Y1 - Y0) * 0.3) leftX = lx / W; }
    var diff = 0;
    if(prevGray && prevGray.length === n){ for(i = 0; i < n; i += 4) diff += Math.abs(L[i] - prevGray[i]); diff /= (n / 4); } else diff = 999;
    prevGray = L;
    var fit = cover >= 0.55 && above <= 0.4, edge = leftX >= 0 && Math.abs(leftX - G.x1) <= 0.04, still = diff < 14;
    return { fit: fit, edge: edge, still: still, ok: fit && edge && still, seen: cover >= 0.35, cover: cover, above: above, leftX: leftX, diff: diff };
  };
  /* 今どこが合っていないかの短い字 */
  function whyText(r){
    if(!r || r.cover < 0.15) return '手牌が見えません';
    if(r.above > 0.4) return '手牌が枠の上にはみ出しています';
    if(r.cover < 0.55) return '手牌を枠いっぱいに';
    if(r.leftX < 0 || r.leftX > G.x1 + 0.04) return '左端が赤い線より右です';
    if(r.leftX < G.x1 - 0.04) return '左端が赤い線より左です';
    if(!r.still) return '止めてくださいまし';
    return '合いました';
  }
  function autoStart(){
    autoStop();
    shot = false;
    autoTimer = setInterval(function(){
      if(cam.style.display !== 'block' || shot || Date.now() < retakeHoldUntil) return;
      var r = window.ssCamLook();
      var now = Date.now();
      if(greenSince){   /* 緑になったら必ず撮る */
        stateText('撮ります');
        if(now - greenSince >= 500){ shot = true; shoot(); }
        return;
      }
      if(r && r.seen){ if(!seenSince) seenSince = now; } else seenSince = 0;
      if(r && r.ok){
        if(!okSince) okSince = now;
        stateText('合いました。そのまま');
        if(now - okSince >= 600){ greenSince = now; guideColor(true); stateText('撮ります'); }
        return;
      }
      okSince = 0;
      if(seenSince && now - seenSince >= 3000){   /* 合わないままでも、手牌らしい物が3秒見えていれば撮る */
        guideColor(true); stateText('撮ります'); shot = true; shoot(); return;
      }
      stateText(whyText(r) + (seenSince ? '（あと' + Math.max(1, Math.ceil((3000 - (now - seenSince)) / 1000)) + '秒で撮ります）' : ''));
    }, 200);
  }
  window.addEventListener('resize', camLayout);
  window.addEventListener('orientationchange', function(){ setTimeout(camLayout, 300); });
  video.addEventListener('loadedmetadata', camLayout);
  document.getElementById('camOpen').addEventListener('click', function(){
    unlock();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      msg.textContent = 'このブラウザではページの中のカメラが使えませんの。「写真を選ぶ」からお願いいたしますわ';
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } })
      .then(function(s){
        stream = s;
        video.srcObject = s;
        cam.style.display = 'block';
        camLayout();
        var p = video.play(); if(p && p.catch) p.catch(function(){});
        autoStart();
        preloadApp();   /* 撮り直しの見極めと、読み直さずに渡すため、本体を見えない枠で先に読み込む（v1475） */
      })
      .catch(function(e){
        msg.textContent = 'カメラを開けませんでしたわ（' + (e && e.name || e) + '）。「写真を選ぶ」からお願いいたしますわ';
      });
  });
  document.getElementById('camBack').addEventListener('click', camStop);
  document.getElementById('camShot').addEventListener('click', function(){ unlock(); shoot(); });
  /* 撮り直し（2026-11-14・v1475）：カメラを開いた時に本体を見えない枠で先に読み込み、撮った一枚をまず本体の ssPhotoQuality で見てもらう。
     ほとんど見本と合っていない（'bad'）時は判定へ進まず、カメラの画面のまま撮り直す（1.5秒は次を撮らない）。
     少し怪しい牌を二番目に似た牌へ入れ替えると攻守が変わる時（flip・v1477）も、同じく撮り直す。撮り直しは回数で打ち切らない。
     読めた・少し怪しくても攻守が変わらない・見本が空・本体がまだ読み込めていない時は、今まで通り進む。 */
  var retakeHoldUntil = 0;
  function appWin(){ try{ var w = document.getElementById('app').contentWindow; return (w && typeof w.ssPhotoQuality === 'function') ? w : null; }catch(e){ return null; } }
  function preloadApp(){ var fr = document.getElementById('app'); if(!fr.getAttribute('src')) fr.src = 'koushu-handan.html'; }
  function shrink(img){ var sc = Math.min(1, 1280 / img.width), c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; }
  function shoot(){
    if(!video.videoWidth || !video.videoHeight) return;
    var cv = document.createElement('canvas');
    cv.width = video.videoWidth; cv.height = video.videoHeight;
    cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);
    var w = appWin();
    if(w){
      var q = null;
      try{ q = w.ssPhotoQuality(shrink(cv)); }catch(e){ q = null; }
      window._ssLastQuality = q;
      if(q && (q.verdict === 'bad' || q.flip)){
        okSince = 0; greenSince = 0; seenSince = 0; shot = false; guideColor(false);
        retakeHoldUntil = Date.now() + 1500;
        stateText('読めませんでした。撮り直します');
        return;
      }
    }
    camStop();
    try{ window.ssReaderTake(cv); }catch(e){ msg.textContent = '預かりに失敗しましたわ: ' + e.message; }
  }
  window.ssReaderTake = function(img){
    var sc = Math.min(1, 1280 / img.width);
    var cv = document.createElement('canvas');
    cv.width = Math.round(img.width * sc);
    cv.height = Math.round(img.height * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    var data = cv.toDataURL('image/jpeg', 0.85);
    localStorage.setItem('ssHandoff', data);
    localStorage.setItem('ssResumeAt', String(Date.now()));
    msg.textContent = '受け取りましたわ。本体を開いて判定いたしますの…';
    var fr = document.getElementById('app');
    var w = null; try{ w = fr.contentWindow; }catch(e){}
    if(w && typeof w.ssTakeHandoff === 'function'){   /* 先に読み込んだ本体へ、読み直さずに渡す（v1475） */
      localStorage.removeItem('ssHandoff');
      fr.style.display = 'block';
      w.ssTakeHandoff(data);
      return;
    }
    fr.src = 'koushu-handan.html';
    fr.style.display = 'block';
  };
  document.getElementById('f').addEventListener('change', function(ev){
    var file = ev.target.files && ev.target.files[0];
    if(!file) return;
    msg.textContent = '受け取りましたわ。縮小して本体へ運びますの…';
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        window.ssReaderTake(img);
        URL.revokeObjectURL(url);
      }catch(e){
        msg.textContent = '預かりに失敗しましたわ: ' + e.message;
      }
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      msg.textContent = '画像を読み込めませんでしたわ。もう一度お選びくださいまし';
    };
    img.src = url;
    ev.target.value = '';
  });
})();
</script>
</body>
</html>
